<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>LIVE FEED</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:  #DA1A32;
      --navy: #ff6600;
      --card: rgba(17, 17, 17, 0.82);
      --muted: rgba(255,255,255,0.55);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: "DM Sans", sans-serif;
  color: #fff;
  background: #ff0033;
  animation: bgShift 30s linear infinite;
}

@keyframes bgShift {
  0%   { background-color: #ff0033; }  /* red */
  16%  { background-color: #ff6600; }  /* orange */
  32%  { background-color: #fff700; }  /* yellow */
  48%  { background-color: #33ff9c; }  /* green */
  64%  { background-color: #3341ff; }  /* blue */
  80%  { background-color: #ff00f7; }  /* pink */

  /* 👇 smooth transition BACK to red */
  100% { background-color: #ff0033; }
}

    /* ── SCENE ── */
    .scene {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Stage wraps lb panel + column + draw panel side by side */
    .stage {
      display: flex;
      align-items: stretch; /* lb panel stretches to match feed column height */
      max-height: 100vh;
    }

    /* ── COLUMN — feed side ── */
    .column {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      align-self: flex-start; /* don't stretch — keep its own intrinsic height */
      width: min(56vh, calc(100vw - clamp(48px, 8vw, 160px)));
      max-height: 100vh;
      padding: clamp(14px, 2.5vh, 40px) 0;
      flex-shrink: 1;
      min-width: 0;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stage.draw-open .column {
      transform: translateX(calc(-1 * clamp(16px, 2vw, 36px)));
    }

    /* ── LEADERBOARD SIDE PANEL (slides in from LEFT) ── */
    #lbPanel {
      order: -1;
      flex-shrink: 0;
      align-self: stretch; /* match the stage height — same as column's natural height */
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2.5vh, 40px) 0 clamp(14px, 2.5vh, 40px);
      /* Width and gap both animate from 0 → target so it takes no layout space when hidden */
      width: 0;
      margin-right: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition:
        width        0.5s cubic-bezier(0.22, 1, 0.36, 1),
        margin-right 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity      0.4s ease;
    }
    #lbPanel.show {
      width: clamp(160px, 22vh, 300px);
      margin-right: clamp(100px, 1.8vw, 28px);
      overflow: visible;
      opacity: 1;
      pointer-events: auto;
      height: auto;
      margin-bottom: 3.6vh;
    }

    /* Invisible header clone — aligns card top with feed top */
    #lbPanelSpacer {
      visibility: hidden;
      pointer-events: none;
      flex-shrink: 0;
      height: calc(clamp(30px, 4vh, 48px) + clamp(10px, 1.5vh, 20px));
    }

    /* Card stretches to fill the panel — same TOTAL height as the camera column */
    #lbPanelCard {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: clamp(10px, 1.2vh, 16px);
      width: 100%;
      flex: 1;
      min-height: 0;
      box-shadow: 0 12px 48px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: clamp(10px, 1.3vh, 18px) clamp(10px, 1.2vh, 16px);
      gap: clamp(6px, 0.8vh, 10px);
    }

    #lbPanelTitle {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.4vh, 16px);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
    }

    #lbPanelRows {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.55vh, 8px);
      flex: 1;
      overflow: hidden; /* don't overflow the card */
    }

    .lb-panel-row {
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.8vh, 10px);
      padding: clamp(6px, 0.8vh, 11px) clamp(8px, 1vh, 12px);
      border-radius: clamp(6px, 0.7vh, 10px);
      background: rgba(84,209,138,0.12);
      border: 1px solid rgba(84,209,138,0.25);
      flex-shrink: 0;
      animation: lbRowIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes lbRowIn {
      from { opacity:0; transform:translateX(-14px); }
      to   { opacity:1; transform:none; }
    }
    .lb-panel-medal {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(14px, 1.8vh, 22px);
      flex-shrink: 0;
      line-height: 1;
      min-width: 1.5em;
      text-align: center;
    }
    .lb-panel-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(12px, 1.6vh, 20px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    #lbPanelEmpty {
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(11px, 1.3vh, 15px);
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: clamp(8px, 1vh, 14px) 0;
      flex-shrink: 0;
    }

    /* ── DRAWING SIDE PANEL ── */
    #drawPanel {
      flex-shrink: 1;
      align-self: flex-start; /* keep its own intrinsic height */
      min-width: 0;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2.5vh, 40px) 0 clamp(14px, 2.5vh, 40px);
      /* Gap between camera column and drawing panel */
      margin-left: clamp(12px, 1.8vw, 28px);
      transform: translateX(calc(100% + clamp(12px, 1.8vw, 28px)));
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity   0.4s ease;
      width: 0;
      overflow: hidden;
    }
    #drawPanel.show {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      width: min(56vh, calc(100vw - clamp(48px, 8vw, 160px)));
      max-width: calc(100vw - min(56vh, calc(100vw - clamp(48px, 8vw, 160px))) - clamp(16px, 2vw, 36px) - clamp(28px, 4vw, 60px));
      overflow: visible;
    }

    /* ─── WORDLE PANEL ─── slides in from right, mirrors drawPanel structure */
    #wordlePanel {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-self: stretch;
      margin-left: clamp(12px, 1.8vw, 28px);
      transform: translateX(calc(100% + clamp(12px, 1.8vw, 28px)));
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity   0.4s ease,
        width     0.5s cubic-bezier(0.22, 1, 0.36, 1),
        margin-left 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      width: 0;
      overflow: hidden;
    }
    #wordlePanel.show {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      width: min(46vh, calc(100vw - clamp(48px, 8vw, 160px)));
      max-width: calc(100vw - min(46vh, calc(100vw - clamp(48px, 8vw, 160px))) - clamp(16px, 2vw, 36px) - clamp(28px, 4vw, 60px));
      overflow: visible;
    }
    /* While hiding, collapse the left margin so the panel slides AWAY rather than
       leaving a phantom gap next to the cam (matches drawPanel feel) */
    #wordlePanel:not(.show) { margin-left: 0; }
    #wordlePanelCard {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: clamp(10px, 1.2vh, 16px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: clamp(10px, 1.4vh, 20px);
      gap: clamp(10px, 1.4vh, 18px);
    }
    #wordlePanelEyebrow {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.3vh, 15px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 0.8vh, 10px);
      min-height: clamp(16px, 2vh, 22px); /* reserve space so layout doesn't shift on results */
      position: relative; /* anchor for absolute-positioned result text */
    }
    #wordlePanelLabel { letter-spacing: 0.18em; transition: opacity 0.3s ease; }
    /* During results phase the result message floats ABSOLUTELY over the eyebrow
       row so it can be visually large without pushing the grid container shorter.
       Layout dimensions stay fixed across phases — only the visual changes. */
    #wordlePanelEyebrow.results #wordlePanelLabel { display: none; }
    #wordlePanelEyebrow.results #wordlePanelGuesser {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-size: clamp(20px, 3.4vh, 38px);
      letter-spacing: 0.04em;
      animation: fadeUp 0.45s ease both;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #wordlePanelGuesser {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.85);
      text-transform: none;
      font-size: clamp(10px, 1.2vh, 14px);
    }
    /* Turn timer bar — pinned to the bottom of the eyebrow row so its
       show/hide doesn't reflow the grid container below. The eyebrow already
       has position:relative as the result-text anchor, so we can absolute-
       position the bar against it without adding extra wrapper markup. */
    #wordleTurnTimerBar {
      position: absolute;
      left: 0; right: 0; bottom: -6px; /* sits just below the eyebrow text */
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #wordleTurnTimerBar.show { opacity: 1; }
    #wordleTurnTimerFill {
      height: 100%;
      width: 100%;
      background: white;
      border-radius: 99px;
      transition: width 1s linear, background 0.4s ease;
    }
    /* Eyebrow result text — uses the existing #wordlePanelGuesser slot during
       results phase to announce winner / no-winner, replacing the banner. */
    #wordlePanelGuesser.win {
      color: #b9e6a3;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    #wordlePanelGuesser.lose {
      color: #ff9eaa;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #wordleGrid {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.6vh, 8px);
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      align-items: center;
      justify-content: center;
    }
    .wordle-row {
      display: grid;
      gap: clamp(4px, 0.6vh, 8px);
      flex: 0 0 auto;
      /* Row height equals the cell size — JS computes this on render based on
         actual container dimensions so it adapts to any (rows × cols) config */
      height: var(--wordle-out-cell, 48px);
    }
    .wordle-cell {
      width:  var(--wordle-out-cell, 48px);
      height: var(--wordle-out-cell, 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      /* Letter font scales with cell size */
      font-size: calc(var(--wordle-out-cell, 48px) * 0.62);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      background: transparent;
      text-transform: uppercase;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
    }
    /* Cell states — used in Phase 2 onward */
    .wordle-cell.filled  { border-color: rgba(255, 255, 255, 0.5); }
    .wordle-cell.correct { background: #538d4e; border-color: #538d4e; }
    .wordle-cell.present { background: #b59f3b; border-color: #b59f3b; }
    .wordle-cell.absent  { background: #3a3a3c; border-color: #3a3a3c; }
    /* Cell flip animation when a row is evaluated */
    @keyframes wordleFlip {
      0%   { transform: rotateX(0deg); }
      50%  { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }
    .wordle-cell.flipping { animation: wordleFlip 0.5s ease-in-out; }

    /* On-screen keyboard — visual only on output, reflects accumulated letter states */
    #wordleKeyboard {
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.5vh, 6px);
      width: 100%;
      align-items: center;
    }
    .wordle-kb-row {
      display: flex;
      gap: clamp(3px, 0.5vh, 6px);
      justify-content: center;
      width: 100%;
    }
    .wordle-key {
      flex: 1;
      max-width: clamp(20px, 3.5vh, 40px);
      aspect-ratio: 2 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.6vh, 18px);
      color: white;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      text-transform: uppercase;
      transition: background 0.3s ease;
    }
    .wordle-key.correct { background: #538d4e; }
    .wordle-key.present { background: #b59f3b; }
    .wordle-key.absent  { background: #3a3a3c; }

    /* Drawing panel card */
    #drawPanelCard {
      position: relative; /* anchor for #skribblGuessLayer */
      background: rgba(255,255,255,0.95);
      border-radius: clamp(10px, 1.2vh, 16px);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 4;
      box-shadow: 0 12px 48px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }
    /* Eyebrow row: label on left, countdown timer on right */
    #drawPanelEyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 0.8vh, 10px);
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.4vh, 16px);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--red);
      padding: clamp(8px, 1vh, 14px) clamp(10px, 1.2vh, 16px) clamp(4px, 0.5vh, 8px);
      flex-shrink: 0;
    }
    #drawPanelTimer {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.4vh, 16px);
      letter-spacing: 1px;
      color: var(--red);
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #drawPanelTimer.show { opacity: 1; }
    #drawPanelTimer.urgent { color: #cc0000; }
    #drawPanelImg {
      width: 100%;
      flex: 1;
      object-fit: contain;
      display: block;
      background: white;
      transition: opacity 0.35s ease;
    }

    /* ── SKRIBBL HINT UNDERSCORES (below drawing panel) ── */
    #skribblHintDisplay {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(6px, 0.8vh, 10px);
      padding: clamp(6px, 1vh, 12px) 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #skribblHintDisplay.show { opacity: 1; }

    .hint-word {
      display: flex;
      gap: clamp(3px, 0.4vh, 5px);
      align-items: flex-end;
    }
    .hint-letter {
      width: clamp(16px, 2.2vh, 28px);
      height: clamp(20px, 2.8vh, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2.5px solid white;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(14px, 1.9vh, 24px);
      color: white;
      text-transform: uppercase;
    }
    .hint-letter.revealed {
      color: white;
      border-bottom-color: white;
    }
    .hint-word-spacer {
      width: clamp(8px, 1.2vh, 16px);
    }

    /* ── HEADER ── */
    .header {
        font-family: 'Krona One', sans-serif;

      display: flex;
      align-items: center;
      gap: clamp(8px, 1vh, 14px);
      margin-bottom: clamp(10px, 1.5vh, 20px);
      flex-shrink: 0;
    }
    .header-accent {
      width: 3px;
      height: clamp(22px, 3vh, 36px);
      background: var(--red);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .header img {
      width: clamp(30px, 4vh, 48px);
      height: clamp(30px, 4vh, 48px);
      object-fit: contain;
      border-radius: 8px;
    }
    .header-title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: clamp(18px, 2.4vh, 32px);
      color: white;
    }

    /* ── HEADER TITLE fills available space ── */
    .header-title { flex: 1; }

    /* ── LIVE NAME SLOT (right side of header) ── */
    #liveNameSlot {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.8vh, 10px);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #liveNameSlot.show { opacity: 1; }

    .name-dot {
      display: inline-block;
      width: clamp(6px, 0.8vh, 9px);
      height: clamp(6px, 0.8vh, 9px);
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      margin-right: clamp(5px, 0.6vh, 8px);
      vertical-align: middle;
      animation: livePulse 1s ease-in-out infinite;
    }

    /* Clip window — one name visible at a time.
       Uses overflow:hidden for the slot machine clip.
       Labels stack vertically via translateY so the window
       only needs to be tall enough for one line. Width is
       driven by the label content naturally. */
    .name-window {
      height: clamp(18px, 2.4vh, 30px);
      overflow: hidden;
      position: relative;
      max-width: clamp(140px, 22vw, 340px);
      /* Flex column so labels stack — only visible one shows through clip */
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .name-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(14px, 1.9vh, 26px);
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
      line-height: 1;
      flex-shrink: 0;
      text-align: right;
    }

    .name-label.current {
      transform: translateY(0);
      opacity: 1;
      transition:
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity   0.4s ease;
    }
    .name-label.exit-up {
      transform: translateY(-120%);
      opacity: 0;
      transition:
        transform 0.45s cubic-bezier(0.55, 0, 0.45, 1),
        opacity   0.3s ease;
    }
    .name-label.enter-from-below {
      transform: translateY(120%);
      opacity: 0;
      transition: none;
    }

    /* ── FEED ── */
    #feedWrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: clamp(10px, 1.2vh, 16px);
      overflow: hidden;
      background: rgba(255,255,255,0.04);
      flex-shrink: 1;
      min-height: 0;
      /* isolation ensures absolute children fill correctly */
      isolation: isolate;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 12px 48px rgba(0,0,0,0.55);
    }

    #liveImage {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    #liveImage.visible {
      opacity: 1;
    }

    /* Drawing round timer — thin progress bar overlaid on the bottom edge of the feed.
       Visible only during a timed drawing round. Drains as time runs out. */
    #drawTimerOverlay {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #drawTimerOverlay.show { opacity: 1; }
    #drawTimerOverlayFill {
      height: 100%;
      background: white;
      width: 100%;
      transition: width 1s linear, background 0.4s ease;
    }

    /* LIVE pip */
    #livePip {
      position: absolute;
      top: 12px; right: 12px;
      display: flex;
      align-items: center; gap: 5px;
      background: var(--red);
      padding: clamp(3px,0.5vh,6px) clamp(7px,1vh,12px);
      border-radius: 5px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(10px, 1.4vh, 16px);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #livePip.show { opacity: 1; pointer-events: auto; }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%; background: white;
      animation: livePulse 1s ease-in-out infinite;
    }

    /* Empty state — starts visible, fades out when stream begins */
    #emptyState {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px;
      opacity: 0;                /* start invisible — revealed by JS after Firebase responds */
      transition: opacity 0.5s ease;
    }
    #emptyState.visible { opacity: 1; }
    #emptyState.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .empty-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(25px, 2vh, 50px);
      color: rgba(255,255,255,1);
      animation: breathe 2s ease-in-out infinite;
    }
    #qrImage {
      width: clamp(90px, 13vh, 170px);
      height: auto; margin: clamp(8px,1.2vh,18px) 0;
      animation: breathe 2s ease-in-out infinite;
    }
    /* Offline block — shown instead of QR when fan cam is off */
    #offlineBlock {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 0.8vh, 10px);
      text-shadow: 0px 2px 10px #000000;
    }
    #offlineBlock.show { display: flex; }
    #offlineBlock .off-icon {
      font-size: clamp(28px, 4vh, 48px);
      line-height: 1;
    }
    #offlineBlock .off-title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(25px, 2vh, 30px);
      color: rgba(255,255,255,1);
    }
    #offlineBlock .off-msg {
      font-size: clamp(13px, 1.3vh, 15px);
      color: rgba(255, 255, 255, 1);
      line-height: 1.5;
    }

    /* Bad connection */
    #badOverlay {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(13px, 1.8vh, 22px);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #badOverlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .bad-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      animation: breathe 0.9s ease-in-out infinite;
    }

    /* ── INFO PANEL ──
       Expands downward below the feed pushing it up.
       Uses max-height trick with a generous ceiling value. */
    #infoPanel {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 0.9vh, 12px);
      overflow: hidden;
      max-height: 0;
      margin-top: 0;
      /* Spring-style expand/collapse */
      transition:
        max-height   0.6s cubic-bezier(0.22, 1, 0.36, 1),
        margin-top   0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #infoPanel.has-content {
      max-height: 55vh;
      margin-top: clamp(8px, 1.2vh, 16px);
    }

    /* ── INFO CARDS ──
       Each card starts invisible + shifted down.
       Entrance: spring slide up + fade in.
       Exit:     ease-in slide down + fade out (applied via .hiding class). */
    .info-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: clamp(8px, 1vh, 14px);
      padding: clamp(12px, 1.6vh, 22px) clamp(14px, 1.8vh, 24px);
      display: none;
      /* Default hidden state */
      opacity: 0;
      transform: translateY(22px);
      /* Entrance timing — smooth spring */
      transition:
        opacity   0.5s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .info-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
    /* Exit state — applied briefly before display:none */
    .info-card.hiding {
      opacity: 0;
      transform: translateY(14px);
      transition:
        opacity   0.35s ease-in,
        transform 0.35s ease-in;
    }

    .card-eyebrow {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(9px, 1.1vh, 13px);
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: clamp(4px, 0.6vh, 8px);
    }
    .card-body {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(16px, 2.2vh, 30px);
      line-height: 1.15;
    }

    /* Poll bars */
    #pollBars {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 0.9vh, 12px);
      margin-top: clamp(6px, 0.9vh, 12px);
    }
    .bar-row { display: flex; flex-direction: column; gap: clamp(3px, 0.4vh, 5px); }
    .bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .bar-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(13px, 1.8vh, 22px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .bar-pct {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(13px, 1.8vh, 22px);
      color: var(--muted);
      flex-shrink: 0;
    }
    .bar-track {
      height: clamp(4px, 0.6vh, 8px);
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--red);
      border-radius: 99px;
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      width: 0%;
    }

    /* ── ANIMATIONS ── */
    @keyframes breathe   { 0%,100%{opacity:.4;} 50%{opacity:1;} }
    @keyframes livePulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(.4);opacity:.4;} }

    /* ── SKRIBBL — FLOATING GUESS REACTIONS ── */
    #skribblGuessLayer {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden;
      z-index: 10;
    }
    .floating-guess {
      position: absolute;
      /* JS sets --start-x, --end-x, --tilt, --drift-y, --rise */
      left: var(--start-x);
      bottom: -10%;
      transform: translate(-50%, 0) scale(0.4) rotate(0deg);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      color: white;
      padding: clamp(8px, 1vh, 14px) clamp(14px, 1.5vh, 22px);
      border-radius: 99px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(14px, 1.7vh, 22px);
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-transform: uppercase;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      opacity: 0;
      animation:
        guessPopIn   0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
        guessDrift   5s    cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards,
        guessFadeOut 1.2s  ease-in 4.25s forwards;
    }
    .floating-guess .guess-name {
      display: inline-block;
      opacity: 0.55;
      font-weight: 700;
      margin-right: 0.4em;
    }
    .floating-guess .guess-text {
      display: inline-block;
      font-weight: 900;
      color: #fff;
    }
    /* Correct-guess styling kept in case it's ever re-enabled — but currently unused
       since correct guesses are filtered out of the float layer. */
    .floating-guess.correct {
      background: rgba(84, 209, 138, 0.92);
      color: #09180f;
      border-color: rgba(255, 255, 255, 0.4);
      font-size: clamp(16px, 2vh, 26px);
    }
    .floating-guess.correct .guess-name { opacity: 0.7; color: #09180f; }
    .floating-guess.correct .guess-text { color: #09180f; }

    /* Pop into existence with a slight overshoot — gives the bubble personality */
    @keyframes guessPopIn {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.4) rotate(0deg); }
      70%  { opacity: 1; transform: translate(-50%, -20px) scale(1.08) rotate(var(--tilt)); }
      100% { opacity: 1; transform: translate(-50%, -28px) scale(1) rotate(var(--tilt)); }
    }
    /* Drift diagonally upward toward the end-x position with a gentle vertical sway */
    @keyframes guessDrift {
      0%   { transform: translate(-50%, -28px) scale(1) rotate(var(--tilt)); }
      100% {
        left: var(--end-x);
        transform: translate(-50%, calc(-1 * var(--rise))) scale(1) rotate(calc(var(--tilt) * -0.5));
      }
    }
    /* Soft fade out near the end of the drift */
    @keyframes guessFadeOut {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Leaderboard card — lives in infoPanel like other cards */
    #skribblLbCard { display: none; }
    #skribblLbCard.show { display: block; }
    #skribblLbRows { display: flex; flex-direction: column; gap: clamp(5px,0.7vh,9px); margin-top: clamp(6px,0.9vh,12px); }
    .lb-row {
      display: flex; align-items: center; gap: clamp(8px,1vh,14px);
      padding: clamp(7px,1vh,13px) clamp(10px,1.2vh,16px);
      border-radius: clamp(6px,0.8vh,12px);
      background: rgba(84,209,138,0.12);
      border: 1px solid rgba(84,209,138,0.28);
      animation: lbSlide 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes lbSlide {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:none; }
    }
    .lb-medal {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(16px,2.2vh,28px);
      flex-shrink: 0;
      min-width: 1.5em;
      text-align: center;
    }
    .lb-name  {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(14px,1.9vh,26px);
      flex: 1;
    }

    /* Winner banner over feed — now just a brief flash, leaderboard is the main UI */
    #skribblWinnerOverlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      z-index: 8;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      flex-direction: column; gap: 8px; text-align: center; padding: 20px;
    }
    #skribblWinnerOverlay.show { opacity: 1; }
    #skribblWinnerOverlay .win-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(20px, 2.8vh, 36px);
      color: var(--good, #54d18a);
    }
    #skribblWinnerOverlay .win-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(14px, 1.8vh, 22px);
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
<!-- Skribbl audio cues — preloaded, played by phase/leaderboard/timer events -->
<audio id="sndStart"   src="assets/start.mp3"   preload="auto"></audio>
<audio id="sndTick"    src="assets/tick.mp3"    preload="auto"></audio>
<audio id="sndCorrect" src="assets/correct.mp3" preload="auto"></audio>
<audio id="sndEnd"     src="assets/end.mp3"     preload="auto"></audio>
<!-- Activity send cue — plays when teacher sends trivia / poll / drawing prompt -->

<!-- Drawing round time-up cue -->

<div class="scene">
  <div class="stage" id="stage">

  <!-- Leaderboard panel — slides in from LEFT during skribbl -->
  <div id="lbPanel">
    <div id="lbPanelSpacer"></div>
    <div id="lbPanelCard">

    </div>
  </div>

  <div class="column">

    <div class="header">

        <div class="name-window" id="nameWindow"></div>

    <div id="feedWrap">

        <div id="offlineBlock">

      </div>
      <!-- Drawing round timer — thin bar at the bottom of the feed -->

    <div id="infoPanel">

  </div>

  <!-- Drawing side panel — slides in from right (shared by draw reveal + skribbl live) -->
  <div id="drawPanel">
    <!-- Invisible header clone — keeps card top aligned with feed top at all viewport sizes -->
    <div class="header" aria-hidden="true" style="visibility:hidden;pointer-events:none;">
      <div class="header-accent"></div>
      <img src="assets/mestv.png" alt="">
      <div class="header-title">MANATEE CAM</div>

    <div id="drawPanelCard">
      <div id="drawPanelEyebrow">
        <span id="drawPanelLabel">DRAWING</span>

      <!-- Static reveal image (draw mode) -->
      <img id="drawPanelImg" alt="student drawing" style="display:none;">
      <!-- Live canvas stream (skribbl mode) -->
      <img id="skribblLiveImg" alt="live drawing" style="width:100%;flex:1;object-fit:contain;display:none;background:white;">
      <!-- Floating guesses layer — overlays the drawing so reactions show where eyes are -->

    <!-- Hint underscores — only visible during skribbl mode -->

  <!-- ─── WORDLE side panel ─── slides in from right when wordle mode is active.
       Phase 1: just an empty grid sized to word length × attempts. -->
  <div id="wordlePanel">
    <div class="header" aria-hidden="true" style="visibility:hidden;pointer-events:none;">
      <div class="header-accent"></div>

    <div id="wordlePanelCard">
      <div id="wordlePanelEyebrow">
        <span id="wordlePanelLabel">WORDLE</span>
        <span id="wordlePanelGuesser"></span>
        <!-- Turn timer bar — pinned to the bottom edge of the eyebrow so its
             show/hide is opacity-only and doesn't reflow the grid below -->
        <div id="wordleTurnTimerBar"><div id="wordleTurnTimerFill"></div></div>

      <div id="wordleGrid"></div>

  </div><!-- /stage -->
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, onValue, off } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const liveImage      = document.getElementById("liveImage");
const emptyState     = document.getElementById("emptyState");
const badOverlay     = document.getElementById("badOverlay");
const liveNameSlot   = document.getElementById("liveNameSlot");
const nameWindow     = document.getElementById("nameWindow");
const livePip        = document.getElementById("livePip");
const infoPanel      = document.getElementById("infoPanel");
const questionCard   = document.getElementById("questionCard");
const questionEyebrow= document.getElementById("questionEyebrow");
const questionText   = document.getElementById("questionText");
const pollCard       = document.getElementById("pollCard");
const pollBars       = document.getElementById("pollBars");
const answerCard     = document.getElementById("answerCard");
const answerText     = document.getElementById("answerText");
const classCard        = document.getElementById("classCard");
const classText        = document.getElementById("classText");
const stage              = document.getElementById("stage");
const drawPanel          = document.getElementById("drawPanel");
const drawPanelEyebrow   = document.getElementById("drawPanelEyebrow");
const drawPanelLabel     = document.getElementById("drawPanelLabel");
const drawPanelTimer     = document.getElementById("drawPanelTimer");
const drawPanelImg       = document.getElementById("drawPanelImg");
const skribblLiveImg     = document.getElementById("skribblLiveImg");
const skribblGuessLayer  = document.getElementById("skribblGuessLayer");
const skribblWinnerOverlay = document.getElementById("skribblWinnerOverlay");
const skribblWinName     = document.getElementById("skribblWinName");
const skribblHintDisplay = document.getElementById("skribblHintDisplay");
const lbPanel            = document.getElementById("lbPanel");
const lbPanelRows        = document.getElementById("lbPanelRows");
const lbPanelEmpty       = document.getElementById("lbPanelEmpty");

/* ─── WORDLE elements ─── */
const wordlePanel         = document.getElementById("wordlePanel");
const wordleGrid          = document.getElementById("wordleGrid");
const wordleKeyboard      = document.getElementById("wordleKeyboard");
const wordlePanelEyebrow  = document.getElementById("wordlePanelEyebrow");
const wordlePanelGuesser  = document.getElementById("wordlePanelGuesser");
const wordleTurnTimerBar  = document.getElementById("wordleTurnTimerBar");
const wordleTurnTimerFill = document.getElementById("wordleTurnTimerFill");

const activeUserRef  = ref(db, "live/activeUser");
const frameRef       = ref(db, "live/frame");
const heartbeatRef   = ref(db, "live/heartbeat");
const fanCamOnRef    = ref(db, "meta/fanCamOn");

/* ── FAN CAM ON/OFF ── */
const qrImage     = document.getElementById("qrImage"); // kept for layout
const onlineBlock  = document.getElementById("onlineBlock");
const offlineBlock = document.getElementById("offlineBlock");
onValue(fanCamOnRef, snap => {
  const on = snap.val() !== false; // null (never set) = treat as on
  onlineBlock.style.display  = on  ? "" : "none";
  offlineBlock.classList.toggle("show", !on);
  // Fade in now that we know the correct state
  emptyState.classList.add("visible");
});
const triviaModeRef  = ref(db, "trivia/mode");
const triviaQRef     = ref(db, "trivia/question");
const triviaCRef     = ref(db, "trivia/correct");
const revealRef      = ref(db, "trivia/reveal");
const pollsModeRef   = ref(db, "polls/mode");
const pollsQRef      = ref(db, "polls/question");
const pollsOptsRef   = ref(db, "polls/options");
const pollsTotalsRef = ref(db, "polls/totals");
const drawModeRef      = ref(db, "drawing/mode");
const drawRevealRef    = ref(db, "drawing/reveal");
const drawSubRef       = ref(db, "drawing/submissions");
const skribblModeRef   = ref(db, "skribbl/mode");
const skribblLiveRef   = ref(db, "skribbl/liveCanvas");
const skribblGuessRef  = ref(db, "skribbl/guesses");
const skribblWinnerRef = ref(db, "skribbl/winner");
const skribblHintRef   = ref(db, "skribbl/hint");
const skribblWordRef   = ref(db, "skribbl/word");

/* ─── WORDLE refs ─── */
const wordleModeRef          = ref(db, "wordle/mode");
const wordlePhaseRef         = ref(db, "wordle/phase");
const wordleWordRef          = ref(db, "wordle/word");
const wordleAttemptsRef      = ref(db, "wordle/attempts");
const wordleGuessesRef       = ref(db, "wordle/guesses");
const wordleKeyboardStateRef = ref(db, "wordle/keyboardState");
const wordleCurrentGuesserNameRef = ref(db, "wordle/currentGuesserName");
const wordleTurnEndEpochRef  = ref(db, "wordle/turnEndEpoch");
const wordleWinnerRef        = ref(db, "wordle/winner");
let activeUser     = null;
let lastFrame      = 0;
let lastHeartbeat  = 0;
let streamOn       = false;
let triviaOn    = false;
let pollsOn     = false;
let pollOptions = {};

const TIMEOUT_MS = 2500;
const visible    = new Set(); // tracks which card ids are shown

/* ── CARD ANIMATION ── */
function showCard(card, id) {
  visible.add(id);
  card.classList.remove("hiding");
  card.style.display = "block";
  card.offsetHeight; // reflow → ensures transform starts from translateY(22px)
  card.classList.add("show");
  infoPanel.classList.add("has-content");
}

function hideCard(card, id) {
  if (!visible.has(id)) return;
  visible.delete(id);
  // Trigger exit animation
  card.classList.add("hiding");
  card.classList.remove("show");
  setTimeout(() => {
    if (!card.classList.contains("show")) {
      card.classList.remove("hiding");
      card.style.display = "none";
    }
    if (visible.size === 0) infoPanel.classList.remove("has-content");
  }, 380);
}

/* ── FEED HELPERS ── */
// emptyState uses .hidden to hide (it starts visible)
// liveImage and badOverlay use .visible to show (they start hidden)
function showEmpty()  { emptyState.classList.remove("hidden"); }
function hideEmpty()  { emptyState.classList.add("hidden"); }
function showFeed()   { liveImage.classList.add("visible"); }
function hideFeed()   { liveImage.classList.remove("visible"); }
function showBad()    { badOverlay.classList.add("visible"); }
function hideBad()    { badOverlay.classList.remove("visible"); }

/* ── STREAM ── */
// Strategy: one persistent frame listener for the whole session.
// On user switch we just update activeUser — the listener automatically
// shows new frames as they arrive. No stop/start = no flicker.

function ensureStream() {
  if (streamOn) return;
  streamOn = true;
  // Heartbeat listener — updated independently of pixel diff skipping
  onValue(heartbeatRef, snap => {
    if (snap.val()) lastHeartbeat = performance.now();
  });
  onValue(frameRef, snap => {
    // Only show frames when someone is actually live
    if (!activeUser) return;
    const val = snap.val();
    // Must be a non-empty string starting with data: to be a valid frame
    if (!val || typeof val !== "string" || !val.startsWith("data:")) return;
    liveImage.src = val;
    showFeed();
    hideEmpty();
    hideBad();
    lastFrame = performance.now();
  });
}

function stopStream() {
  if (!streamOn) return;
  streamOn = false;
  off(frameRef);
  hideFeed();
  hideBad();
  showEmpty();
  setTimeout(() => { if (!streamOn) liveImage.src = ""; }, 500);
}

/* ── TRIVIA ── */
function startTrivia() {
  if (triviaOn) return;
  triviaOn = true;
  let triviaWasShown = false;
  let triviaFirstSnap = true; // skip the first snap so sent.mp3 doesn't replay on output refresh
  onValue(triviaQRef, snap => {
    const d = snap.val() || {};
    const isShown = !!(d.show && d.text);
    if (!triviaFirstSnap && isShown && !triviaWasShown) playSnd(sndSent);
    triviaFirstSnap = false;
    triviaWasShown = isShown;
    if (isShown) {
      questionEyebrow.textContent = "QUESTION";
      questionText.textContent = d.text;
      showCard(questionCard, "question");
    } else {
      hideCard(questionCard, "question");
    }
  });
  onValue(triviaCRef, snap => {
    const d = snap.val() || {};
    if (d.show && d.text) {
      answerText.textContent = d.text;
      showCard(answerCard, "answer");
    } else {
      hideCard(answerCard, "answer");
    }
  });
  onValue(revealRef, snap => {
    const r = snap.val() || {};
    const key = Object.keys(r).find(k => r[k]?.show === true);
    if (!key) { hideCard(classCard, "class"); return; }
    onValue(ref(db, `trivia/answers/${key}`), aSnap => {
      const d = aSnap.val() || {};
      if (d.answer) { classText.textContent = d.answer; showCard(classCard, "class"); }
      else hideCard(classCard, "class");
    }, { onlyOnce: true });
  });
}
function stopTrivia() {
  if (!triviaOn) return;
  triviaOn = false;
  off(triviaQRef); off(triviaCRef); off(revealRef);
  hideCard(questionCard, "question");
  hideCard(answerCard, "answer");
  hideCard(classCard, "class");
}

/* ── POLLS ── */
function renderBars(totals) {
  const keys = Object.keys(pollOptions);
  if (!keys.length) return;
  const total = keys.reduce((s, k) => s + (totals[k] || 0), 0);
  pollBars.innerHTML = "";
  const sorted = [...keys].sort((a,b) => (pollOptions[a]?.order??0) - (pollOptions[b]?.order??0));
  for (const key of sorted) {
    const label = pollOptions[key]?.label || key;
    const votes = totals[key] || 0;
    const pct   = total > 0 ? Math.round((votes / total) * 100) : 0;
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="bar-top">
        <span class="bar-label">${label}</span>
        <span class="bar-pct">${pct}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`;
    pollBars.appendChild(row);
  }
}
function startPolls() {
  if (pollsOn) return;
  pollsOn = true;
  let latestTotals = {};

  // Persistent options — always current before question shows
  onValue(pollsOptsRef, snap => {
    pollOptions = snap.val() || {};
    // If poll is already showing (e.g. output page opened mid-poll), re-render immediately
    if (pollCard.classList.contains("show")) renderBars(latestTotals);
  });

  // Totals — cache latest value and render if poll is visible
  onValue(pollsTotalsRef, snap => {
    latestTotals = snap.val() || {};
    if (pollCard.classList.contains("show")) renderBars(latestTotals);
  });

  // Question controls visibility — render bars immediately on show
  let pollWasShown = false;
  let pollFirstSnap = true; // skip the first snap so sent.mp3 doesn't replay on output refresh
  onValue(pollsQRef, snap => {
    const d = snap.val() || {};
    const isShown = !!(d.show && d.text);
    if (!pollFirstSnap && isShown && !pollWasShown) playSnd(sndSent);
    pollFirstSnap = false;
    pollWasShown = isShown;
    if (isShown) {
      questionEyebrow.textContent = "POLL";
      questionText.textContent = d.text;
      showCard(questionCard, "question");
      showCard(pollCard, "poll");
      // Render bars right away using whatever totals we already have
      renderBars(latestTotals);
    } else {
      hideCard(questionCard, "question");
      hideCard(pollCard, "poll");
      pollBars.innerHTML = "";
    }
  });
}
function stopPolls() {
  if (!pollsOn) return;
  pollsOn = false;
  off(pollsQRef); off(pollsOptsRef); off(pollsTotalsRef);
  hideCard(questionCard, "question");
  hideCard(pollCard, "poll");
  pollBars.innerHTML = "";
  pollOptions = {};
}

/* ── DRAWING SIDE PANEL ── */
let drawSubs = {};

function showDrawPanel(imgSrc, label, crossfade = false) {
  drawPanelLabel.textContent = label || "DRAWING";
  skribblLiveImg.style.display = "none";
  const panelAlreadyOpen = drawPanel.classList.contains("show");
  if (crossfade && panelAlreadyOpen) {
    // Panel is already open — crossfade the image instead of slide animating
    drawPanelImg.style.opacity = "0";
    setTimeout(() => {
      drawPanelImg.src = imgSrc;
      drawPanelImg.style.display = "block";
      drawPanelImg.style.opacity = "1";
    }, 200);
  } else {
    drawPanelImg.src = imgSrc;
    drawPanelImg.style.display = "block";
    drawPanelImg.style.opacity = "1";
    stage.classList.add("draw-open");
    drawPanel.classList.add("show");
  }
}
function hideDrawPanel() {
  stage.classList.remove("draw-open");
  drawPanel.classList.remove("show");
  setTimeout(() => { if (!drawPanel.classList.contains("show")) drawPanelImg.src = ""; }, 500);
}

let revealModeOn = false;
onValue(ref(db, "meta/revealMode"), snap => { revealModeOn = snap.val() === true; });

let drawingModeOn = false;
onValue(drawModeRef, snap => {
  drawingModeOn = snap.val() === true;
  if (!drawingModeOn) {
    hideDrawPanel();
    drawSubs = {};
    stopOutputDrawTimer(); // tear down the bar when leaving drawing mode entirely
  }
});
onValue(drawSubRef, snap => { drawSubs = snap.val() || {}; });

/* ── DRAWING ROUND TIMER ──
 * Thin bar overlaid on the bottom edge of the camera feed. Visible only during
 * a timed drawing round. Drains as time runs out; turns red in the last 10s.
 */
const drawTimerOverlay     = document.getElementById("drawTimerOverlay");
const drawTimerOverlayFill = document.getElementById("drawTimerOverlayFill");
let outputDrawTimerInterval = null;
let outputDrawTimerDurationMs = 60000;
function startOutputDrawTimer(timeEnd) {
  if (outputDrawTimerInterval) clearInterval(outputDrawTimerInterval);
  outputDrawTimerDurationMs = Math.max(1, timeEnd - Date.now());
  drawTimerOverlay.classList.add("show");
  let lastTickedSec = null;
  function tick() {
    const remaining = Math.max(0, timeEnd - Date.now());
    const secs = Math.ceil(remaining / 1000);
    const pct = (remaining / outputDrawTimerDurationMs) * 100;
    drawTimerOverlayFill.style.width = pct + "%";
    drawTimerOverlayFill.style.background = remaining <= 10000 ? "#ff647c" : "white";
    // Tick sound during final 10s — fire once per integer-second crossing
    if (secs > 0 && secs <= 10 && secs !== lastTickedSec) {
      lastTickedSec = secs;
      playSnd(sndTick);
    }
    if (remaining <= 0) {
      clearInterval(outputDrawTimerInterval);
      outputDrawTimerInterval = null;
      // Hide a moment after zero so viewers see the empty bar briefly
      setTimeout(() => drawTimerOverlay.classList.remove("show"), 800);
    }
  }
  tick();
  outputDrawTimerInterval = setInterval(tick, 500);
}
function stopOutputDrawTimer() {
  if (outputDrawTimerInterval) { clearInterval(outputDrawTimerInterval); outputDrawTimerInterval = null; }
  drawTimerOverlay.classList.remove("show");
  drawTimerOverlayFill.style.width = "100%";
}
onValue(ref(db, "drawing/timeEnd"), snap => {
  const timeEnd = snap.val();
  if (!drawingModeOn || !timeEnd) { stopOutputDrawTimer(); return; }
  startOutputDrawTimer(timeEnd);
});

/* Drawing round ended — fires whether by timer expiry or manual Times Up button.
   First-snap guard prevents the sound from replaying on output refresh if
   drawing/timesUp is still set in Firebase from an earlier round. */
let drawTimesUpFirstSnap = true;
onValue(ref(db, "drawing/timesUp"), snap => {
  const ts = snap.val();
  if (drawTimesUpFirstSnap) { drawTimesUpFirstSnap = false; return; }
  if (!drawingModeOn) return;
  if (!ts) return;
  playSnd(sndTime);
});

// Drawing prompt listener — purely for the sent.mp3 cue.
// Output doesn't display the drawing prompt itself (that's only on phones), but we still
// want to ring the sent sound on the speakers when teacher pushes a new drawing prompt.
let drawPromptWasShown = false;
let drawPromptFirstSnap = true; // skip the first snap so sent.mp3 doesn't replay on output refresh
onValue(ref(db, "drawing/prompt"), snap => {
  const d = snap.val() || {};
  const isShown = !!(d.show && d.text);
  if (!drawPromptFirstSnap && isShown && !drawPromptWasShown) playSnd(sndSent);
  drawPromptFirstSnap = false;
  drawPromptWasShown = isShown;
});

// Debounce hide so that when reveal mode swaps reveals (clear → set new),
// the brief null state doesn't collapse the panel before the new image arrives.
let drawHideTimer = null;

onValue(drawRevealRef, snap => {
  const r = snap.val() || {};
  const key = Object.keys(r).find(k => r[k]?.show === true);

  if (key && drawSubs[key]?.data) {
    // A reveal is active — cancel any pending hide and show the image
    if (drawHideTimer) { clearTimeout(drawHideTimer); drawHideTimer = null; }
    showDrawPanel(drawSubs[key].data, "DRAWING", revealModeOn);
  } else {
    // No reveal — if reveal mode is on, wait briefly in case a new one is coming
    // (control clears then immediately sets new reveal when switching person)
    if (revealModeOn && drawPanel.classList.contains("show")) {
      drawHideTimer = setTimeout(() => {
        drawHideTimer = null;
        hideDrawPanel();
      }, 600);
    } else {
      hideDrawPanel();
    }
  }
});

/* ── SKRIBBL SIDE PANEL ── */
let skribblOn = false;

const skribblLbCard      = document.getElementById("skribblLbCard");
const skribblLbRows      = document.getElementById("skribblLbRows");
const skribblLeaderboardRef = ref(db, "skribbl/leaderboard");
const skribblTimeEndRef     = ref(db, "skribbl/timeEnd");
const skribblPhaseRef       = ref(db, "skribbl/phase");

let skribblTimerInterval = null;
let skribblRoundDuration = 60000;

const MEDALS = ["🥇","🥈","🥉"];

/* ── LEADERBOARD PANEL (left side) ── */
function renderLbPanel(entries) {
  if (!entries || !entries.length) {
    lbPanelRows.innerHTML = `<div id="lbPanelEmpty" style="font-family:'Barlow Condensed',sans-serif;font-size:clamp(11px,1.3vh,15px);color:rgba(255,255,255,0.3);text-align:center;padding:clamp(8px,1vh,14px) 0;">Waiting…</div>`;
    return;
  }
  lbPanelRows.innerHTML = entries.map((e, i) => `
    <div class="lb-panel-row" style="animation-delay:${i * 0.05}s">
      <span class="lb-panel-medal">${MEDALS[i] || (i+1)}</span>
      <span class="lb-panel-name" title="${e.name}">${e.name}</span>
    </div>`).join("");
}

function showLbPanel() {
  lbPanel.classList.add("show");
  stage.classList.add("lb-open");
}
function hideLbPanel() {
  lbPanel.classList.remove("show");
  stage.classList.remove("lb-open");
}

/* ── TIMER IN DRAW PANEL EYEBROW ── */
function startOutputTimer(timeEnd) {
  if (skribblTimerInterval) clearInterval(skribblTimerInterval);
  skribblRoundDuration = Math.max(1, timeEnd - Date.now());
  drawPanelTimer.classList.add("show");
  let lastTickedSec = null;

  function tick() {
    const remaining = Math.max(0, timeEnd - Date.now());
    const secs = Math.ceil(remaining / 1000);
    drawPanelTimer.textContent = secs + "s";
    drawPanelTimer.classList.toggle("urgent", remaining <= 10000);
    // Tick sound during the final 10s — fire once per integer-second crossing
    if (secs > 0 && secs <= 10 && secs !== lastTickedSec) {
      lastTickedSec = secs;
      playSnd(sndTick);
    }
    if (remaining <= 0) {
      clearInterval(skribblTimerInterval);
      skribblTimerInterval = null;
      drawPanelTimer.textContent = "0s";
    }
  }
  tick();
  skribblTimerInterval = setInterval(tick, 500);
}

function stopOutputTimer() {
  if (skribblTimerInterval) { clearInterval(skribblTimerInterval); skribblTimerInterval = null; }
  drawPanelTimer.classList.remove("show", "urgent");
  drawPanelTimer.textContent = "";
}

/* ── RENDER INLINE LB CARD (infoPanel) — kept for reference ── */
function renderOutputLeaderboard(entries) {
  if (!entries || !entries.length) {
    skribblLbRows.innerHTML = `<div style="font-size:clamp(12px,1.4vh,16px);color:var(--muted);padding:clamp(4px,0.6vh,8px) 0;">Waiting for correct guesses…</div>`;
    return;
  }
  skribblLbRows.innerHTML = entries.map((e, i) => `
    <div class="lb-row" style="animation-delay:${i * 0.06}s">
      <span class="lb-medal">${MEDALS[i] || (i+1)}</span>
      <span class="lb-name">${e.name}</span>
    </div>`).join("");
}

function spawnFloatingGuess(text, correct) {
  const el = document.createElement("div");
  el.className = "floating-guess" + (correct ? " correct" : "");

  // Split "NAME: TEXT" into separate spans so the styling can dim the name
  const colonIdx = text.indexOf(":");
  if (colonIdx > 0 && !correct) {
    const name  = text.slice(0, colonIdx).trim();
    const guess = text.slice(colonIdx + 1).trim();
    el.innerHTML =
      `<span class="guess-name">${name}</span>` +
      `<span class="guess-text">${guess}</span>`;
  } else {
    // Fallback / correct path — just plain text
    el.textContent = (correct ? "✓ " : "") + text;
  }

  // Random horizontal start (10%–90%) and end (drift across by ±25%)
  const startPct = 12 + Math.random() * 76;
  const drift    = (Math.random() - 0.5) * 50; // -25% to +25%
  const endPct   = Math.max(5, Math.min(95, startPct + drift));
  // Random rise distance (45vh to 70vh) so bubbles don't all converge
  const rise     = 45 + Math.random() * 25;
  // Subtle rotation tilt — tighter range than before so it feels intentional
  const tilt     = (Math.random() - 0.5) * 10;

  el.style.setProperty("--start-x", startPct + "%");
  el.style.setProperty("--end-x",   endPct   + "%");
  el.style.setProperty("--rise",    rise     + "vh");
  el.style.setProperty("--tilt",    tilt     + "deg");

  skribblGuessLayer.appendChild(el);
  // Remove after animation completes (0.45 + 5 + 0.7 = ~6.15s — give buffer)
  setTimeout(() => el.remove(), 6500);
}

let skribblPhase = null; // "playing" | "results" | null
let prevLbCount  = 0;    // track leaderboard growth so we play correct.mp3 only on new entries

/* ── SKRIBBL AUDIO ── */
const sndStart   = document.getElementById("sndStart");
const sndTick    = document.getElementById("sndTick");
const sndCorrect = document.getElementById("sndCorrect");
const sndEnd     = document.getElementById("sndEnd");
const sndSent    = document.getElementById("sndSent");
const sndTime    = document.getElementById("sndTime");
function playSnd(el) {
  if (!el) return;
  try {
    el.currentTime = 0;
    const p = el.play();
    if (p && p.catch) p.catch(() => { /* autoplay-blocked; ignore */ });
  } catch (e) { /* ignore */ }
}

onValue(skribblModeRef, snap => {
  skribblOn = snap.val() === true;
  if (!skribblOn) {
    skribblLiveImg.style.display = "none";
    skribblLiveImg.src = "";
    skribblGuessLayer.innerHTML = "";
    skribblWinnerOverlay.classList.remove("show");
    seenGuesses.clear();
    skribblHintDisplay.classList.remove("show");
    skribblHintDisplay.innerHTML = "";
    stopOutputTimer();
    hideLbPanel();
    renderLbPanel([]);
    hideCard(skribblLbCard, "skribblLb");
    skribblLbRows.innerHTML = "";
    prevLbCount = 0;
    const drawRevealVisible = drawPanelImg.style.display !== "none" && drawPanelImg.src;
    if (!drawRevealVisible) hideDrawPanel();
  }
  // Do NOT show lb panel on mode start — it slides in only when first correct guess arrives
});

// Phase listener — "results" means slide drawing panel away, keep leaderboard up
let skribblCurrentWord = "";
onValue(skribblWordRef, snap => { skribblCurrentWord = snap.val() || ""; });

// Reveal the full word as filled-in hint cells (used in results phase)
function revealFullWord(word) {
  if (!word) return;
  const fullHint = word.split("").map(ch =>
    ch === " " ? { letter: " ", revealed: false } : { letter: ch, revealed: true }
  );
  renderHint(fullHint);
}

onValue(skribblPhaseRef, snap => {
  const prevPhase = skribblPhase;
  skribblPhase = snap.val();
  if (!skribblOn) return;
  if (skribblPhase === "results") {
    // Freeze the timer at 0
    stopOutputTimer();
    // Update the eyebrow label on the drawing panel: "LIVE DRAWING" → "IT WAS A..."
    drawPanelLabel.textContent = "🎨 IT WAS...";
    // Reveal every letter of the word in the hint display below the drawing
    revealFullWord(skribblCurrentWord);
    // Drawing stays visible — drawer's last frame is still up via skribblLiveImg
    // Play end-of-round cue (only on the actual transition into results)
    if (prevPhase !== "results") playSnd(sndEnd);
  } else if (skribblPhase === "playing") {
    // New round started — restore live drawing label + play start cue
    drawPanelLabel.textContent = "🎨 LIVE DRAWING";
    if (prevPhase !== "playing") playSnd(sndStart);
  } else if (skribblPhase === null && prevPhase === "results") {
    // Reset — clear the frozen drawing and tear down the panel
    skribblLiveImg.style.display = "none";
    skribblLiveImg.src = "";
    skribblHintDisplay.classList.remove("show");
    skribblHintDisplay.innerHTML = "";
    drawPanelLabel.textContent = "DRAWING";
    const drawRevealVisible = drawPanelImg.style.display !== "none" && drawPanelImg.src;
    if (!drawRevealVisible) hideDrawPanel();
  }
});

// Timer sync
onValue(skribblTimeEndRef, snap => {
  const timeEnd = snap.val();
  if (!skribblOn || !timeEnd) { stopOutputTimer(); return; }
  startOutputTimer(timeEnd);
});

// Live canvas stream from drawer
onValue(skribblLiveRef, snap => {
  const val = snap.val();
  if (!skribblOn) return;
  // Don't re-open the drawing panel if we're in results phase
  if (skribblPhase === "results") return;
  if (val && typeof val === "string" && val.startsWith("data:")) {
    skribblLiveImg.src = val;
    skribblLiveImg.style.display = "block";
    drawPanelImg.style.display = "none";
    drawPanelLabel.textContent = "🎨 LIVE DRAWING";
    stage.classList.add("draw-open");
    drawPanel.classList.add("show");
  } else if (val === null) {
    // Reset — clear the drawing
    skribblLiveImg.style.display = "none";
    skribblLiveImg.src = "";
    // Hide the drawing panel unless a static draw-mode reveal is in it
    const drawRevealVisible = drawPanelImg.style.display !== "none" && drawPanelImg.src;
    if (!drawRevealVisible) hideDrawPanel();
  }
});

// Leaderboard — fills in live as correct guesses come in
onValue(skribblLeaderboardRef, snap => {
  if (!skribblOn) return;
  const lb = snap.val();
  const entries = lb ? (Array.isArray(lb) ? lb : Object.values(lb)) : [];
  entries.sort((a, b) => (a.rank ?? 0) - (b.rank ?? 0));

  // Reset cleared the leaderboard — hide the panel
  if (entries.length === 0) {
    if (lbPanel.classList.contains("show")) hideLbPanel();
    renderLbPanel([]);
    prevLbCount = 0;
    return;
  }

  // Play correct cue when a new entry appears
  if (entries.length > prevLbCount) {
    playSnd(sndCorrect);
  }
  prevLbCount = entries.length;

  // First correct guess — slide the panel in
  if (!lbPanel.classList.contains("show")) showLbPanel();

  renderLbPanel(entries);

  // Flash winner overlay briefly for the very first correct guess
  if (entries.length === 1) {
    const first = entries[0];
    if (!skribblWinnerOverlay.classList.contains("show")) {
      skribblWinName.textContent = `${first.name} GOT IT FIRST!`;
      skribblWinnerOverlay.classList.add("show");
      setTimeout(() => skribblWinnerOverlay.classList.remove("show"), 2500);
    }
  }
});

// Floating guesses — only WRONG guesses bubble up.
// Correct guesses are intentionally hidden from the float so they don't
// leak the answer to other players watching the screen.
const seenGuesses = new Set();
let skribblGuessFirstSnap = true;
onValue(skribblGuessRef, snap => {
  if (!skribblOn) return;
  const all = snap.val() || {};
  // First snapshot on listener attach — mark all existing as seen but don't float them
  if (skribblGuessFirstSnap) {
    skribblGuessFirstSnap = false;
    Object.keys(all).forEach(k => seenGuesses.add(k));
    return;
  }
  Object.entries(all).forEach(([key, g]) => {
    if (seenGuesses.has(key)) return;
    seenGuesses.add(key);
    const guessText = (g.text || "").toLowerCase().trim();
    const word      = (skribblCurrentWord || "").toLowerCase().trim();
    // Skip floating if this guess matches the secret word (correct guess)
    if (word && guessText === word) return;
    spawnFloatingGuess(`${g.name}: ${g.text}`, false);
  });
});

/* ─── WORDLE (Phase 2: render guesses + keyboard with letter states) ─── */
let wordleOn       = false;
let wordleWord     = "";
let wordleAttempts = 6;
let wordleGuesses  = [];           // array of { text, evaluation, guesserKey, guesserName }
let wordleKbState  = {};           // { A: "absent", B: "present", ... }

const KB_ROWS = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["Z","X","C","V","B","N","M"],
];

function renderWordleGrid() {
  if (!wordleGrid) return;
  wordleGrid.innerHTML = "";
  const cols = wordleWord.length;
  if (cols === 0 || wordleAttempts <= 0) return;

  for (let r = 0; r < wordleAttempts; r++) {
    const row = document.createElement("div");
    row.className = "wordle-row";
    row.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    const guess = wordleGuesses[r]; // may be undefined if not yet guessed
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement("div");
      cell.className = "wordle-cell";
      if (guess) {
        const letter = (guess.text || "")[c] || "";
        const evalState = guess.evaluation?.[c] || "";
        if (letter) cell.textContent = letter.toUpperCase();
        if (evalState) cell.classList.add(evalState); // "correct" | "present" | "absent"
      }
      row.appendChild(cell);
    }
    wordleGrid.appendChild(row);
  }
  // Compute the largest square cell that fits both width AND height constraints
  // of the actual #wordleGrid container. Same pattern as the index overlay so
  // the panel stays put regardless of (rows × cols) and viewport size.
  sizeWordleOutputCells();
}

function sizeWordleOutputCells() {
  if (!wordleGrid) return;
  const cols = wordleWord.length;
  const rows = wordleAttempts;
  if (!cols || !rows) return;
  const containerW = wordleGrid.clientWidth;
  const containerH = wordleGrid.clientHeight;
  if (containerW <= 0 || containerH <= 0) return; // not yet laid out
  // Match the CSS gap: clamp(4px, 0.6vh, 8px). Approximate at runtime as 6px,
  // which is correct enough for the size math (off-by-2px doesn't visibly matter).
  const gap = 6;
  const maxByWidth  = (containerW - (cols - 1) * gap) / cols;
  const maxByHeight = (containerH - (rows - 1) * gap) / rows;
  // Cap at 60px (the original max) so a small grid like 5×3 still looks chunky
  const cellSize = Math.max(20, Math.min(maxByWidth, maxByHeight, 60));
  wordleGrid.style.setProperty("--wordle-out-cell", cellSize + "px");
}

// Recompute on container resize (handles viewport size changes, panel show/hide,
// 1080p vs 4K browser)
if (typeof ResizeObserver !== "undefined" && wordleGrid) {
  const wordleGridRO = new ResizeObserver(() => sizeWordleOutputCells());
  wordleGridRO.observe(wordleGrid);
}
window.addEventListener("resize", () => sizeWordleOutputCells());

function renderWordleKeyboard() {
  if (!wordleKeyboard) return;
  wordleKeyboard.innerHTML = "";
  for (const row of KB_ROWS) {
    const rowEl = document.createElement("div");
    rowEl.className = "wordle-kb-row";
    for (const letter of row) {
      const k = document.createElement("div");
      k.className = "wordle-key";
      k.textContent = letter;
      const state = wordleKbState[letter];
      if (state) k.classList.add(state);
      rowEl.appendChild(k);
    }
    wordleKeyboard.appendChild(rowEl);
  }
}

function showWordlePanel() {
  if (!wordlePanel) return;
  // Cancel any pending post-hide content cleanup since we're showing again
  if (wordlePanelHideTimeout) { clearTimeout(wordlePanelHideTimeout); wordlePanelHideTimeout = null; }
  wordlePanel.classList.add("show");
}
let wordlePanelHideTimeout = null;
function hideWordlePanel() {
  if (!wordlePanel) return;
  wordlePanel.classList.remove("show");
  // Defer content cleanup until the slide-out finishes (same pattern as drawPanel).
  // Without this delay, the grid + keyboard empty mid-transition and you see a
  // blank panel slide away instead of a populated one.
  if (wordlePanelHideTimeout) clearTimeout(wordlePanelHideTimeout);
  wordlePanelHideTimeout = setTimeout(() => {
    wordlePanelHideTimeout = null;
    if (wordlePanel.classList.contains("show")) return; // re-shown mid-fade — don't wipe
    if (wordleGrid)     wordleGrid.innerHTML = "";
    if (wordleKeyboard) wordleKeyboard.innerHTML = "";
    if (wordleTurnTimerBar) wordleTurnTimerBar.classList.remove("show");
    if (wordlePanelEyebrow) wordlePanelEyebrow.classList.remove("results");
    if (wordlePanelGuesser) {
      wordlePanelGuesser.textContent = "";
      wordlePanelGuesser.classList.remove("win", "lose");
    }
  }, 520); // slightly longer than 0.5s transition for a clean handoff
}

onValue(wordleModeRef, snap => {
  wordleOn = snap.val() === true;
  if (!wordleOn) {
    hideWordlePanel(); // handles content wipe + state classes after slide-out
    wordleWord = "";
    wordleGuesses = [];
    wordleKbState = {};
    if (wordleTickInterval) { clearInterval(wordleTickInterval); wordleTickInterval = null; }
  }
});

onValue(wordleAttemptsRef, snap => {
  wordleAttempts = parseInt(snap.val(), 10) || 6;
  if (wordleOn && wordleWord) renderWordleGrid();
});

onValue(wordleWordRef, snap => {
  wordleWord = (snap.val() || "").toUpperCase();
  if (wordleOn && wordleWord) {
    renderWordleGrid();
    renderWordleKeyboard();
    showWordlePanel();
  } else if (!wordleWord) {
    hideWordlePanel(); // handles content wipe after slide-out
    wordleGuesses = [];
    wordleKbState = {};
  }
});

// Guesses array — control writes here after evaluating each guess
onValue(wordleGuessesRef, snap => {
  const v = snap.val();
  // Firebase returns arrays as objects when there are gaps, so normalize
  wordleGuesses = v
    ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v))
    : [];
  if (wordleOn) renderWordleGrid();
});

// Keyboard state — control writes per-letter as guesses are evaluated
onValue(wordleKeyboardStateRef, snap => {
  wordleKbState = snap.val() || {};
  if (wordleOn) renderWordleKeyboard();
});

/* ─── Eyebrow text controller ───
 * The single #wordlePanelGuesser slot is repurposed across phases:
 *   • playing  → "ALICE's turn"   (updates as turn passes)
 *   • results  → "🎉 ALICE got it! Word was MANATEE"   (or "Nobody got it…")
 * Replaces the old separate result banner; keeps the panel from growing
 * vertically when the round ends.
 */
let wordlePhaseLocal = null;
let wordleTickInterval = null;
let wordleCurrentGuesserName = "";
let wordleWinnerLocal = null;

function paintWordleEyebrow() {
  if (!wordlePanelGuesser || !wordlePanelEyebrow) return;
  if (wordlePhaseLocal === "results" && wordleWinnerLocal) {
    const w = wordleWinnerLocal;
    wordlePanelEyebrow.classList.add("results");
    if (w.userKey && w.name) {
      wordlePanelGuesser.classList.add("win");
      wordlePanelGuesser.classList.remove("lose");
      wordlePanelGuesser.textContent = `${w.name} GOT IT!`;
    } else {
      wordlePanelGuesser.classList.add("lose");
      wordlePanelGuesser.classList.remove("win");
      wordlePanelGuesser.textContent = `IT WAS "${w.word || ""}"😔`;
    }
    return;
  }
  // Not results — turn-name mode (or empty)
  wordlePanelEyebrow.classList.remove("results");
  wordlePanelGuesser.classList.remove("win", "lose");
  wordlePanelGuesser.textContent = wordleCurrentGuesserName && wordlePhaseLocal === "playing"
    ? `${wordleCurrentGuesserName} IS GUESSING`
    : "";
}

onValue(wordlePhaseRef, snap => {
  wordlePhaseLocal = snap.val();
  // Hide timer bar when leaving playing state
  if (wordlePhaseLocal !== "playing") {
    if (wordleTurnTimerBar) wordleTurnTimerBar.classList.remove("show");
    if (wordleTickInterval) { clearInterval(wordleTickInterval); wordleTickInterval = null; }
  }
  paintWordleEyebrow();
  // Existing behavior: hide whole panel if everything is cleared
  if (wordlePhaseLocal === null && !wordleWord) {
    hideWordlePanel();
  }
});

// Current guesser name — used by paintWordleEyebrow in playing phase
onValue(wordleCurrentGuesserNameRef, snap => {
  wordleCurrentGuesserName = snap.val() || "";
  paintWordleEyebrow();
});

// Turn timer — drains as the guesser's time runs out
onValue(wordleTurnEndEpochRef, snap => {
  if (!wordleTurnTimerBar || !wordleTurnTimerFill) return;
  const epoch = snap.val();
  if (wordleTickInterval) { clearInterval(wordleTickInterval); wordleTickInterval = null; }
  if (!epoch || wordlePhaseLocal !== "playing") {
    wordleTurnTimerBar.classList.remove("show");
    wordleTurnTimerFill.style.width = "100%";
    return;
  }
  const startMs = Date.now();
  const totalMs = Math.max(1, epoch - startMs);
  wordleTurnTimerBar.classList.add("show");
  function tick() {
    const remaining = Math.max(0, epoch - Date.now());
    const pct = (remaining / totalMs) * 100;
    wordleTurnTimerFill.style.width = pct + "%";
    wordleTurnTimerFill.style.background = remaining <= 5000 ? "#ff647c" : "white";
    if (remaining <= 0) {
      clearInterval(wordleTickInterval);
      wordleTickInterval = null;
      // Hide the bar shortly after zero
      setTimeout(() => wordleTurnTimerBar.classList.remove("show"), 600);
    }
  }
  tick();
  wordleTickInterval = setInterval(tick, 250);
});

// Winner record — feeds into the eyebrow text during results phase
onValue(wordleWinnerRef, snap => {
  wordleWinnerLocal = snap.val() || null;
  paintWordleEyebrow();
});

/* ── GATES ── */
onValue(triviaModeRef, snap => { snap.val()===true ? startTrivia() : stopTrivia(); });
onValue(pollsModeRef,  snap => { snap.val()===true ? startPolls()  : stopPolls();  });

/* ── SKRIBBL HINT DISPLAY ── */
function renderHint(hint) {
  skribblHintDisplay.innerHTML = "";
  if (!hint || !Array.isArray(hint)) { skribblHintDisplay.classList.remove("show"); return; }

  // Split into word groups by space entries
  let groups = [], current = [];
  hint.forEach(h => {
    if (h.letter === " ") { groups.push(current); current = []; }
    else current.push(h);
  });
  groups.push(current);

  groups.forEach((group, gi) => {
    if (!group.length) return;
    const wordDiv = document.createElement("div");
    wordDiv.className = "hint-word";
    group.forEach(({ letter, revealed }) => {
      const cell = document.createElement("div");
      cell.className = "hint-letter" + (revealed ? " revealed" : "");
      cell.textContent = revealed && letter ? letter.toUpperCase() : "";
      wordDiv.appendChild(cell);
    });
    skribblHintDisplay.appendChild(wordDiv);
    // Add spacer between words
    if (gi < groups.length - 1) {
      const spacer = document.createElement("div");
      spacer.className = "hint-word-spacer";
      skribblHintDisplay.appendChild(spacer);
    }
  });

  skribblHintDisplay.classList.add("show");
}

onValue(skribblHintRef, snap => {
  if (!skribblOn) return;
  renderHint(snap.val());
});

/* ── SLOT MACHINE NAME FLIP ── */
function flipName(newName) {
  const existing = nameWindow.querySelector(".current");
  if (!newName) {
    if (existing) {
      existing.classList.remove("current");
      existing.classList.add("exit-up");
      setTimeout(() => existing.remove(), 500);
    }
    setTimeout(() => liveNameSlot.classList.remove("show"), 300);
    return;
  }
  const incoming = document.createElement("div");
  incoming.className = "name-label enter-from-below";
  incoming.innerHTML = `<span class="name-dot"></span>${newName}`;
  nameWindow.appendChild(incoming);
  liveNameSlot.classList.add("show");
  incoming.offsetHeight; // force reflow so enter-from-below is applied
  if (existing) {
    existing.classList.remove("current");
    existing.classList.add("exit-up");
    setTimeout(() => existing.remove(), 500);
  }
  incoming.classList.remove("enter-from-below");
  incoming.classList.add("current");
}

/* ── ACTIVE USER ── */
onValue(activeUserRef, snap => {
  activeUser = snap.val();
  livePip.classList.toggle("show", !!activeUser);

  if (!activeUser) {
    // No one live — stop stream, show empty state
    stopStream();
    flipName(null);
    return;
  }

  // Reset timers so bad-connection check doesn't immediately fire on switch
  lastFrame     = performance.now();
  lastHeartbeat = performance.now();

  // Load name for slot machine flip
  onValue(ref(db, `participants/${activeUser}/name`), snap => {
    flipName(snap.val() || null);
  }, { onlyOnce: true });

  // Hide empty state immediately; the frame listener will show the feed
  // as soon as a frame arrives — no timing gap, no flicker
  hideEmpty();
  ensureStream();
});

/* ── BAD CONNECTION ── */
// Use heartbeat (not frame time) so pixel diff skipping doesn't false-trigger.
// Heartbeat fires every 3s from the phone; 8s timeout gives 2+ missed beats before alarm.
const HB_TIMEOUT_MS = 8000;
setInterval(() => {
  if (!activeUser || !streamOn) return;
  const stale = lastHeartbeat > 0 && performance.now() - lastHeartbeat > HB_TIMEOUT_MS;
  if (stale) { hideFeed(); showBad(); }
  else        { showFeed(); hideBad(); }
}, 500);

/* ── VISIBILITY ──
 * Pause/resume the live image stream on tab visibility (real bandwidth saver).
 * Do NOT tear down trivia/polls listeners — those are tiny JSON listeners and the
 * teardown was asymmetric (no restore on show), making them vanish until a refresh.
 */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopStream(); }
  else if (activeUser) { ensureStream(); }
});
</script>
