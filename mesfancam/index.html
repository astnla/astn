<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>MANATEE CAM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --red:#0a0a0a; --navy:#ffffff; --white:#ffffff; --dim:rgba(0,0,0,0.18); }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{min-height:100vh;background:var(--red);font-family:"DM Sans",sans-serif;color:var(--white);overflow-x:hidden;
      -webkit-user-select:none;user-select:none;
      -webkit-touch-callout:none;
      -webkit-tap-highlight-color:transparent;
    }
    body{padding-bottom:80px;}
    .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,16px) 24px 0;}
    .wordmark{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;animation:fadeDown 0.4s ease both;}
    .wordmark img{width:48px;height:48px;object-fit:contain;border-radius:8px;margin-bottom:6px;}
    .wordmark-text{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:22px;color:var(--white);}
    .viewfinder{position:relative;width:min(82vw,320px);aspect-ratio:3/4;background:var(--dim);border-radius:12px;overflow:hidden;animation:fadeUp 0.4s 0.1s ease both;}
    #preview{width:100%;height:100%;object-fit:cover;display:block;opacity:0;pointer-events:none;}
    #preview::-webkit-media-controls,
    #preview::-webkit-media-controls-enclosure,
    #preview::-webkit-media-controls-panel{display:none !important;}

    #liveBadge{display:none;position:absolute;top:10px;left:10px;background:rgba(255,255,255,0.92);color:var(--red);padding:5px 11px;border-radius:6px;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:15px;letter-spacing:1px;align-items:center;gap:6px;z-index:10;}
    #liveBadge.show{display:flex;}
    .live-dot{width:8px;height:8px;background:var(--red);border-radius:50%;animation:livePulse 1s ease-in-out infinite;}
    @keyframes livePulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(0.4);opacity:0.4;}}
    #flipBtn{display:none;position:absolute;bottom:10px;right:10px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,0.18);backdrop-filter:blur(4px);cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:transform 0.15s;}
    #flipBtn.show{display:flex;}
    #flipBtn:active{transform:scale(0.9);}
    #flipBtn svg{width:18px;height:18px;stroke:white;fill:none;}
    .cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;}
    .cam-icon{width:44px;height:44px;border:2.5px solid rgba(255,255,255,0.7);border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .cam-icon svg{width:20px;height:20px;stroke:white;fill:none;}
    .cam-label{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:rgba(255,255,255,0.85);text-align:center;animation:pulse 1.8s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:0.55;}50%{opacity:1;}}

    /* ── SHARED INTERACTIVE BUTTON STYLE ── */
    /* Used by trivia submit, skribbl guess, and poll options — consistent outline style */
    .action-btn {
      width:100%;padding:13px 16px;border-radius:8px;
      border:2px solid rgba(255,255,255,0.35);
      background:rgba(255,255,255,0.08);
      color:white;
      font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;
      cursor:pointer;text-align:center;
      transition:background 0.15s,border-color 0.15s,transform 0.1s;
    }
    .action-btn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.6);}
    .action-btn:active{transform:scale(0.98);background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.8);}

    /* ── ANIMATED PANEL SYSTEM ──
       All activity panels (trivia, poll, skribbl, submitted states, toolbar)
       use the same spring-slide system instead of display:none snapping.
       .panel-hidden  = fully hidden, collapsed height, pointer-events off
       .panel-visible = fully visible, natural height
       .panel-exiting = mid-exit, collapses while fading — removed by JS after transition
    */
    .ui-panel {
      overflow: hidden;
      opacity: 0;
      transform: translateY(14px);
      max-height: 0;
      margin-top: 0;
      pointer-events: none;
      transition:
        opacity   0.35s cubic-bezier(0.22,1,0.36,1),
        transform 0.38s cubic-bezier(0.22,1,0.36,1),
        max-height 0.38s cubic-bezier(0.22,1,0.36,1),
        margin-top 0.38s cubic-bezier(0.22,1,0.36,1);
    }
    .ui-panel.visible {
      opacity: 1;
      transform: translateY(0);
      max-height: 600px;   /* generous ceiling — content drives actual height */
      margin-top: 18px;
      pointer-events: auto;
    }
    /* Exit: slide down + fade, collapse height */
    .ui-panel.exiting {
      opacity: 0;
      transform: translateY(10px);
      max-height: 0;
      margin-top: 0;
      pointer-events: none;
      transition:
        opacity    0.28s ease-in,
        transform  0.28s ease-in,
        max-height 0.32s ease-in,
        margin-top 0.32s ease-in;
    }

    /* ── TRIVIA ── */
    #triviaBox{display:flex;flex-direction:column;gap:10px;width:min(82vw,320px);}
    #triviaInput{padding:12px 14px;border-radius:8px;border:none;background:rgba(255,255,255,0.15);color:white;font-family:"DM Sans",sans-serif;font-size:15px;font-weight:500;outline:none;transition:background 0.2s;}
    #triviaInput::placeholder{color:rgba(255,255,255,0.45);}
    #triviaInput:focus{background:rgba(255,255,255,0.22);}
    #triviaSubmitted{text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:rgba(255,255,255,0.9);}

    /* ── POLLS ── */
    #pollBox{display:flex;flex-direction:column;gap:12px;width:min(82vw,320px);}
    #pollQuestionText{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:white;text-align:center;line-height:1.3;}
    #pollOptionsList{display:flex;flex-direction:column;gap:8px;}
    .poll-btn{width:100%;padding:13px 16px;border-radius:8px;border:2px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.08);color:white;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;cursor:pointer;text-align:left;transition:background 0.15s,border-color 0.15s,transform 0.1s;}
    .poll-btn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.6);}
    .poll-btn:active{transform:scale(0.98);}
    .poll-btn.selected{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.9);border-width:2px;}
    #pollSubmitted{text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:rgba(255,255,255,0.9);}

    .legal{margin-top:14px;font-size:10px;line-height:1.5;color:rgba(255, 255, 255, 0.55);text-align:center;max-width:300px;}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

    /* ── SKRIBBL ── */
    #skribblBox{display:flex;flex-direction:column;gap:10px;width:min(82vw,320px);}
    #skribblLabel{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:18px;color:white;text-align:center;line-height:1.3;}
    #skribblInput{padding:12px 14px;border-radius:8px;border:none;background:rgba(255,255,255,0.15);color:white;font-family:"DM Sans",sans-serif;font-size:15px;font-weight:500;outline:none;transition:background 0.2s;}
    #skribblInput::placeholder{color:rgba(255,255,255,0.45);}
    #skribblInput:focus{background:rgba(255,255,255,0.22);}
    #skribblWinner{text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:22px;color:white;}

    /* ── DRAWING OVERLAY ── */
    #drawOverlay{
      position:absolute;inset:0;z-index:20;
      background:white;border-radius:12px;
      display:flex;flex-direction:column;
      transform:translateY(100%);opacity:0;
      transition:transform 0.4s cubic-bezier(0.22,1,0.36,1),opacity 0.35s ease;
      pointer-events:none;
      touch-action:none;
      -webkit-user-select:none;user-select:none;
    }
    #drawOverlay.show{transform:translateY(0);opacity:1;pointer-events:auto;}
    #drawPromptLabel{
      font-family:"Barlow Condensed",sans-serif;font-weight:900;
      font-size:15px;color:#00031F;
      text-align:center;padding:10px 14px 6px;flex-shrink:0;
    }
    #drawCanvas{
      flex:1;width:100%;display:block;
      cursor:crosshair;touch-action:none;
      -webkit-user-select:none;user-select:none;
    }
    #drawActions{
      display:flex;gap:8px;padding:8px 10px;flex-shrink:0;
    }
    .draw-btn{
      flex:1;padding:11px;border-radius:8px;border:none;
      font-family:"Barlow Condensed",sans-serif;font-weight:700;
      font-size:15px;cursor:pointer;transition:opacity 0.15s;
    }
    .draw-btn:active{opacity:0.7;}
    /* Draw overlay is white bg — use bordered styles for contrast */
    #drawRestart{background:rgba(255, 0, 0, 0.1);color:#cc0000;border:2px solid #cc0000;}
    #drawRestart:active{background:rgba(204,0,0,0.08);}
    #drawSubmit{background:rgba(0, 0, 0, 0.08);color:rgb(0, 0, 0);border:2px solid #00031F;}
    #drawSubmit:active{background:#111;}
    #drawSubmitted{
      position:absolute;inset:0;z-index:21;
      background:white;border-radius:12px;
      display:flex;
      align-items:center;justify-content:center;
      font-family:"Barlow Condensed",sans-serif;font-weight:900;
      font-size:22px;color:#00031F;
      flex-direction:column;gap:8px;
      opacity:0;pointer-events:none;
      transition:opacity 0.35s cubic-bezier(0.22,1,0.36,1);
    }
    #drawSubmitted.show{opacity:1;pointer-events:auto;}

    /* ── DRAW TOOLBAR ── */
    #drawToolbar {
      flex-direction: column;
      gap: 10px;
      width: min(82vw, 320px);
    }

    /* Row wrapper */
    .tool-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Brush size buttons */
    .brush-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .brush-btn:active { transform: scale(0.95); }
    .brush-btn.active {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.75);
    }
    .brush-dot {
      border-radius: 50%;
      background: white;
      display: block;
      flex-shrink: 0;
    }

    /* Fill / eraser buttons */
    .tool-icon-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 0;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      transition: background 0.15s, border-color 0.15s;
    }
    .tool-icon-btn:active { transform: scale(0.95); }
    .tool-icon-btn.active {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.75);
      color: white;
    }

    /* Color palette */
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: transform 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .color-swatch:active { transform: scale(0.88); }
    .color-swatch.active {
      border-color: white;
      transform: scale(1.18);
      box-shadow: 0 0 0 1.5px rgba(0,0,0,0.4);
    }
    /* white swatch needs a visible border even when inactive */
    .color-swatch[data-color="#ffffff"] { border-color: rgba(255,255,255,0.35); }
    .color-swatch[data-color="#ffffff"].active { border-color: white; }

    .palette-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.12);
      justify-content: center;
    }
  </style>
</head>
<body>
<div class="page">

  <div class="wordmark">
    <img src="assets/mestv.png" alt="MES TV">
    <div class="wordmark-text">MANATEE CAM</div>
  </div>

  <div class="viewfinder" id="viewfinder">
    <video id="preview" autoplay playsinline muted disablepictureinpicture x-webkit-airplay="deny" style="pointer-events:none;opacity:0;"></video>
    <div id="liveBadge"><span class="live-dot"></span>LIVE</div>
    <button id="flipBtn" aria-label="Flip camera">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
    </button>
    <div class="cam-overlay" id="camOverlay">
      <div class="cam-icon">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
        </svg>
      </div>
      <span class="cam-label" id="camLabel">TAP TO ENABLE CAMERA</span>
    </div>

    <!-- Drawing overlay — slides up over camera when drawing mode is active -->
    <div id="drawOverlay">
      <div id="drawPromptLabel">DRAW: <span id="drawPromptText"></span></div>
      <canvas id="drawCanvas"></canvas>
      <div id="drawActions">
        <button class="draw-btn" id="drawRestart">RESTART</button>
        <button class="draw-btn" id="drawSubmit">SUBMIT</button>
      </div>
    </div>
    <div id="drawSubmitted">
      <div>DRAWING SENT</div>
    </div>
  </div>

  <!-- Trivia -->
  <div id="triviaBox" class="ui-panel">
    <div id="triviaQuestionText" style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:white;text-align:center;line-height:1.3;"></div>
    <input id="triviaInput" type="text" placeholder="Type your answer…" autocomplete="off">
    <button id="triviaSubmit" class="action-btn">SUBMIT ANSWER</button>
  </div>
  <div id="triviaSubmitted" class="ui-panel">ANSWER SUBMITTED ✓</div>

  <!-- Polls -->
  <div id="pollBox" class="ui-panel">
    <div id="pollQuestionText"></div>
    <div id="pollOptionsList"></div>
  </div>
  <div id="pollSubmitted" class="ui-panel">VOTE SUBMITTED ✓</div>

  <!-- Skribbl guess box -->
  <div id="skribblBox" class="ui-panel">
    <div id="skribblLabel">🎨 WHAT'S THEIR DOODLE?</div>
    <input id="skribblInput" type="text" placeholder="Type your guess…" autocomplete="off">
    <button id="skribblGuess" class="action-btn">GUESS</button>
  </div>
  <div id="skribblWinner" class="ui-panel"></div>

  <!-- Draw Toolbar — shown below the viewfinder when drawing is active -->
  <div id="drawToolbar" class="ui-panel">
    <!-- Row 1: Brush sizes + fill + eraser -->
    <div class="tool-row">
      <button class="brush-btn" data-size="1.5" aria-label="Small brush">
        <span class="brush-dot" style="width:5px;height:5px;background:#fff;"></span>
      </button>
      <button class="brush-btn active" data-size="3" aria-label="Medium brush">
        <span class="brush-dot" style="width:9px;height:9px;background:#fff;"></span>
      </button>
      <button class="brush-btn" data-size="7" aria-label="Large brush">
        <span class="brush-dot" style="width:16px;height:16px;background:#fff;"></span>
      </button>
      <button class="tool-icon-btn" id="fillBtn" aria-label="Fill tool">
        🪣 FILL
      </button>
      <button class="tool-icon-btn" id="eraserBtn" aria-label="Eraser">
        ◻ ERASE
      </button>
    </div>
    <!-- Row 2: Color palette -->
    <div class="palette-wrap" id="colorPalette"></div>
  </div>

  <p class="legal">By participating you consent to being filmed and broadcast live. For school use only.</p>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, set, update, onValue, off, get } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

/* ── SESSION CHECK ── */
const name    = sessionStorage.getItem("fanCamName");
const userKey = sessionStorage.getItem("fanCamUserKey");
if (!name || !userKey) { window.location.href = "join.html"; }

/* ── ANIMATED PANEL HELPERS ── */
// showPanel: slide up + fade in
function showPanel(el) {
  el.classList.remove("exiting");
  el.offsetHeight; // force reflow so transition fires from hidden state
  el.classList.add("visible");
}
// hidePanel: slide down + fade out, then clean up
function hidePanel(el) {
  if (!el.classList.contains("visible")) return;
  el.classList.remove("visible");
  el.classList.add("exiting");
  const done = () => { el.classList.remove("exiting"); };
  el.addEventListener("transitionend", done, { once: true });
  // Safety fallback in case transitionend doesn't fire
  setTimeout(done, 400);
}

/* ── ELEMENTS ── */
const preview         = document.getElementById("preview");
const camOverlay      = document.getElementById("camOverlay");
const camLabel        = document.getElementById("camLabel");
const liveBadge       = document.getElementById("liveBadge");
const flipBtn         = document.getElementById("flipBtn");
const triviaBox       = document.getElementById("triviaBox");
const triviaInput     = document.getElementById("triviaInput");
const triviaSubmit    = document.getElementById("triviaSubmit");
const triviaSubmitted = document.getElementById("triviaSubmitted");
const pollBox         = document.getElementById("pollBox");
const pollQuestionText= document.getElementById("pollQuestionText");
const pollOptionsList = document.getElementById("pollOptionsList");
const pollSubmitted   = document.getElementById("pollSubmitted");

/* ── CAMERA STATE ── */
let currentStream    = null;
let currentCamera    = "back";
let streamingEnabled = false;
let isLive           = false;

/* ── STREAMING STATE ── */
let sending       = false;
let lastFrameData = null;
let lastSendTime  = 0;
const MIN_INTERVAL_MS = 120;
const DIFF_THRESHOLD  = 0.015;

/* ── REFS ── */
const activeUserRef = ref(db, "live/activeUser");
const myRef         = ref(db, `participants/${userKey}`);
const triviaModeRef = ref(db, "trivia/mode");
const triviaQRef    = ref(db, "trivia/question");
const pollsModeRef  = ref(db, "polls/mode");
const pollsQRef     = ref(db, "polls/question");
const pollsOptsRef  = ref(db, "polls/options");

/* ── PIXEL DIFF ── */
const diffCanvas = document.createElement("canvas");
diffCanvas.width = 16; diffCanvas.height = 12;
const diffCtx = diffCanvas.getContext("2d");

function hasSignificantChange(sourceCanvas) {
  diffCtx.drawImage(sourceCanvas, 0, 0, 16, 12);
  const pixels = diffCtx.getImageData(0, 0, 16, 12).data;
  if (!lastFrameData) { lastFrameData = new Uint8ClampedArray(pixels); return true; }
  let diff = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    const dr = Math.abs(pixels[i]   - lastFrameData[i]);
    const dg = Math.abs(pixels[i+1] - lastFrameData[i+1]);
    const db2= Math.abs(pixels[i+2] - lastFrameData[i+2]);
    if ((dr + dg + db2) > 30) diff++;
  }
  lastFrameData = new Uint8ClampedArray(pixels);
  return (diff / 64) > DIFF_THRESHOLD;
}

/* ── CAMERA ── */
async function enableCamera() {
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  camLabel.textContent = "ENABLING…";
  try {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    let constraints;
    if (isIOS) {
      constraints = { video: { facingMode: currentCamera === "front" ? "user" : "environment", width:{ideal:480}, height:{ideal:360} } };
    } else {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === "videoinput");
      const hasLabels = cams.some(c => c.label);
      if (!hasLabels) {
        constraints = { video: { facingMode: currentCamera === "front" ? "user" : "environment", width:{ideal:480}, height:{ideal:360} } };
      } else {
        let target;
        if (currentCamera === "front") {
          target = cams.find(c => /front/i.test(c.label) && !/ultra/i.test(c.label))
                || cams.find(c => /front/i.test(c.label))
                || cams[0];
        } else {
          target = cams.find(c => /back|rear|environment/i.test(c.label))
                || cams[cams.length - 1];
        }
        if (!target?.deviceId) target = currentCamera === "front" ? cams[0] : cams[cams.length - 1];
        constraints = { video: { deviceId: { exact: target.deviceId }, width:{ideal:480}, height:{ideal:360} } };
      }
    }
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    currentStream = stream;
    preview.srcObject = stream;
    preview.style.transform = currentCamera === "front" ? "scaleX(-1)" : "scaleX(1)";
    // Wait for first real frame before revealing — prevents play button flash on iOS
    preview.onloadeddata = () => {
      preview.style.opacity = "1";
      camOverlay.style.display = "none";
      flipBtn.classList.add("show");
    };
    update(ref(db, `participants/${userKey}`), { cameraActive: true });
    streamingEnabled = true;
    startFrameLoop();
  } catch(err) {
    camLabel.textContent = "CAMERA ERROR — TAP TO RETRY";
    streamingEnabled = false;
  }
}

/* ── FRAME LOOP ── */
const frameCanvas = document.createElement("canvas");
const frameCtx = frameCanvas.getContext("2d");

function startFrameLoop() {
  function loop() {
    requestAnimationFrame(loop);
    if (!isLive || !streamingEnabled || sending) return;
    if (!preview || preview.readyState < 2) return;
    const now = performance.now();
    if (now - lastSendTime < MIN_INTERVAL_MS) return;
    const targetW = Math.min(preview.videoWidth, 560);
    frameCanvas.width = targetW;
    frameCanvas.height = Math.round(preview.videoHeight * (targetW / preview.videoWidth));
    frameCtx.save();
    if (currentCamera === "front") {
      frameCtx.scale(-1, 1);
      frameCtx.drawImage(preview, -frameCanvas.width, 0, frameCanvas.width, frameCanvas.height);
    } else {
      frameCtx.drawImage(preview, 0, 0, frameCanvas.width, frameCanvas.height);
    }
    frameCtx.restore();
    if (!hasSignificantChange(frameCanvas)) return;
    const jpeg = frameCanvas.toDataURL("image/jpeg", 0.50);
    // Guard: toDataURL returns "data:," if canvas is empty/invalid
    if (!jpeg || !jpeg.startsWith("data:image")) { return; }
    lastSendTime = now;
    sending = true;
    set(ref(db, "live/frame"), jpeg)
      .catch(e => console.warn("Frame write failed:", e))
      .finally(() => { sending = false; });
  }
  loop();
}

/* ── ACTIVE USER ── */
let heartbeatInterval = null;

onValue(activeUserRef, snap => {
  isLive = snap.val() === userKey;
  liveBadge.classList.toggle("show", isLive);
  if (!isLive) {
    lastFrameData = null;
    // Stop heartbeat when no longer live
    if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
    return;
  }
  // Start heartbeat — fires every 3s regardless of pixel diff skipping
  // This lets output.html distinguish "still scene" from "lost connection"
  if (!heartbeatInterval) {
    const hbRef = ref(db, "live/heartbeat");
    set(hbRef, Date.now()); // immediate first beat
    heartbeatInterval = setInterval(() => {
      if (isLive) set(hbRef, Date.now()).catch(() => {});
      else { clearInterval(heartbeatInterval); heartbeatInterval = null; }
    }, 3000);
  }
});

/* ── CAMERA TAP / FLIP ── */
camOverlay.addEventListener("click", () => {
  if (camOverlay.style.display !== "none") enableCamera();
});
flipBtn.addEventListener("click", async () => {
  streamingEnabled = false;
  // Hide and detach the video BEFORE switching — this prevents iOS from briefly
  // showing the new stream at its natural (unconstrained) resolution before
  // object-fit:cover kicks in, which caused the zoomed-in flicker.
  preview.style.opacity = "0";
  preview.srcObject = null;
  currentCamera = currentCamera === "front" ? "back" : "front";
  lastFrameData = null;
  await enableCamera();
  setTimeout(() => { streamingEnabled = true; }, 800);
});

/* ── KICK / SESSION END ── */
onValue(myRef, snap => { if (!snap.exists()) endSession(); });
function endSession() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  document.body.innerHTML = `
    <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0a0a0a;color:white;font-family:'Barlow Condensed',sans-serif;
    font-size:28px;font-weight:900;text-align:center;padding:24px;gap:12px;">
      <div>THANKS FOR JOINING!</div>
      <div style="font-size:14px;font-weight:400;font-family:'DM Sans',sans-serif;opacity:0.7;letter-spacing:0;">You can close this tab.</div>
    </div>`;
  setTimeout(() => { sessionStorage.clear(); window.location.href = "join.html"; }, 10000);
}

/* ── TRIVIA ── */
let triviaQListener = null;
onValue(triviaModeRef, snap => {
  const on = snap.val() === true;
  if (!on) {
    if (triviaQListener) { off(triviaQRef); triviaQListener = null; }
    hidePanel(triviaBox);
    hidePanel(triviaSubmitted);
    triviaInput.value = "";
    return;
  }
  if (!triviaQListener) {
    triviaQListener = onValue(triviaQRef, snap => {
      const d = snap.val() || {};
      if (d.show && d.text) {
        document.getElementById("triviaQuestionText").textContent = d.text;
        showPanel(triviaBox);
        hidePanel(triviaSubmitted);
        triviaInput.value = "";
      } else {
        document.getElementById("triviaQuestionText").textContent = "";
        hidePanel(triviaBox);
        hidePanel(triviaSubmitted);
        triviaInput.value = "";
      }
    });
  }
});
triviaSubmit.addEventListener("click", () => {
  const answer = triviaInput.value.trim();
  if (!answer) return;
  update(ref(db, `trivia/answers/${userKey}`), { answer, timestamp: Date.now() });
  hidePanel(triviaBox);
  showPanel(triviaSubmitted);
});

/* ── POLLS ── */
// Two-listener approach:
// 1. Persistent options listener keeps currentOptions always fresh.
// 2. Question listener calls buildPollButtons() which reads currentOptions.
// Control page writes options BEFORE flipping show:true, so by the time
// the question listener fires, currentOptions is already populated.
// On reset: pollsListening stays true but currentOptions is wiped to {}
// by the options listener when Firebase clears options — so a new poll
// send re-populates currentOptions before show:true flips again.

let currentOptions = {};
let hasVoted       = false;
let pollsListening = false;

function buildPollButtons() {
  pollOptionsList.innerHTML = "";
  const sorted = Object.entries(currentOptions)
    .sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0));
  for (const [key, opt] of sorted) {
    const btn = document.createElement("button");
    btn.className = "poll-btn";
    btn.textContent = opt.label;
    btn.onclick = () => {
      if (hasVoted) return;
      hasVoted = true;
      document.querySelectorAll(".poll-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      update(ref(db, `polls/votes/${userKey}`), {
        optionKey: key,
        label: opt.label,
        timestamp: Date.now()
      });
      setTimeout(() => {
        hidePanel(pollBox);
        showPanel(pollSubmitted);
      }, 400);
    };
    pollOptionsList.appendChild(btn);
  }
}

onValue(pollsModeRef, snap => {
  const on = snap.val() === true;

  if (!on) {
    if (pollsListening) {
      off(pollsOptsRef);
      off(pollsQRef);
      pollsListening = false;
    }
    hidePanel(pollBox);
    hidePanel(pollSubmitted);
    pollOptionsList.innerHTML = "";
    currentOptions = {};
    hasVoted = false;
    return;
  }

  if (pollsListening) return;
  pollsListening = true;

  onValue(pollsOptsRef, snap => {
    currentOptions = snap.val() || {};
  });

  onValue(pollsQRef, snap => {
    const d = snap.val() || {};
    if (d.show && d.text) {
      hasVoted = false;
      hidePanel(pollSubmitted);
      pollQuestionText.textContent = d.text;
      buildPollButtons();
      showPanel(pollBox);
    } else {
      hidePanel(pollBox);
      hidePanel(pollSubmitted);
      pollOptionsList.innerHTML = "";
      hasVoted = false;
    }
  });
});

/* ── DRAWING ── */
const drawOverlay    = document.getElementById("drawOverlay");
const drawSubmitted  = document.getElementById("drawSubmitted");
const drawPromptText = document.getElementById("drawPromptText");
const drawCanvas     = document.getElementById("drawCanvas");
const drawRestart    = document.getElementById("drawRestart");
const drawSubmit     = document.getElementById("drawSubmit");
const drawCtx        = drawCanvas.getContext("2d");
const drawModeRef    = ref(db, "drawing/mode");
const drawPromptRef  = ref(db, "drawing/prompt");

let drawActive = false;
let drawHasSubmitted = false;

// On page load, check if this user already submitted a drawing this session.
// If so, mark as submitted so the toolbar doesn't re-appear on refresh.
// Uses onValue (not onlyOnce) so it also catches resets — when the teacher
// clears submissions, this fires with snap.exists()===false and resets the flag.
onValue(ref(db, `drawing/submissions/${userKey}`), snap => {
  if (!snap.exists()) {
    // Submission was cleared (teacher reset) — allow drawing again
    drawHasSubmitted = false;
  } else {
    drawHasSubmitted = true;
  }
});

function initDrawCanvas() {
  // Size canvas to its CSS display size
  const rect = drawCanvas.getBoundingClientRect();
  drawCanvas.width  = rect.width  || drawCanvas.offsetWidth;
  drawCanvas.height = rect.height || drawCanvas.offsetHeight;
  drawCtx.fillStyle = "white";
  drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
  // Apply current tool settings (color/size/mode)
  applyDrawSettings();
}

// Drawing input — works with both touch and mouse
let isPainting = false;

function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}
drawCanvas.addEventListener("pointerdown", e => {
  if (toolMode === "fill") return; // handled by capture listener
  e.preventDefault(); isPainting = true;
  applyDrawSettings();
  const { x, y } = getPos(e);
  drawCtx.beginPath(); drawCtx.moveTo(x, y);
});
drawCanvas.addEventListener("pointermove", e => {
  e.preventDefault(); if (!isPainting) return;
  if (toolMode === "fill") return;
  const { x, y } = getPos(e);
  drawCtx.lineTo(x, y); drawCtx.stroke();
});
drawCanvas.addEventListener("pointerup",     () => isPainting = false);
drawCanvas.addEventListener("pointercancel", () => isPainting = false);

drawRestart.addEventListener("click", () => {
  drawCtx.fillStyle = "white";
  drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
  applyDrawSettings();
});

drawSubmit.addEventListener("click", async () => {
  if (drawHasSubmitted) return;
  drawHasSubmitted = true;
  drawSubmit.textContent = "SENDING…";
  hideDrawToolbar();
  // Compress to PNG at 480px wide max
  const tmp = document.createElement("canvas");
  const maxW = 480;
  const scale = Math.min(1, maxW / drawCanvas.width);
  tmp.width  = Math.round(drawCanvas.width  * scale);
  tmp.height = Math.round(drawCanvas.height * scale);
  tmp.getContext("2d").drawImage(drawCanvas, 0, 0, tmp.width, tmp.height);
  const png = tmp.toDataURL("image/png");
  await set(ref(db, `drawing/submissions/${userKey}`), { data: png, timestamp: Date.now() })
    .catch(e => console.warn("Drawing submit failed:", e));
  drawOverlay.classList.remove("show");
  drawSubmitted.classList.add("show");
  // After 3s, hide submitted state so camera returns
  setTimeout(() => {
    drawSubmitted.classList.remove("show");
  }, 3000);
});

// Gate: listen to drawing mode
onValue(drawModeRef, snap => {
  drawActive = snap.val() === true;
  if (!drawActive) {
    drawOverlay.classList.remove("show");
    drawSubmitted.classList.remove("show");
    drawHasSubmitted = false;
    drawSubmit.textContent = "SUBMIT";
    hideDrawToolbar();
  } else {
    // Mode just turned on (or page loaded while mode was already on).
    // Do a fresh one-time read of the prompt so late-joining students
    // immediately receive any in-progress round without waiting for a
    // Firebase value-change event that already fired before they connected.
    get(drawPromptRef).then(snap => {
      const d = snap.val() || {};
      if (d.show && d.text) {
        drawPromptText.textContent = d.text;
        if (!drawHasSubmitted) {
          // Fresh round for this student — open the canvas
          drawOverlay.classList.add("show");
          drawSubmitted.classList.remove("show");
          drawSubmit.textContent = "SUBMIT";
          requestAnimationFrame(() => requestAnimationFrame(() => {
            initDrawCanvas();
            showDrawToolbar();
          }));
        } else {
          // Already submitted — don't open the drawing board at all.
          // Just briefly confirm over the camera then return to it.
          drawOverlay.classList.remove("show");
          drawSubmitted.classList.add("show");
          hideDrawToolbar();
          setTimeout(() => { drawSubmitted.classList.remove("show"); }, 3000);
        }
      }
    });
  }
});

// When a prompt arrives, show the drawing overlay
onValue(drawPromptRef, snap => {
  const d = snap.val() || {};
  if (drawActive && d.show && d.text) {
    drawPromptText.textContent = d.text;
    if (!drawHasSubmitted) {
      // Fresh round — open canvas and show tools
      drawOverlay.classList.add("show");
      drawSubmitted.classList.remove("show");
      drawSubmit.textContent = "SUBMIT";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        initDrawCanvas();
        showDrawToolbar();
      }));
    } else {
      // Already submitted — stay on camera, briefly confirm, then clear
      drawOverlay.classList.remove("show");
      drawSubmitted.classList.add("show");
      hideDrawToolbar();
      setTimeout(() => { drawSubmitted.classList.remove("show"); }, 3000);
    }
  } else if (!d.show) {
    // Prompt cleared (reset) — reset flag so next prompt works cleanly
    drawHasSubmitted = false;
    drawOverlay.classList.remove("show");
    drawSubmitted.classList.remove("show");
    hideDrawToolbar();
  }
});

/* ── TIMES UP — auto-submit if not already submitted ── */
onValue(ref(db, "drawing/timesUp"), snap => {
  if (!snap.val()) return;
  if (!drawActive) return;
  if (drawHasSubmitted) return;
  drawSubmit.click();
});

/* ── SKRIBBL ── */
const skribblBox     = document.getElementById("skribblBox");
const skribblLabel   = document.getElementById("skribblLabel");
const skribblInput   = document.getElementById("skribblInput");
const skribblGuess   = document.getElementById("skribblGuess");
const skribblWinner  = document.getElementById("skribblWinner");

const skribblModeRef   = ref(db, "skribbl/mode");
const skribblDrawerRef = ref(db, "skribbl/drawer");
const skribblPromptRef = ref(db, "skribbl/prompt");
const skribblWinnerRef = ref(db, "skribbl/winner");
const skribblLiveRef   = ref(db, "skribbl/liveCanvas");

let skribblActive  = false;
let skribblAmDrawer = false;
let skribblWon     = false;

// Skribbl canvas streaming — separate from regular draw mode
// Uses the existing drawCanvas but streams live every 300ms
let skribblStreamInterval = null;

function startSkribblStream() {
  if (skribblStreamInterval) return;
  skribblStreamInterval = setInterval(() => {
    if (!skribblAmDrawer || !skribblActive) {
      clearInterval(skribblStreamInterval); skribblStreamInterval = null; return;
    }
    // Compress canvas at low quality — simple line art compresses very small
    const tmp = document.createElement("canvas");
    const maxW = 400;
    const scale = Math.min(1, maxW / (drawCanvas.width || 1));
    tmp.width  = Math.round((drawCanvas.width  || 400) * scale);
    tmp.height = Math.round((drawCanvas.height || 533) * scale);
    tmp.getContext("2d").drawImage(drawCanvas, 0, 0, tmp.width, tmp.height);
    const jpeg = tmp.toDataURL("image/jpeg", 0.40);
    if (jpeg && jpeg.startsWith("data:image")) {
      set(skribblLiveRef, jpeg).catch(() => {});
    }
  }, 300);
}

function stopSkribblStream() {
  if (skribblStreamInterval) { clearInterval(skribblStreamInterval); skribblStreamInterval = null; }
  set(skribblLiveRef, null).catch(() => {});
}

// Mode gate
onValue(skribblModeRef, snap => {
  skribblActive = snap.val() === true;
  if (!skribblActive) {
    hidePanel(skribblBox);
    hidePanel(skribblWinner);
    skribblWinner.textContent = "";
    skribblInput.value = "";
    skribblWon = false;
    skribblAmDrawer = false;
    stopSkribblStream();
    drawOverlay.classList.remove("show");
    hideDrawToolbar();
    drawSubmit.style.display = "";
  }
});

// Who is the drawer?
onValue(skribblDrawerRef, snap => {
  const drawerKey = snap.val();
  skribblAmDrawer = drawerKey === userKey;
  // Don't show any UI here — wait for prompt to arrive (means START was actually hit)
  // This prevents the guess box appearing just from clicking the mode button
  if (!skribblAmDrawer) {
    // If drawer changed away from me, hide my draw canvas
    drawOverlay.classList.remove("show");
    stopSkribblStream();
  }
});

onValue(skribblPromptRef, snap => {
  const d = snap.val() || {};
  const gameStarted = d.show && d.text;

  if (!skribblActive) return;

  if (gameStarted) {
    if (skribblAmDrawer) {
      drawHasSubmitted = false;
      drawSubmit.style.display = "none";
      drawRestart.style.display = "";
      drawPromptText.textContent = d.text;
      drawOverlay.classList.add("show");
      hidePanel(skribblBox);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        initDrawCanvas();
        showDrawToolbar();
        startSkribblStream();
      }));
    } else {
      drawOverlay.classList.remove("show");
      hideDrawToolbar();
      if (!skribblWon) showPanel(skribblBox);
    }
  } else {
    drawOverlay.classList.remove("show");
    hidePanel(skribblBox);
    hideDrawToolbar();
    stopSkribblStream();
  }
});

// Winner — show celebration, stop guessing, stop drawing if drawer
onValue(skribblWinnerRef, snap => {
  const w = snap.val();
  if (!w || !skribblActive) return;

  // Round is over for everyone — stop all activity
  skribblWon = true;

  if (skribblAmDrawer) {
    drawOverlay.classList.remove("show");
    stopSkribblStream();
    hideDrawToolbar();
    skribblWinner.textContent = `${w.name} GOT IT!`;
    showPanel(skribblWinner);
  } else if (w.userKey === userKey) {
    skribblWinner.textContent = "YOU GOT IT! 🎉";
    showPanel(skribblWinner);
    hidePanel(skribblBox);
  } else {
    skribblWinner.textContent = `${w.name} GOT IT!`;
    showPanel(skribblWinner);
    hidePanel(skribblBox);
  }
});

// Guess submission — each guess gets a unique key so they don't overwrite
skribblGuess.addEventListener("click", async () => {
  const text = skribblInput.value.trim();
  if (!text || skribblWon) return;
  skribblInput.value = "";
  // Use timestamp + userKey as unique path so multiple guesses don't overwrite
  const guessKey = `${userKey}_${Date.now()}`;
  await set(ref(db, `skribbl/guesses/${guessKey}`), {
    text,
    name: name || userKey,
    guesserKey: userKey,
    timestamp: Date.now()
  }).catch(() => {});
});
skribblInput.addEventListener("keydown", e => {
  if (e.key === "Enter") skribblGuess.click();
});

/* ── DRAW TOOLBAR ── */
const drawToolbar = document.getElementById("drawToolbar");
const colorPalette = document.getElementById("colorPalette");
const fillBtn  = document.getElementById("fillBtn");
const eraserBtn = document.getElementById("eraserBtn");

// Palette colors: neutrals first, then rainbow
const COLORS = [
  "#000000","#555555","#aaaaaa","#ffffff","#7b4f2e",
  "#ff2020","#ff8800","#ffe600","#22cc44","#0088ff","#5500ff","#cc00ff"
];

let currentColor = "#000000";
let currentSize  = 3;
let toolMode     = "draw"; // "draw" | "fill" | "erase"

// Build palette swatches
COLORS.forEach(hex => {
  const sw = document.createElement("button");
  sw.className = "color-swatch" + (hex === currentColor ? " active" : "");
  sw.dataset.color = hex;
  sw.style.background = hex;
  sw.setAttribute("aria-label", hex);
  sw.addEventListener("click", () => {
    document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
    sw.classList.add("active");
    currentColor = hex;
    // Switching to a color auto-deactivates fill/erase and goes back to draw
    setToolMode("draw");
    applyDrawSettings();
  });
  colorPalette.appendChild(sw);
});

// Brush size buttons
document.querySelectorAll(".brush-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".brush-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentSize = parseFloat(btn.dataset.size);
    setToolMode("draw");
    applyDrawSettings();
  });
});

// Fill / erase
fillBtn.addEventListener("click", () => {
  setToolMode(toolMode === "fill" ? "draw" : "fill");
});
eraserBtn.addEventListener("click", () => {
  setToolMode(toolMode === "erase" ? "draw" : "erase");
});

function setToolMode(mode) {
  toolMode = mode;
  fillBtn.classList.toggle("active", mode === "fill");
  eraserBtn.classList.toggle("active", mode === "erase");
  drawCanvas.style.cursor = mode === "fill" ? "crosshair" : "crosshair";
}

function applyDrawSettings() {
  drawCtx.globalCompositeOperation = "source-over";
  if (toolMode === "erase") {
    drawCtx.lineWidth   = currentSize * 4;
    drawCtx.strokeStyle = "#ffffff";
  } else {
    drawCtx.lineWidth   = currentSize;
    drawCtx.strokeStyle = currentColor;
  }
  drawCtx.lineCap  = "round";
  drawCtx.lineJoin = "round";
}

function showDrawToolbar() {
  showPanel(drawToolbar);
}
function hideDrawToolbar() {
  hidePanel(drawToolbar);
  // Reset tool state for next round
  setToolMode("draw");
  currentColor = "#000000";
  currentSize  = 3;
  document.querySelectorAll(".color-swatch").forEach(s => s.classList.toggle("active", s.dataset.color === "#000000"));
  document.querySelectorAll(".brush-btn").forEach(b => b.classList.toggle("active", b.dataset.size === "3"));
  applyDrawSettings();
}

/* ── FLOOD FILL ── */
function floodFill(canvas, ctx, startX, startY, fillColorHex) {
  const w = canvas.width, h = canvas.height;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;

  function hexToRgba(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return [r,g,b,255];
  }

  const idx = (x, y) => (y * w + x) * 4;
  const si = idx(Math.floor(startX), Math.floor(startY));
  const targetR = data[si], targetG = data[si+1], targetB = data[si+2], targetA = data[si+3];
  const [fillR, fillG, fillB, fillA] = hexToRgba(fillColorHex);

  // If clicking on same color, do nothing
  if (targetR===fillR && targetG===fillG && targetB===fillB && targetA===fillA) return;

  function matchesTarget(i) {
    return Math.abs(data[i]-targetR)<32 && Math.abs(data[i+1]-targetG)<32 &&
           Math.abs(data[i+2]-targetB)<32 && Math.abs(data[i+3]-targetA)<32;
  }

  const stack = [[Math.floor(startX), Math.floor(startY)]];
  const visited = new Uint8Array(w * h);

  while (stack.length) {
    const [x, y] = stack.pop();
    if (x < 0 || x >= w || y < 0 || y >= h) continue;
    const vi = y * w + x;
    if (visited[vi]) continue;
    const i = vi * 4;
    if (!matchesTarget(i)) continue;
    visited[vi] = 1;
    data[i]   = fillR;
    data[i+1] = fillG;
    data[i+2] = fillB;
    data[i+3] = fillA;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imageData, 0, 0);
}

/* ── FILL MODE — capture phase fires before bubble draw handler ── */
drawCanvas.addEventListener("pointerdown", e => {
  if (toolMode === "fill") {
    e.preventDefault();
    const rect = drawCanvas.getBoundingClientRect();
    const scaleX = drawCanvas.width  / rect.width;
    const scaleY = drawCanvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top)  * scaleY;
    floodFill(drawCanvas, drawCtx, x, y, currentColor);
    return;
  }
  applyDrawSettings();
}, true);

/* ── SUPPRESS TEXT SELECTION & ZOOM ON TOUCH DRAG ── */
drawCanvas.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
drawCanvas.addEventListener("touchmove",  e => e.preventDefault(), { passive: false });
drawCanvas.addEventListener("touchend",   e => e.preventDefault(), { passive: false });

// Prevent long-press context menu on the canvas and toolbar
[drawCanvas, drawToolbar, document.getElementById("drawOverlay")].forEach(el => {
  if (!el) return;
  el.addEventListener("contextmenu", e => e.preventDefault());
});

/* ── VISIBILITY ── */
document.addEventListener("visibilitychange", () => {
  streamingEnabled = !document.hidden;
});
</script>
</body>
