/* ── POLLS ── */
function renderBars(totals) {
  // Render into both the cam-mode bars container AND the game-mode mirror.
  // Both targets are kept in sync so flipping game-mode mid-poll is seamless.
  renderBarsInto(pollBars, totals);
  if (gmPollsBarsContainer) renderBarsInto(gmPollsBarsContainer, totals);
}
function renderBarsInto(container, totals) {
  const keys = Object.keys(pollOptions);
  if (!keys.length) return;
  const total = keys.reduce((s, k) => s + (totals[k] || 0), 0);
  container.innerHTML = "";
  const sorted = [...keys].sort((a,b) => (pollOptions[a]?.order??0) - (pollOptions[b]?.order??0));
  for (const key of sorted) {
    const label = pollOptions[key]?.label || key;
    const votes = totals[key] || 0;
    const pct   = total > 0 ? Math.round((votes / total) * 100) : 0;
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="bar-top">
        <span class="bar-label">${label}</span>
        <span class="bar-pct">${pct}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>`;
    container.appendChild(row);
  }
}
function startPolls() {
  if (pollsOn) return;
  pollsOn = true;
  let latestTotals = {};

  // Persistent options — always current before question shows
  onValue(pollsOptsRef, snap => {
    pollOptions = snap.val() || {};
    // If poll is already showing (e.g. output page opened mid-poll), re-render immediately
    if (pollCard.classList.contains("show")) renderBars(latestTotals);
  });

  // Totals — cache latest value and render if poll is visible
  onValue(pollsTotalsRef, snap => {
    latestTotals = snap.val() || {};
    if (pollCard.classList.contains("show")) renderBars(latestTotals);
  });

  // Question controls visibility — render bars immediately on show
  let pollWasShown = false;
  let pollFirstSnap = true; // skip the first snap so sent.mp3 doesn't replay on output refresh
  onValue(pollsQRef, snap => {
    const d = snap.val() || {};
    const isShown = !!(d.show && d.text);
    if (!pollFirstSnap && isShown && !pollWasShown) playSnd(sndSent);
    pollFirstSnap = false;
    pollWasShown = isShown;
    if (isShown) {
      questionEyebrow.textContent = "POLL";
      questionText.textContent = d.text;
      showCard(questionCard, "question");
      showCard(pollCard, "poll");
      // Render bars right away using whatever totals we already have
      renderBars(latestTotals);
      // Game mode mirrors
      if (gmPollsQuestionText) gmPollsQuestionText.textContent = d.text;
      gmShow(gmPollsQuestion, "polls-question");
      gmShow(gmPollsBars, "polls-bars");
    } else {
      hideCard(questionCard, "question");
      hideCard(pollCard, "poll");
      pollBars.innerHTML = "";
      gmHide(gmPollsQuestion, "polls-question");
      gmHide(gmPollsBars, "polls-bars");
      if (gmPollsBarsContainer) gmPollsBarsContainer.innerHTML = "";
    }
  });
}
function stopPolls() {
  if (!pollsOn) return;
  pollsOn = false;
  off(pollsQRef); off(pollsOptsRef); off(pollsTotalsRef);
  hideCard(questionCard, "question");
  hideCard(pollCard, "poll");
  pollBars.innerHTML = "";
  pollOptions = {};
  // Game mode mirrors
  gmHide(gmPollsQuestion, "polls-question");
  gmHide(gmPollsBars, "polls-bars");
  if (gmPollsBarsContainer) gmPollsBarsContainer.innerHTML = "";
}

/* ── DRAWING ROUND TIMER ──
 * Thin bar overlaid on the bottom edge of the camera feed. Visible only during
 * a timed drawing round. Drains as time runs out; turns red in the last 10s.
 */
const drawTimerOverlay     = document.getElementById("drawTimerOverlay");
const drawTimerOverlayFill = document.getElementById("drawTimerOverlayFill");
let outputDrawTimerRafRunning = false;
let outputDrawTimerDurationMs = 60000;
function startOutputDrawTimer(timeEnd, durationMs) {
  outputDrawTimerDurationMs = durationMs > 0 ? durationMs : Math.max(1, timeEnd - Date.now());
  drawTimerOverlay.classList.add("show");
  if (gmDrawingTimerBar) gmDrawingTimerBar.classList.add("show");
  let lastTickedSec = null;
  outputDrawTimerRafRunning = true;

  function tick() {
    if (!outputDrawTimerRafRunning) return;
    const remaining = Math.max(0, timeEnd - Date.now());
    const secs = Math.ceil(remaining / 1000);
    const pct = (remaining / outputDrawTimerDurationMs) * 100;
    drawTimerOverlayFill.style.width = pct + "%";
    drawTimerOverlayFill.style.background = remaining <= 10000 ? "#ff647c" : "white";
    if (gmDrawingTimerFill) {
      gmDrawingTimerFill.style.width = pct + "%";
      gmDrawingTimerFill.style.background = remaining <= 10000 ? "#ff4d4d" : "white";
    }
    if (secs > 0 && secs <= 10 && secs !== lastTickedSec) {
      lastTickedSec = secs;
      playSnd(sndTick);
    }
    if (remaining > 0) {
      requestAnimationFrame(tick);
    } else {
      outputDrawTimerRafRunning = false;
      setTimeout(() => drawTimerOverlay.classList.remove("show"), 800);
      if (gmDrawingTimerBar) {
        setTimeout(() => gmDrawingTimerBar.classList.remove("show"), 800);
      }
    }
  }
  requestAnimationFrame(tick);
}
function stopOutputDrawTimer() {
  outputDrawTimerRafRunning = false;
  drawTimerOverlay.classList.remove("show");
  drawTimerOverlayFill.style.width = "100%";
  if (gmDrawingTimerBar) gmDrawingTimerBar.classList.remove("show");
  if (gmDrawingTimerFill) {
    gmDrawingTimerFill.style.width = "100%";
    gmDrawingTimerFill.style.background = "white";
  }
}
onValue(ref(db, "drawing/timer"), snap => {
  const t = snap.val();
  if (!drawingModeOn || !t?.endEpoch) { stopOutputDrawTimer(); return; }
  startOutputDrawTimer(t.endEpoch, t.durationMs || 0);
});

/* Drawing round ended — fires whether by timer expiry or manual Times Up button.

// Drawing prompt listener — purely for the sent.mp3 cue.
// Output doesn't display the drawing prompt itself in cam mode (that's only on
// phones), but in GAME MODE we DO display the prompt as the centerpiece during

let drawPromptWasShown = false;
let drawPromptFirstSnap = true; // skip the first snap so sent.mp3 doesn't replay on output refresh
let drawPromptText = "";
let drawPromptShown = false;
onValue(ref(db, "drawing/prompt"), snap => {
  const d = snap.val() || {};
  const isShown = !!(d.show && d.text);
  if (!drawPromptFirstSnap && isShown && !drawPromptWasShown) playSnd(sndSent);
  drawPromptFirstSnap = false;
  drawPromptWasShown = isShown;
  // Game-mode: track the prompt and update the card. We only show the prompt
  // card when no reveal is active (reveals take precedence).
  drawPromptText  = d.text || "";
  drawPromptShown = isShown;
  refreshGmDrawingState();
});

// Debounce hide so that when reveal mode swaps reveals (clear → set new),
// the brief null state doesn't collapse the panel before the new image arrives.
let drawHideTimer = null;
let drawCurrentRevealKey = null; // track which key is currently being revealed in gm

/* ── GAME-MODE drawing helpers ──
 * Drives the centered drawing card with two states:
 *   1. mode-prompt: shows the prompt text + drawing timer (active round)
 *   2. mode-reveal: shows a 3:4 image card + artist name (reveal phase)
 * Reveal takes precedence over prompt — if a submission is being shown, the
 * eyebrow + image take over the card even if prompt.show is still true.
 *
 * IMPORTANT — switching modes while the card is open causes the content shape
 * to change drastically (small prompt text vs 3:4 image card). To keep the
 * resize from snapping, we use a hide-then-show pattern on mode switches:
 * collapse the card via gmHide, wait for the grid-template-rows transition,
 * then re-show in the new mode. The animation is the same as the initial
 * card-open animation, so it feels consistent. */
let gmDrawingModeSwitchTimer = null;
function refreshGmDrawingState() {
  if (!gmDrawing) return;
  // Reveal takes priority — if a submission is currently being shown, stay in
  // reveal mode regardless of prompt.show
  if (drawCurrentRevealKey) {
    setGmDrawingMode("reveal");
    return;
  }
  // No reveal — if prompt is shown AND drawing mode is on, show the prompt
  if (drawingModeOn && drawPromptShown && drawPromptText) {
    if (gmDrawingPromptText) gmDrawingPromptText.textContent = drawPromptText;
    if (gmDrawingEyebrowText) gmDrawingEyebrowText.textContent = "";
    setGmDrawingMode("prompt");
    return;
  }
  // Otherwise hide the card entirely (e.g. drawing mode off, or prompt cleared
  // with no reveals active)
  hideGmDrawing();
}
/* Switch to a new mode with smooth animation:
 * - If card is hidden → just open in the new mode (fast path)
 * - If card is showing in same mode → no-op
 * - If card is showing in different mode → collapse, wait, switch, re-show */
function setGmDrawingMode(newMode) {
  if (!gmDrawing) return;
  const isShowing = gmDrawing.classList.contains("show");
  const currentMode = gmDrawing.classList.contains("mode-reveal") ? "reveal"
                    : gmDrawing.classList.contains("mode-prompt") ? "prompt"
                    : null;

  if (gmDrawingModeSwitchTimer) {
    clearTimeout(gmDrawingModeSwitchTimer);
    gmDrawingModeSwitchTimer = null;
  }

  // Fast path — card hidden, just open in new mode
  if (!isShowing) {
    applyGmDrawingMode(newMode);
    gmShow(gmDrawing, "drawing");
    return;
  }
  // Same mode already showing — nothing to do
  if (currentMode === newMode) return;
  // Card showing in different mode — collapse, swap, re-show
  gmHide(gmDrawing, "drawing");
  gmDrawingModeSwitchTimer = setTimeout(() => {
    gmDrawingModeSwitchTimer = null;
    applyGmDrawingMode(newMode);
    gmShow(gmDrawing, "drawing");
  }, 480); // match grid-template-rows transition (0.45s) + small buffer
}
function applyGmDrawingMode(mode) {
  if (!gmDrawing) return;
  gmDrawing.classList.remove("mode-reveal", "mode-prompt");
  if (mode === "reveal") gmDrawing.classList.add("mode-reveal");
  else if (mode === "prompt") gmDrawing.classList.add("mode-prompt");
}
function showGmDrawingReveal(key) {
  if (!gmDrawing || !gmDrawingImage) return;
  const sub = drawSubs[key];
  if (!sub || !sub.data) return;
  const isAlreadyReveal = drawCurrentRevealKey && gmDrawing.classList.contains("mode-reveal");
  const isCrossfade = isAlreadyReveal && drawCurrentRevealKey !== key;
  drawCurrentRevealKey = key;

  // Resolve artist name from participants cache (falls back to fallback string)
  const artistName = participantsCache[key]?.name || "ANONYMOUS";

  if (isCrossfade) {
    // Already showing a reveal — fade image out, swap, fade in (no card resize
    // because both submissions go in the same 3:4 white card)
    gmDrawingImage.style.opacity = "0";
    setTimeout(() => {
      gmDrawingImage.src = sub.data;
      if (gmDrawingEyebrowText) gmDrawingEyebrowText.textContent = artistName.toUpperCase();
      gmDrawingImage.style.opacity = "1";
    }, 200);
  } else if (isAlreadyReveal) {
    // Same reveal still showing (no key change) — just sync the data
    gmDrawingImage.src = sub.data;
    if (gmDrawingEyebrowText) gmDrawingEyebrowText.textContent = artistName.toUpperCase();
    gmDrawingImage.style.opacity = "1";
  } else {
    // Coming from prompt mode (or hidden) — animate via setGmDrawingMode.
    // Pre-populate the image data so it's ready when the card re-shows.
    gmDrawingImage.src = sub.data;
    gmDrawingImage.style.opacity = "1";
    if (gmDrawingEyebrowText) gmDrawingEyebrowText.textContent = artistName.toUpperCase();
    setGmDrawingMode("reveal");
  }
}
function hideGmDrawing() {
  if (!gmDrawing) return;
  if (gmDrawingModeSwitchTimer) {
    clearTimeout(gmDrawingModeSwitchTimer);
    gmDrawingModeSwitchTimer = null;
  }
  drawCurrentRevealKey = null;
  gmHide(gmDrawing, "drawing");
  // Defer cleanup so the card collapses smoothly first, then we strip mode
  // classes + image src after the transition completes (avoids the "snap back
  // to prompt" flash during collapse animation).
  setTimeout(() => {
    if (!gmDrawing.classList.contains("show")) {
      gmDrawing.classList.remove("mode-reveal", "mode-prompt");
      if (gmDrawingImage) {
        gmDrawingImage.src = "";
        gmDrawingImage.style.opacity = "1";
      }
      if (gmDrawingPromptText) gmDrawingPromptText.textContent = "";
      if (gmDrawingEyebrowText) gmDrawingEyebrowText.textContent = "";
    }
    if (gmDrawingTimerBar) gmDrawingTimerBar.classList.remove("show");
    if (gmDrawingTimerFill) {
      gmDrawingTimerFill.style.width = "100%";
      gmDrawingTimerFill.style.background = "white";
    }
  }, 500);
}

onValue(drawRevealRef, snap => {
  const r = snap.val() || {};
  const key = Object.keys(r).find(k => r[k]?.show === true);

  if (key && drawSubs[key]?.data) {
    // A reveal is active — cancel any pending hide and show the image
    if (drawHideTimer) { clearTimeout(drawHideTimer); drawHideTimer = null; }
    showDrawPanel(drawSubs[key].data, "DRAWING", revealModeOn);
    // Game-mode mirror — show the image in the gm card with crossfade if
    // already in reveal mode (advancing through submissions)
    showGmDrawingReveal(key);
  } else {
    // No reveal — if reveal mode is on, wait briefly in case a new one is coming
    // (control clears then immediately sets new reveal when switching person)
    if (revealModeOn && drawPanel.classList.contains("show")) {
      drawHideTimer = setTimeout(() => {
        drawHideTimer = null;
        hideDrawPanel();
        // Game-mode: drop reveal state — fall back to prompt mode if prompt
        // is still visible, otherwise hide the card entirely
        drawCurrentRevealKey = null;
        refreshGmDrawingState();
      }, 600);
    } else {
      hideDrawPanel();
      drawCurrentRevealKey = null;
      refreshGmDrawingState();
    }
  }
});

function paintGmSkribblPlayingEyebrow() {
  // Only update the playing-state text — don't touch results / win state, those
  // are driven by their own listeners.
  if (!gmSkribblEyebrow || !gmSkribblEyebrowText) return;
  if (gmSkribblEyebrow.classList.contains("results")) return;
  if (gmSkribblEyebrow.classList.contains("win")) return;
  if (!skribblOn || skribblPhase !== "playing") {
    gmSkribblEyebrowText.textContent = "";
    return;
  }
  const drawerName = skribblDrawerKey && participantsCache[skribblDrawerKey]?.name;
  gmSkribblEyebrowText.textContent = drawerName ? `${drawerName} IS DRAWING` : "";
}

let skribblTimerRafRunning = false;
let skribblRoundDuration = 60000;

const MEDALS = ["🥇","🥈","🥉"];

/* ── LEADERBOARD PANEL (left side) ── */
function renderLbPanel(entries) {
  if (!entries || !entries.length) {
    lbPanelRows.innerHTML = `<div id="lbPanelEmpty" style="font-family:'Barlow Condensed',sans-serif;font-size:clamp(11px,1.3vh,15px);color:rgba(255,255,255,0.3);text-align:center;padding:clamp(8px,1vh,14px) 0;">Waiting…</div>`;
    return;

  lbPanelRows.innerHTML = entries.map((e, i) => `
    <div class="lb-panel-row" style="animation-delay:${i * 0.05}s">

      <span class="lb-panel-name" title="${e.name}">${e.name}</span>
    </div>`).join("");
}

/* ── GAME-MODE leaderboard renderer ── 
 * Renders into the gm skribbl card. Same data, different DOM target + classes.
 * Empty state shows "WAITING FOR GUESSES…" instead of an empty list. */
function renderGmSkribblLb(entries) {
  if (!gmSkribblLbRows) return;
  if (!entries || !entries.length) {
    gmSkribblLbRows.innerHTML = `<div id="gmSkribblLb-empty">WAITING FOR GUESSES…</div>`;
    return;

  gmSkribblLbRows.innerHTML = entries.map((e, i) => `

}

function hideLbPanel() {

/* ── TIMER IN DRAW PANEL EYEBROW ── */
function startOutputTimer(timeEnd, durationMs) {
  skribblRoundDuration = durationMs > 0 ? durationMs : Math.max(1, timeEnd - Date.now());
  drawPanelTimer.classList.add("show");
  if (gmSkribblTimerBar) gmSkribblTimerBar.classList.add("show");
  let lastTickedSec = null;
  skribblTimerRafRunning = true;

  function tick() {
    if (!skribblTimerRafRunning) return;
    const remaining = Math.max(0, timeEnd - Date.now());
    const secs = Math.ceil(remaining / 1000);
    drawPanelTimer.textContent = secs + "s";
    drawPanelTimer.classList.toggle("urgent", remaining <= 10000);
    if (gmSkribblTimerFill) {
      const pct = Math.max(0, Math.min(100, (remaining / skribblRoundDuration) * 100));
      gmSkribblTimerFill.style.width = pct + "%";
      gmSkribblTimerFill.style.background = remaining <= 10000 ? "#ff4d4d" : "white";
    }
    if (secs > 0 && secs <= 10 && secs !== lastTickedSec) {
      lastTickedSec = secs;
      playSnd(sndTick);
    }
    if (remaining > 0) {
      requestAnimationFrame(tick);
    } else {
      skribblTimerRafRunning = false;
      drawPanelTimer.textContent = "0s";
      if (gmSkribblTimerFill) gmSkribblTimerFill.style.width = "0%";
    }
  }
  requestAnimationFrame(tick);
}

function stopOutputTimer() {
  skribblTimerRafRunning = false;
  drawPanelTimer.classList.remove("show", "urgent");
  drawPanelTimer.textContent = "";
  if (gmSkribblTimerBar) gmSkribblTimerBar.classList.remove("show");
  if (gmSkribblTimerFill) {
    gmSkribblTimerFill.style.width = "100%";
    gmSkribblTimerFill.style.background = "white";
  }
}

/* ── RENDER INLINE LB CARD (infoPanel) — kept for reference ── */

    </div>`).join("");
}

function spawnFloatingGuess(text, correct) {
  // Build the guess element once; we'll clone it for the gm mirror so both
  // layers (cam + gm) get an independent animated copy. Random trajectory
  // is shared between cam + gm so they look like the "same" guess but each
  // is anchored to its own layer.
  function makeEl() {
    const el = document.createElement("div");
    el.className = "floating-guess" + (correct ? " correct" : "");
    const colonIdx = text.indexOf(":");
    if (colonIdx > 0 && !correct) {
      const name  = text.slice(0, colonIdx).trim();
      const guess = text.slice(colonIdx + 1).trim();
      el.innerHTML =
        `<span class="guess-name">${name}</span>` +
        `<span class="guess-text">${guess}</span>`;
    } else {
      el.textContent = (correct ? "✓ " : "") + text;
    }
    return el;
  }

  // Random horizontal start (10%–90%) and end (drift across by ±25%)
  const startPct = 12 + Math.random() * 76;
  const drift    = (Math.random() - 0.5) * 50; // -25% to +25%
  const endPct   = Math.max(5, Math.min(95, startPct + drift));
  // Random rise distance (45vh to 70vh) so bubbles don't all converge
  const rise     = 45 + Math.random() * 25;
  // Subtle rotation tilt — tighter range than before so it feels intentional
  const tilt     = (Math.random() - 0.5) * 10;

  function place(el) {
    el.style.setProperty("--start-x", startPct + "%");
    el.style.setProperty("--end-x",   endPct   + "%");
    el.style.setProperty("--rise",    rise     + "vh");
    el.style.setProperty("--tilt",    tilt     + "deg");
  }

  // Cam-mode layer
  const camEl = makeEl();
  place(camEl);
  skribblGuessLayer.appendChild(camEl);
  setTimeout(() => camEl.remove(), 6500);

  // Game-mode mirror layer — independent element with same trajectory
  if (gmSkribblGuessLayer) {
    const gmEl = makeEl();
    place(gmEl);
    gmSkribblGuessLayer.appendChild(gmEl);
    setTimeout(() => gmEl.remove(), 6500);
  }
}

let skribblPhase = null; // "playing" | "results" | null
let prevLbCount  = 0;    // track leaderboard growth so we play correct.mp3 only on new entries

function playSnd(el) {
  if (!el) return;
  try {
    el.currentTime = 0;
    const p = el.play();
    if (p && p.catch) p.catch(() => { /* autoplay-blocked; ignore */ });
  } catch (e) { /* ignore */ }
}

});

// Phase listener — "results" means slide drawing panel away, keep leaderboard up
let skribblCurrentWord = "";
onValue(skribblWordRef, snap => { skribblCurrentWord = snap.val() || ""; });

// Reveal the full word as filled-in hint cells (used in results phase)
function revealFullWord(word) {
  if (!word) return;
  const fullHint = word.split("").map(ch =>
    ch === " " ? { letter: " ", revealed: false } : { letter: ch, revealed: true }
  );
  renderHint(fullHint);
}

onValue(skribblPhaseRef, snap => {
  const prevPhase = skribblPhase;
  skribblPhase = snap.val();
  if (!skribblOn) return;
  if (skribblPhase === "results") {
    // Freeze the timer at 0
    stopOutputTimer();
    // Update the eyebrow label on the drawing panel: "LIVE DRAWING" → "IT WAS A..."
    drawPanelLabel.textContent = "🎨 IT WAS...";
    // Reveal every letter of the word in the hint display below the drawing
    revealFullWord(skribblCurrentWord);
    // Game-mode mirror — eyebrow shows "IT WAS [WORD]" in white
    if (gmSkribblEyebrow) gmSkribblEyebrow.classList.add("results");
    if (gmSkribblEyebrow) gmSkribblEyebrow.classList.remove("win");
    if (gmSkribblEyebrowText) {
      gmSkribblEyebrowText.textContent = `IT WAS "${(skribblCurrentWord || "").toUpperCase()}"`;
    }
    if (gmSkribblTimerBar) gmSkribblTimerBar.classList.remove("show");
    // Drawing stays visible — drawer's last frame is still up via skribblLiveImg
    // Play end-of-round cue (only on the actual transition into results)
    if (prevPhase !== "results") playSnd(sndEnd);
  } else if (skribblPhase === "playing") {
    // New round started — restore live drawing label + play start cue
    drawPanelLabel.textContent = "🎨 LIVE DRAWING";
    // Game-mode: clear results/win state on eyebrow
    if (gmSkribblEyebrow) gmSkribblEyebrow.classList.remove("results", "win");
    if (gmSkribblEyebrowText) gmSkribblEyebrowText.textContent = "";
    paintGmSkribblPlayingEyebrow();
    if (prevPhase !== "playing") playSnd(sndStart);
  } else if (skribblPhase === null && prevPhase === "results") {
    // Reset — clear the frozen drawing and tear down the panel
    skribblLiveImg.style.display = "none";
    skribblLiveImg.src = "";
    skribblHintDisplay.classList.remove("show");
    skribblHintDisplay.innerHTML = "";
    drawPanelLabel.textContent = "DRAWING";
    const drawRevealVisible = drawPanelImg.style.display !== "none" && drawPanelImg.src;
    if (!drawRevealVisible) hideDrawPanel();
    // Game-mode reset — also hide the card and clear leaderboard, otherwise the
    // empty canvas + "WAITING FOR GUESSES…" hangs around after the round ends
    if (gmSkribblLiveImg) gmSkribblLiveImg.src = "";
    if (gmSkribblHint) gmSkribblHint.innerHTML = "";
    if (gmSkribblEyebrow) gmSkribblEyebrow.classList.remove("results", "win");
    if (gmSkribblEyebrowText) gmSkribblEyebrowText.textContent = "";
    if (gmSkribblLbRows) gmSkribblLbRows.innerHTML = "";
    if (gmSkribblTimerBar) gmSkribblTimerBar.classList.remove("show");
    gmHide(gmSkribbl, "skribbl");
  }
});

// Live canvas stream from drawer
onValue(skribblLiveRef, snap => {
  const val = snap.val();
  if (!skribblOn) return;
  // Don't re-open the drawing panel if we're in results phase
  if (skribblPhase === "results") return;
  if (val && typeof val === "string" && val.startsWith("data:")) {
    skribblLiveImg.src = val;
    skribblLiveImg.style.display = "block";
    drawPanelImg.style.display = "none";
    drawPanelLabel.textContent = "🎨 LIVE DRAWING";
    stage.classList.add("draw-open");
    drawPanel.classList.add("show");
    // Game-mode mirror
    if (gmSkribblLiveImg) gmSkribblLiveImg.src = val;
    gmShow(gmSkribbl, "skribbl");
  } else if (val === null) {
    // Reset — clear the drawing
    skribblLiveImg.style.display = "none";
    skribblLiveImg.src = "";
    if (gmSkribblLiveImg) gmSkribblLiveImg.src = "";
    // Hide the drawing panel unless a static draw-mode reveal is in it
    const drawRevealVisible = drawPanelImg.style.display !== "none" && drawPanelImg.src;
    if (!drawRevealVisible) hideDrawPanel();
    // Game-mode mirror — hide the card too
    gmHide(gmSkribbl, "skribbl");
  }
});

// Leaderboard — fills in live as correct guesses come in
onValue(skribblLeaderboardRef, snap => {
  if (!skribblOn) return;
  const lb = snap.val();
  const entries = lb ? (Array.isArray(lb) ? lb : Object.values(lb)) : [];
  entries.sort((a, b) => (a.rank ?? 0) - (b.rank ?? 0));

  // Reset cleared the leaderboard — hide the panel
  if (entries.length === 0) {
    if (lbPanel.classList.contains("show")) hideLbPanel();
    renderLbPanel([]);
    renderGmSkribblLb([]);
    prevLbCount = 0;
    return;
  }

  // Play correct cue when a new entry appears
  if (entries.length > prevLbCount) {
    playSnd(sndCorrect);
  }
  prevLbCount = entries.length;

  // First correct guess — slide the panel in
  if (!lbPanel.classList.contains("show")) showLbPanel();

  renderLbPanel(entries);
  renderGmSkribblLb(entries);

  // Flash winner overlay briefly for the very first correct guess
  if (entries.length === 1) {
    const first = entries[0];
    if (!skribblWinnerOverlay.classList.contains("show")) {
      skribblWinName.textContent = `${first.name} GOT IT FIRST!`;
      skribblWinnerOverlay.classList.add("show");
      setTimeout(() => skribblWinnerOverlay.classList.remove("show"), 2500);
    }
    // Game-mode mirror — the gm eyebrow flashes "🎉 NAME GOT IT FIRST!" briefly,
    // then reverts to the normal playing-state label. We only do this if we're
    // still in playing phase (don't override the results-state eyebrow).
    if (gmSkribblEyebrow && skribblPhase === "playing") {
      gmSkribblEyebrow.classList.add("win");
      gmSkribblEyebrow.classList.remove("results");
      if (gmSkribblEyebrowText) gmSkribblEyebrowText.textContent = `🎉 ${first.name} GOT IT FIRST!`;
      setTimeout(() => {
        // Only revert if still in playing phase (not if results triggered meanwhile)
        if (skribblPhase === "playing" && gmSkribblEyebrow.classList.contains("win")) {
          gmSkribblEyebrow.classList.remove("win");
          if (gmSkribblEyebrowText) gmSkribblEyebrowText.textContent = "";
        }
      }, 2500);
    }
  }
});

// Floating guesses — only WRONG guesses bubble up.
// Correct guesses are intentionally hidden from the float so they don't
// leak the answer to other players watching the screen.
const seenGuesses = new Set();
let skribblGuessFirstSnap = true;
onValue(skribblGuessRef, snap => {
  if (!skribblOn) return;
  const all = snap.val() || {};
  // First snapshot on listener attach — mark all existing as seen but don't float them
  if (skribblGuessFirstSnap) {
    skribblGuessFirstSnap = false;
    Object.keys(all).forEach(k => seenGuesses.add(k));
    return;
  }
  Object.entries(all).forEach(([key, g]) => {
    if (seenGuesses.has(key)) return;
    seenGuesses.add(key);
    const guessText = (g.text || "").toLowerCase().trim();
    const word      = (skribblCurrentWord || "").toLowerCase().trim();
    // Skip floating if this guess matches the secret word (correct guess)
    if (word && guessText === word) return;
    spawnFloatingGuess(`${g.name}: ${g.text}`, false);
  });
});

/* ─── WORDLE (Phase 2: render guesses + keyboard with letter states) ─── */
let wordleOn       = false;
let wordleWord     = "";
let wordleAttempts = 6;
let wordleGuesses  = [];           // array of { text, evaluation, guesserKey, guesserName }
let wordleKbState  = {};           // { A: "absent", B: "present", ... }

const KB_ROWS = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["Z","X","C","V","B","N","M"],
];

function renderWordleGrid() {
  // Render into BOTH cam-mode and game-mode targets so flipping meta/gameMode
  // mid-round is seamless. Both grids stay continuously in sync.
  renderWordleGridInto(wordleGrid);
  renderWordleGridInto(gmWordleGrid);
}
function renderWordleGridInto(target) {
  if (!target) return;
  const cols = wordleWord.length;
  if (cols === 0 || wordleAttempts <= 0) {
    target.innerHTML = "";
    return;
  }

  // Helper: get rows that aren't currently animating out
  const liveRows = () => Array.from(target.querySelectorAll(".wordle-row"))
    .filter(r => !r.dataset.removing);

  // Diff-based render: keep existing rows when only the row count changes
  // (e.g. operator slides attempts slider). Append new rows / remove excess.
  // This lets each new row fade-in independently instead of the whole grid
  // popping back into existence.
  const existing = liveRows();
  // If column count changed (new word), wipe completely — old rows have
  // wrong cell counts and can't be diffed cleanly
  const colMismatch = existing[0] && existing[0].children.length !== cols;
  if (colMismatch) {
    target.innerHTML = "";
  }

  for (let r = 0; r < wordleAttempts; r++) {
    let row = liveRows()[r];
    const isNew = !row;
    if (isNew) {
      row = document.createElement("div");
      row.className = "wordle-row";
      row.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      // Fade-in animation via inline style so it only runs on new rows.
      // Existing rows during a re-render don't replay the animation.
      row.style.animation = "fadeUp 0.4s ease both";
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement("div");
        cell.className = "wordle-cell";
        row.appendChild(cell);
      }
      target.appendChild(row);
    }
    // Sync cell content + state for this row
    const guess = wordleGuesses[r];
    const cellNodes = row.children;
    for (let c = 0; c < cols; c++) {
      const cell = cellNodes[c];
      cell.className = "wordle-cell"; // reset state classes
      cell.textContent = "";
      if (guess) {
        const letter = (guess.text || "")[c] || "";
        const evalState = guess.evaluation?.[c] || "";
        if (letter) cell.textContent = letter.toUpperCase();
        if (evalState) cell.classList.add(evalState);
      }
    }
  }

  // Remove excess LIVE rows when attempts shrinks (e.g. slider 10 → 6).
  // Fade them out before removing so the shrink animates instead of snapping.
  const allLive = liveRows();
  const excessRows = allLive.slice(wordleAttempts);
  for (const row of excessRows) {
    row.dataset.removing = "1";
    row.style.transition = "opacity 0.3s ease, height 0.4s cubic-bezier(0.22, 1, 0.36, 1)";
    row.style.opacity = "0";
    row.style.height = "0";
    row.style.overflow = "hidden";
    setTimeout(() => {
      if (row.parentNode) row.parentNode.removeChild(row);
    }, 420);
  }

  // Recompute cell sizing based on the new row count
  sizeWordleCellsFor(target);
}

function sizeWordleCellsFor(target) {
  if (!target) return;
  const cols = wordleWord.length;
  const rows = wordleAttempts;
  if (!cols || !rows) return;

  let cellSize;

  if (target === gmWordleGrid) {
    // Game mode sizing model:
    //   1. Compute a TARGET cell size that scales with viewport (so 1080p gets
    //      smaller cells than 4K — both fit cleanly without scrollbars).
    //   2. Constrain by viewport WIDTH (cols × cell + gaps must fit horizontally).
    //   3. Constrain by viewport HEIGHT (rows × cell + gaps must fit vertically,
    //      reserving space for wordmark + eyebrow + keyboard + padding).
    //   4. Take the smallest of the three. No container measuring (avoids the
    //      chicken-and-egg of measuring an auto-sized container that depends on
    //      the cell size).
    const gap = 6;
    // Target scales with viewport min-dimension. 1080p (min 1080) → ~54px.
    // 4K (min 2160) → ~108px capped at 96px.
    // ◄── tune: change 0.05 for chunkier (higher) or smaller (lower) cells
    const vmin = Math.min(window.innerWidth, window.innerHeight);
    const targetCell = Math.max(40, Math.min(96, vmin * 0.05));
    // Reserved chrome: wordmark + page padding above/below + container padding
    // + eyebrow + keyboard + gap between sections. ~400px is a safe budget
    // that ensures the grid always fits within the container's max-height.
    const reservedV = 400;
    const reservedH = 120;
    const maxHorizCell = (window.innerWidth  - reservedH - (cols - 1) * gap) / cols;
    const maxVertCell  = (window.innerHeight - reservedV - (rows - 1) * gap) / rows;
    cellSize = Math.max(20, Math.min(targetCell, maxHorizCell, maxVertCell));
  } else {
    // Cam mode: original algorithm — fit to side panel container's measured
    // dimensions, capped at 60px.
    const cs = window.getComputedStyle(target);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop)  + parseFloat(cs.paddingBottom);
    const containerW = target.clientWidth  - padX;
    const containerH = target.clientHeight - padY;
    if (containerW <= 0 || containerH <= 0) return;
    const gap = 6;
    const maxByWidth  = (containerW - (cols - 1) * gap) / cols;
    const maxByHeight = (containerH - (rows - 1) * gap) / rows;
    cellSize = Math.max(20, Math.min(maxByWidth, maxByHeight, 60));
  }

  target.style.setProperty("--wordle-out-cell", cellSize + "px");
}

// Back-compat alias for any external callers
function sizeWordleOutputCells() {
  sizeWordleCellsFor(wordleGrid);
  sizeWordleCellsFor(gmWordleGrid);
}

// Recompute on container resize (handles viewport size changes, panel show/hide,
// 1080p vs 4K browser, game-mode flip)
if (typeof ResizeObserver !== "undefined") {
  if (wordleGrid) {
    new ResizeObserver(() => sizeWordleCellsFor(wordleGrid)).observe(wordleGrid);
  }
  if (gmWordleGrid) {
    new ResizeObserver(() => sizeWordleCellsFor(gmWordleGrid)).observe(gmWordleGrid);
  }
}
window.addEventListener("resize", () => sizeWordleOutputCells());

// Caches of letter → key element so we can update colors in place rather than
// rebuilding the whole keyboard on every state change. Rebuilding destroys
// the DOM nodes, which means CSS transitions never get a chance to fire —
// the browser only animates property changes on EXISTING elements.
// Separate caches per target (cam vs game-mode) so they don't conflict.
const wordleKeyEls   = {};
const gmWordleKeyEls = {};

function renderWordleKeyboard() {
  renderWordleKeyboardInto(wordleKeyboard,   wordleKeyEls);
  renderWordleKeyboardInto(gmWordleKeyboard, gmWordleKeyEls);
}
function renderWordleKeyboardInto(target, cache) {
  if (!target) return;
  // Build the keyboard once if it's empty; otherwise just refresh state classes.
  if (target.children.length === 0) {
    target.innerHTML = "";
    for (const k in cache) delete cache[k];
    for (const row of KB_ROWS) {
      const rowEl = document.createElement("div");
      rowEl.className = "wordle-kb-row";
      for (const letter of row) {
        const k = document.createElement("div");
        k.className = "wordle-key";
        k.textContent = letter;
        cache[letter] = k;
        rowEl.appendChild(k);
      }
      target.appendChild(rowEl);
    }
  }
  // Sync state classes on the existing key elements. Setting a class that's
  // already there is a no-op; switching from one state to another triggers
  // the CSS background transition for a smooth color fade.
  for (const letter in cache) {
    const k = cache[letter];
    const state = wordleKbState[letter];
    k.className = state ? `wordle-key ${state}` : "wordle-key";
  }
}

function showWordlePanel() {
  if (!wordlePanel) return;
  // Cancel any pending post-hide content cleanup since we're showing again
  if (wordlePanelHideTimeout) { clearTimeout(wordlePanelHideTimeout); wordlePanelHideTimeout = null; }
  wordlePanel.classList.add("show");
  // Game-mode mirror — show the gm wordle card so the container grows to fit it
  gmShow(gmWordle, "wordle");
}
let wordlePanelHideTimeout = null;
function hideWordlePanel() {
  if (!wordlePanel) return;
  wordlePanel.classList.remove("show");
  // Game-mode mirror — hide the gm wordle card so the container shrinks back
  gmHide(gmWordle, "wordle");
  // Defer content cleanup until the slide-out finishes (same pattern as drawPanel).
  // Without this delay, the grid + keyboard empty mid-transition and you see a
  // blank panel slide away instead of a populated one.
  if (wordlePanelHideTimeout) clearTimeout(wordlePanelHideTimeout);
  wordlePanelHideTimeout = setTimeout(() => {
    wordlePanelHideTimeout = null;
    if (wordlePanel.classList.contains("show")) return; // re-shown mid-fade — don't wipe
    if (wordleGrid)     wordleGrid.innerHTML = "";
    if (wordleKeyboard) {
      wordleKeyboard.innerHTML = "";
      for (const k in wordleKeyEls) delete wordleKeyEls[k];
    }
    if (wordleTurnTimerBar) wordleTurnTimerBar.classList.remove("show");
    if (wordlePanelEyebrow) wordlePanelEyebrow.classList.remove("results");
    if (wordlePanelGuesser) {
      wordlePanelGuesser.textContent = "";
      wordlePanelGuesser.classList.remove("win", "lose");
    }
    // Game-mode mirror cleanup
    if (gmWordleGrid)     gmWordleGrid.innerHTML = "";
    if (gmWordleKeyboard) {
      gmWordleKeyboard.innerHTML = "";
      for (const k in gmWordleKeyEls) delete gmWordleKeyEls[k];
    }
    if (gmWordleTurnTimerBar) gmWordleTurnTimerBar.classList.remove("show");
    if (gmWordleEyebrow) gmWordleEyebrow.classList.remove("results");
    if (gmWordleEyebrowGuesser) {
      gmWordleEyebrowGuesser.textContent = "";
      gmWordleEyebrowGuesser.classList.remove("win", "lose");
    }
  }, 520); // slightly longer than 0.5s transition for a clean handoff
}

onValue(wordleModeRef, snap => {
  wordleOn = snap.val() === true;
  if (!wordleOn) {
    hideWordlePanel(); // handles content wipe + state classes after slide-out
    wordleWord = "";
    wordleGuesses = [];
    wordleKbState = {};
    wordleTimerRafRunning = false;
  }
});

onValue(wordleAttemptsRef, snap => {
  wordleAttempts = parseInt(snap.val(), 10) || 6;
  if (wordleOn && wordleWord) renderWordleGrid();
});

onValue(wordleWordRef, snap => {
  wordleWord = (snap.val() || "").toUpperCase();
  if (wordleOn && wordleWord) {
    renderWordleGrid();
    renderWordleKeyboard();
    showWordlePanel();
  } else if (!wordleWord) {
    hideWordlePanel(); // handles content wipe after slide-out
    wordleGuesses = [];
    wordleKbState = {};
  }
});

// Guesses array — control writes here after evaluating each guess
onValue(wordleGuessesRef, snap => {
  const v = snap.val();
  // Firebase returns arrays as objects when there are gaps, so normalize
  wordleGuesses = v
    ? (Array.isArray(v) ? v.filter(Boolean) : Object.values(v))
    : [];
  if (wordleOn) renderWordleGrid();
});

// Keyboard state — control writes per-letter as guesses are evaluated
onValue(wordleKeyboardStateRef, snap => {
  wordleKbState = snap.val() || {};
  if (wordleOn) renderWordleKeyboard();
});

/* ─── Eyebrow text controller ───
 * The single #wordlePanelGuesser slot is repurposed across phases:
 *   • playing  → "ALICE's turn"   (updates as turn passes)
 *   • results  → "🎉 ALICE GOT IT!"   (or "IT WAS...")
 * Replaces the old separate result banner; keeps the panel from growing
 * vertically when the round ends.
 */
let wordlePhaseLocal = null;
let wordleTimerRafRunning = false;
let wordleCurrentGuesserName = "";
let wordleWinnerLocal = null;

// Crossfade helper — fades the guesser slot out, runs the text-mutating fn,
// then fades it back in. Skips the fade for the very first paint (when there's
// no text yet) and for "no change" updates so we don't strobe on identical state.
function crossfadeWordleEyebrow(applyFn) {
  if (!wordlePanelGuesser) { applyFn(); return; }
  const wasEmpty = wordlePanelGuesser.textContent === "";
  // Capture pre-mutation snapshot to detect whether the text actually changes
  const prevText  = wordlePanelGuesser.textContent;
  const prevClass = wordlePanelGuesser.className;
  const prevEyebrowClass = wordlePanelEyebrow ? wordlePanelEyebrow.className : "";
  if (wasEmpty) {
    // First paint or coming back from empty — apply immediately, the fadeUp
    // animation on the .results state handles its own entry already
    applyFn();
    return;
  }
  // Fade out, swap, fade back in
  wordlePanelGuesser.style.opacity = "0";
  setTimeout(() => {
    applyFn();
    // If nothing changed, skip the fade-in flicker
    const sameText  = wordlePanelGuesser.textContent === prevText;
    const sameClass = wordlePanelGuesser.className === prevClass;
    const sameEyebrowClass = (wordlePanelEyebrow ? wordlePanelEyebrow.className : "") === prevEyebrowClass;
    if (sameText && sameClass && sameEyebrowClass) {
      wordlePanelGuesser.style.opacity = "";
      return;
    }
    // Allow the new content to render at opacity:0, then fade in
    requestAnimationFrame(() => {
      wordlePanelGuesser.style.opacity = "";
    });
  }, 220);
}

function paintWordleEyebrow() {
  if (!wordlePanelGuesser || !wordlePanelEyebrow) return;
  crossfadeWordleEyebrow(() => {
    if (wordlePhaseLocal === "results" && wordleWinnerLocal) {
      const w = wordleWinnerLocal;
      wordlePanelEyebrow.classList.add("results");
      if (gmWordleEyebrow) gmWordleEyebrow.classList.add("results");
      if (w.userKey && w.name) {
        wordlePanelGuesser.classList.add("win");
        wordlePanelGuesser.classList.remove("lose");
        wordlePanelGuesser.textContent = `${w.name} GOT IT!`;
        if (gmWordleEyebrowGuesser) {
          gmWordleEyebrowGuesser.classList.add("win");
          gmWordleEyebrowGuesser.classList.remove("lose");
          gmWordleEyebrowGuesser.textContent = `${w.name} GOT IT!`;
        }
      } else {
        wordlePanelGuesser.classList.add("lose");
        wordlePanelGuesser.classList.remove("win");
        wordlePanelGuesser.textContent = `IT WAS "${w.word || ""}"😔`;
        if (gmWordleEyebrowGuesser) {
          gmWordleEyebrowGuesser.classList.add("lose");
          gmWordleEyebrowGuesser.classList.remove("win");
          gmWordleEyebrowGuesser.textContent = `IT WAS "${w.word || ""}"😔`;
        }
      }
      return;
    }
    // Not results — turn-name mode (or empty)
    wordlePanelEyebrow.classList.remove("results");
    wordlePanelGuesser.classList.remove("win", "lose");
    const txt = wordleCurrentGuesserName && wordlePhaseLocal === "playing"
      ? `${wordleCurrentGuesserName} IS GUESSING`
      : "";
    wordlePanelGuesser.textContent = txt;
    // Game mode mirror
    if (gmWordleEyebrow) gmWordleEyebrow.classList.remove("results");
    if (gmWordleEyebrowGuesser) {
      gmWordleEyebrowGuesser.classList.remove("win", "lose");
      gmWordleEyebrowGuesser.textContent = txt;
    }
  });
}

onValue(wordlePhaseRef, snap => {
  wordlePhaseLocal = snap.val();
  // Hide timer bar when leaving playing state
  if (wordlePhaseLocal !== "playing") {
    if (wordleTurnTimerBar)   wordleTurnTimerBar.classList.remove("show");
    if (gmWordleTurnTimerBar) gmWordleTurnTimerBar.classList.remove("show");
    wordleTimerRafRunning = false;
  }
  paintWordleEyebrow();
  // Existing behavior: hide whole panel if everything is cleared
  if (wordlePhaseLocal === null && !wordleWord) {
    hideWordlePanel();
  }
});

// Current guesser name — used by paintWordleEyebrow in playing phase
onValue(wordleCurrentGuesserNameRef, snap => {
  wordleCurrentGuesserName = snap.val() || "";
  paintWordleEyebrow();
});

// Turn timer — drains as the guesser's time runs out
onValue(wordleTurnTimerRef, snap => {
  if (!wordleTurnTimerBar || !wordleTurnTimerFill) return;
  const t = snap.val();
  wordleTimerRafRunning = false;
  if (!t?.endEpoch || wordlePhaseLocal !== "playing") {
    wordleTurnTimerBar.classList.remove("show");
    wordleTurnTimerFill.style.width = "100%";
    if (gmWordleTurnTimerBar)  gmWordleTurnTimerBar.classList.remove("show");
    if (gmWordleTurnTimerFill) gmWordleTurnTimerFill.style.width = "100%";
    return;
  }
  const epoch   = t.endEpoch;
  const totalMs = t.durationMs > 0 ? t.durationMs : Math.max(1, epoch - Date.now());
  wordleTurnTimerBar.classList.add("show");
  if (gmWordleTurnTimerBar) gmWordleTurnTimerBar.classList.add("show");
  wordleTimerRafRunning = true;

  function tick() {
    if (!wordleTimerRafRunning) return;
    const remaining = Math.max(0, epoch - Date.now());
    const pct = (remaining / totalMs) * 100;
    const bg  = remaining <= 10000 ? "#ff647c" : "white";
    wordleTurnTimerFill.style.width = pct + "%";
    wordleTurnTimerFill.style.background = bg;
    if (gmWordleTurnTimerFill) {
      gmWordleTurnTimerFill.style.width = pct + "%";
      gmWordleTurnTimerFill.style.background = bg;
    }
    if (remaining > 0) {
      requestAnimationFrame(tick);
    } else {
      wordleTimerRafRunning = false;
      setTimeout(() => {
        wordleTurnTimerBar.classList.remove("show");
        if (gmWordleTurnTimerBar) gmWordleTurnTimerBar.classList.remove("show");
      }, 600);
    }
  }
  requestAnimationFrame(tick);
});

// Winner record — feeds into the eyebrow text during results phase
onValue(wordleWinnerRef, snap => {
  wordleWinnerLocal = snap.val() || null;
  paintWordleEyebrow();
});

/* ── GATES ── */
onValue(triviaModeRef, snap => { snap.val()===true ? startTrivia() : stopTrivia(); });
onValue(pollsModeRef,  snap => { snap.val()===true ? startPolls()  : stopPolls();  });

/* ── SKRIBBL HINT DISPLAY ── */
function renderHint(hint) {
  renderHintInto(skribblHintDisplay, hint);
  renderHintInto(gmSkribblHint, hint);
  // Keep the cam-mode .show class behavior (reveals the underline display)
  if (skribblHintDisplay) {
    if (!hint || !Array.isArray(hint)) skribblHintDisplay.classList.remove("show");
    else skribblHintDisplay.classList.add("show");
  }
}
function renderHintInto(target, hint) {
  if (!target) return;
  target.innerHTML = "";
  if (!hint || !Array.isArray(hint)) return;

  // Split into word groups by space entries
  let groups = [], current = [];
  hint.forEach(h => {
    if (h.letter === " ") { groups.push(current); current = []; }
    else current.push(h);
  });
  groups.push(current);

  groups.forEach((group, gi) => {
    if (!group.length) return;
    const wordDiv = document.createElement("div");
    wordDiv.className = "hint-word";
    group.forEach(({ letter, revealed }) => {
      const cell = document.createElement("div");
      cell.className = "hint-letter" + (revealed ? " revealed" : "");
      cell.textContent = revealed && letter ? letter.toUpperCase() : "";
      wordDiv.appendChild(cell);
    });
    target.appendChild(wordDiv);
    // Add spacer between words
    if (gi < groups.length - 1) {
      const spacer = document.createElement("div");
      spacer.className = "hint-word-spacer";
      target.appendChild(spacer);
    }
  });
}

onValue(skribblHintRef, snap => {
  if (!skribblOn) return;
  renderHint(snap.val());
});

/* ── SLOT MACHINE NAME FLIP ── */
function flipName(newName) {
  const existing = nameWindow.querySelector(".current");
  if (!newName) {
    if (existing) {
      existing.classList.remove("current");
      existing.classList.add("exit-up");
      setTimeout(() => existing.remove(), 500);
    }
    setTimeout(() => liveNameSlot.classList.remove("show"), 300);
    return;
  }
  const incoming = document.createElement("div");
  incoming.className = "name-label enter-from-below";
  incoming.innerHTML = `<span class="name-dot"></span>${newName}`;
  nameWindow.appendChild(incoming);
  liveNameSlot.classList.add("show");
  incoming.offsetHeight; // force reflow so enter-from-below is applied
  if (existing) {
    existing.classList.remove("current");
    existing.classList.add("exit-up");
    setTimeout(() => existing.remove(), 500);
  }
  incoming.classList.remove("enter-from-below");
  incoming.classList.add("current");
}

/* ── ACTIVE USER ── */
onValue(activeUserRef, snap => {
  activeUser = snap.val();
  livePip.classList.toggle("show", !!activeUser);

  if (!activeUser) {
    // No one live — stop stream, show empty state
    stopStream();
    flipName(null);
    return;
  }

  // Reset timers so bad-connection check doesn't immediately fire on switch
  lastFrame     = performance.now();
  lastHeartbeat = performance.now();

  // Load name for slot machine flip
  onValue(ref(db, `participants/${activeUser}/name`), snap => {
    flipName(snap.val() || null);
  }, { onlyOnce: true });

  // Hide empty state immediately; the frame listener will show the feed
  // as soon as a frame arrives — no timing gap, no flicker
  hideEmpty();
  ensureStream();
});

/* ── BAD CONNECTION ── */
// Use heartbeat (not frame time) so pixel diff skipping doesn't false-trigger.
// Heartbeat fires every 3s from the phone; 8s timeout gives 2+ missed beats before alarm.
const HB_TIMEOUT_MS = 8000;
setInterval(() => {
  if (!activeUser || !streamOn) return;
  const stale = lastHeartbeat > 0 && performance.now() - lastHeartbeat > HB_TIMEOUT_MS;
  if (stale) { hideFeed(); showBad(); }
  else        { showFeed(); hideBad(); }
}, 500);

/* ── VISIBILITY ──
 * Pause/resume the live image stream on tab visibility (real bandwidth saver).
 * Do NOT tear down trivia/polls listeners — those are tiny JSON listeners and the
 * teardown was asymmetric (no restore on show), making them vanish until a refresh.
 */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopStream(); }
  else if (activeUser) { ensureStream(); }
});
</script>
