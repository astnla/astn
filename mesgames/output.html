<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>LIVE FEED</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:  #DA1A32;
      --navy: #ff6600;
      --card: rgba(17, 17, 17, 0.82);
      --muted: rgba(255,255,255,0.55);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: "DM Sans", sans-serif;
  color: #fff;
  background: #ff0033;
  animation: bgShift 30s linear infinite;
}

@keyframes bgShift {
  0%   { background-color: #ff0033; }  /* red */
  16%  { background-color: #ff6600; }  /* orange */
  32%  { background-color: #fff700; }  /* yellow */
  48%  { background-color: #33ff9c; }  /* green */
  64%  { background-color: #3341ff; }  /* blue */
  80%  { background-color: #ff00f7; }  /* pink */

  /* 👇 smooth transition BACK to red */
  100% { background-color: #ff0033; }
}

    /* ── SCENE ── */
    .scene {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Stage wraps lb panel + column + draw panel side by side */
    .stage {
      display: flex;
      align-items: stretch; /* lb panel stretches to match feed column height */
      max-height: 100vh;
    }

    /* ─── MANATEE GAMES MODE — Phase 1 ─── */
    /* Empty state: centered wordmark replaces the cam UI when game mode is on.
       The activity container is sketched out but currently unused — Phase 2
       will move activity panels into it. */
    #gamesStage {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: clamp(10px, 1.5vh, 20px); /* matches cam header→feed gap */
      padding: clamp(20px, 4vh, 48px);
      pointer-events: none;
    }
    body.game-mode #gamesStage {
      display: flex;
      pointer-events: auto;
    }

    /* Hide all Manatee Cam UI when in game mode */
    body.game-mode .header,
    body.game-mode #feedWrap,
    body.game-mode .column,
    body.game-mode #lbPanel,
    body.game-mode #drawPanel,
    body.game-mode #wordlePanel,
    body.game-mode #infoPanel {
      display: none !important;
    }

    /* Wordmark: matches the cam header's sizing exactly so it feels like the
       same brand mark, just centered when no activity is up and slides into a
       header-row position above the activity container when one opens. */
    #gamesWordmark {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1vh, 14px);
      flex-shrink: 0;
    }
    #gamesWordmark .header-accent {
      width: 3px;
      height: clamp(22px, 3vh, 36px);
      background: var(--red);
      border-radius: 2px;
      flex-shrink: 0;
    }
    #gamesWordmark img {
      width: clamp(30px, 4vh, 48px);
      height: clamp(30px, 4vh, 48px);
      object-fit: contain;
      border-radius: 8px;
    }
    #gamesWordmark .header-title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: clamp(18px, 2.4vh, 32px);
      color: white;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
    }

    /* Activity container — Phase 2: grows from center when an activity opens.
       Width is content-driven (auto) with sensible min/max bounds. The container
       fits its content rather than forcing content into a fixed shape. */
    #gamesActivityContainer {
      width: auto;
      min-width: clamp(320px, 40vw, 600px);
      max-width: calc(100vw - 80px);
      /* Reservation accounts for wordmark + page padding above/below, NOT for
         what's inside the container (eyebrow + grid + keyboard count toward the
         container's natural height, not its cap). Smaller values = container
         can grow taller. ◄── tune this clamp if container is too tall/short */
      max-height: calc(100vh - clamp(80px, 12vh, 160px));
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: clamp(10px, 1.2vh, 16px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
      transform: scaleY(0);
      transform-origin: center center;
      opacity: 0;
      transition:
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        opacity   0.4s ease,
        width     0.4s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      pointer-events: none;
      flex-shrink: 0;
    }
    body.game-mode.activity-open #gamesActivityContainer {
      transform: scaleY(1);
      opacity: 1;
      pointer-events: auto;
    }
    /* Trivia uses a FIXED container width so the container shape is stable
       regardless of answer length — short answers don't shrink it, long
       answers don't widen it. Only height changes as text wraps to more or
       fewer lines. ◄── tune this clamp to taste */
    body.activity-game-trivia #gamesActivityContainer {
      width: clamp(360px, 42vw, 600px);
      min-width: clamp(360px, 42vw, 600px);
      max-width: clamp(360px, 42vw, 600px);
    }
    #gamesActivityInner {
      padding: clamp(22px, 3.4vh, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      /* No max-height / overflow on inner — let it size naturally to its content.
         The container's max-height is the only height cap; if content somehow
         exceeds it, the cell-sizing algorithm should have shrunk cells first. */
    }

    /* ─── Per-game content templates inside the games container ───
       These are uniform "card" surfaces — no per-game chrome. The outer
       container is the only frame; content inside just describes its game.

       Each card uses the grid-template-rows trick: a 1-row grid that
       animates from 0fr to 1fr lets the card smoothly grow/shrink to its
       natural content height. Without this, cards appearing/disappearing
       would cause the parent container to snap-resize when content changes. */
    .gm-card {
      width: 100%;
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition:
        grid-template-rows 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity            0.35s ease,
        margin             0.45s cubic-bezier(0.22, 1, 0.36, 1);
      margin: 0;
    }
    .gm-card.show {
      grid-template-rows: 1fr;
      opacity: 1;
    }
    .gm-card-inner {
      min-height: 0; /* required for grid-template-rows: 0fr to actually collapse */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      gap: clamp(8px, 1.2vh, 16px);
    }
    .gm-eyebrow {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.3vh, 15px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      transition: opacity 0.22s ease;
    }
    .gm-body {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      color: white;
      font-size: clamp(22px, 3.6vh, 42px);
      line-height: 1.25;
      letter-spacing: 0.02em;
      transition: opacity 0.22s ease;
      /* Long single tokens (URLs, no-space text) should wrap rather than
         overflow horizontally. Width is capped per-game-mode via card-scoped
         rules below — trivia is the main case where long answers need to
         wrap to keep the container readable. */
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .gm-divider {
      height: 1px;
      width: 60%;
      background: rgba(255, 255, 255, 0.15);
      margin: clamp(10px, 1.6vh, 20px) 0;
      align-self: center;
    }
    /* Polls bars inside the games container — same .bar-* classes are reused
       from cam mode; we just add some vertical rhythm between rows here */
    #gmPollsBarsContainer {
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.4vh, 18px);
      width: 100%;
      padding-top: clamp(8px, 1.2vh, 14px);
    }
    /* The gm-card-inner has text-align: center which bleeds into the .bar-label's
       flex:1 span, making it look centered. Force left/right inside gm context. */
    #gmPollsBarsContainer .bar-label { text-align: left; }
    #gmPollsBarsContainer .bar-pct   { text-align: right; }

    /* ─── WORDLE in game mode ───
       The gm-wordle card is a single .gm-card-inner that holds the eyebrow,
       grid, and keyboard together. The eyebrow doubles as turn-name during
       playing phase and as win/loss reveal during results phase, with a thin
       timer bar pinned to its bottom edge so opacity-only show/hide doesn't
       reflow the grid below. */
    #gmWordleEyebrow {
      position: relative;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.3vh, 15px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 0.8vh, 10px);
      min-height: clamp(16px, 2vh, 22px);
      width: 100%;
    }
    #gmWordleEyebrowLabel { letter-spacing: 0.18em; transition: opacity 0.3s ease; }
    #gmWordleEyebrowGuesser {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.85);
      text-transform: none;
      font-size: clamp(10px, 1.2vh, 14px);
      transition: opacity 0.3s ease;
    }
    /* Results phase — message takes the whole row */
    #gmWordleEyebrow.results #gmWordleEyebrowLabel { display: none; }
    #gmWordleEyebrow.results #gmWordleEyebrowGuesser {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      text-align: center;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #gmWordleEyebrowGuesser.win  { color: #b9e6a3; font-weight: 900; letter-spacing: 0.04em; }
    #gmWordleEyebrowGuesser.lose { color: #ff9eaa; font-weight: 900; letter-spacing: 0.04em; }
    /* Timer bar pinned to the bottom of the eyebrow */
    #gmWordleTurnTimerBar {
      position: absolute;
      left: 0; right: 0; bottom: -6px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #gmWordleTurnTimerBar.show { opacity: 1; }
    #gmWordleTurnTimerFill {
      height: 100%;
      width: 100%;
      background: white;
      border-radius: 99px;
      transition: width 1s linear, background 0.4s ease;
    }
    /* The keyboard text is centered by .gm-card-inner's text-align — but we
       want letters in keys to be normally centered (already are via flexbox)
       and not affected. No override needed since key contents are flex-centered. */
    @keyframes gmFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* ─── SKRIBBL in game mode ───
       Single card: eyebrow + canvas (3:4) + hint + leaderboard. Same eyebrow
       pattern as wordle (label + dynamic text + pinned timer bar). The canvas
       scales with viewport min so 3:4 fits comfortably without forcing tall
       containers. Leaderboard is a compact list below. */
    #gmSkribblEyebrow {
      position: relative;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.3vh, 15px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 0.8vh, 10px);
      min-height: clamp(16px, 2vh, 22px);
      width: 100%;
    }
    #gmSkribblEyebrowLabel { letter-spacing: 0.18em; transition: opacity 0.3s ease; }
    #gmSkribblEyebrowText {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.85);
      text-transform: none;
      font-size: clamp(10px, 1.2vh, 14px);
      transition: opacity 0.3s ease;
    }
    /* Win state — the message takes the whole row, label hides */
    #gmSkribblEyebrow.win #gmSkribblEyebrowLabel,
    #gmSkribblEyebrow.results #gmSkribblEyebrowLabel { display: none; }
    #gmSkribblEyebrow.win #gmSkribblEyebrowText,
    #gmSkribblEyebrow.results #gmSkribblEyebrowText {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      text-align: center;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #gmSkribblEyebrow.win #gmSkribblEyebrowText {
      color: #b9e6a3;
      font-weight: 900;
    }
    #gmSkribblEyebrow.results #gmSkribblEyebrowText {
      color: rgba(255, 255, 255, 0.95);
      font-weight: 900;
    }
    /* Timer bar — same pattern as wordle, pinned to eyebrow bottom */
    #gmSkribblTimerBar {
      position: absolute;
      left: 0; right: 0; bottom: -6px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #gmSkribblTimerBar.show { opacity: 1; }
    #gmSkribblTimerFill {
      height: 100%;
      width: 100%;
      background: white;
      border-radius: 99px;
      transition: width 1s linear, background 0.4s ease;
    }

    /* Canvas wrap — 3:4 aspect locked. Width scales with viewport min so the
       canvas fits naturally on 1080p AND 4K without forcing a giant container.
       Background white because the drawing canvas itself uses white BG. */
    #gmSkribblCanvasWrap {
      width: clamp(220px, 38vmin, 460px);
      aspect-ratio: 3 / 4;
      background: white;
      border-radius: clamp(8px, 1vh, 14px);
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      align-self: center; /* override parent's align-items:stretch */
    }
    #gmSkribblLiveImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Hint — masked word as a row of letter cells (matches cam-mode hint look) */
    #gmSkribblHint {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(8px, 1.2vh, 16px);
      justify-content: center;
      width: 100%;
      min-height: 0;
    }
    /* Inner .hint-word + .hint-letter classes are reused from cam mode (the
       renderHint() function creates them). Keep them styled consistently. */

    /* Leaderboard — compact list of correct guessers in order */
    #gmSkribblLb {
      width: 100%;
      max-width: clamp(280px, 45vmin, 480px);
      align-self: center;
    }
    #gmSkribblLbRows {
      display: flex;
      flex-direction: column;
      gap: clamp(5px, 0.8vh, 9px);
    }
    #gmSkribblLb .lb-row {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1vh, 14px);
      padding: clamp(6px, 0.9vh, 10px) clamp(10px, 1.4vh, 14px);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      font-family: "Barlow Condensed", sans-serif;
      animation: fadeUp 0.4s ease both;
    }
    #gmSkribblLb .lb-medal {
      font-size: clamp(14px, 1.8vh, 20px);
      font-weight: 900;
      flex-shrink: 0;
      min-width: clamp(20px, 2.4vh, 28px);
    }
    #gmSkribblLb .lb-name {
      font-weight: 700;
      font-size: clamp(13px, 1.7vh, 19px);
      color: white;
      letter-spacing: 0.02em;
      text-align: left;
      flex: 1;
    }
    #gmSkribblLb-empty {
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(11px, 1.3vh, 15px);
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      padding: clamp(8px, 1.2vh, 14px) 0;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Vertical rhythm in skribbl card — same gap as wordle */
    #gmSkribbl .gm-card-inner {
      gap: clamp(14px, 2vh, 22px);
    }
    /* Make gmSkribbl a positioning context for the floating guess layer */
    #gmSkribbl {
      position: relative;
    }
    /* Floating guess layer for game mode — same behavior as cam-mode
       #skribblGuessLayer but anchored to the gm card. Position:absolute over
       the entire card so guesses rise from bottom across the canvas. */
    #gmSkribblGuessLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    /* ─── DRAWING in game mode ───
       Single card with two content modes:
       - .mode-prompt: shows the prompt text + timer (active round)
       - .mode-reveal: shows a 3:4 white card with a submission image
       Both modes share the eyebrow. Only one content block visible at a time. */
    #gmDrawingEyebrow {
      position: relative;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.3vh, 15px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 0.8vh, 10px);
      min-height: clamp(16px, 2vh, 22px);
      width: 100%;
    }
    #gmDrawingEyebrowLabel { letter-spacing: 0.18em; transition: opacity 0.3s ease; }
    #gmDrawingEyebrowText {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.85);
      text-transform: none;
      font-size: clamp(10px, 1.2vh, 14px);
      transition: opacity 0.3s ease;
    }
    /* Reveal state — the artist's name takes the full row, "DRAWING" hides */
    #gmDrawing.mode-reveal #gmDrawingEyebrowLabel { display: none; }
    #gmDrawing.mode-reveal #gmDrawingEyebrowText {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      text-align: center;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 900;
      text-transform: uppercase;
      font-size: clamp(11px, 1.3vh, 15px);
    }
    /* Prompt state — eyebrow becomes a single centered label (matches trivia
       look). Drop the flex layout, hide the empty text span, just center "DRAW". */
    #gmDrawing.mode-prompt #gmDrawingEyebrow {
      display: block;
      text-align: center;
    }
    #gmDrawing.mode-prompt #gmDrawingEyebrowText { display: none; }
    #gmDrawing.mode-prompt #gmDrawingEyebrowLabel {
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.55);
    }
    /* Timer bar — same pattern as wordle/skribbl, pinned to eyebrow bottom */
    #gmDrawingTimerBar {
      position: absolute;
      left: 0; right: 0; bottom: -6px;
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #gmDrawingTimerBar.show { opacity: 1; }
    #gmDrawingTimerFill {
      height: 100%;
      width: 100%;
      background: white;
      border-radius: 99px;
      transition: width 1s linear, background 0.4s ease;
    }

    /* Prompt text — only visible during active round */
    #gmDrawingPromptText {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 3.6vh, 42px);
      line-height: 1.25;
      letter-spacing: 0.02em;
      color: white;
      text-align: center;
      width: 100%;
      padding: clamp(10px, 1.6vh, 20px) clamp(14px, 2vh, 24px);
      display: none;
    }
    #gmDrawing.mode-prompt #gmDrawingPromptText { display: block; }

    /* Image wrap — only visible during reveal phase. 3:4 aspect, white bg,
       submission image fits via object-fit:contain (drawings can be any aspect). */
    #gmDrawingImageWrap {
      width: clamp(220px, 38vmin, 460px);
      aspect-ratio: 3 / 4;
      background: white;
      border-radius: clamp(8px, 1vh, 14px);
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      align-self: center;
      display: none;
    }
    #gmDrawing.mode-reveal #gmDrawingImageWrap { display: block; }
    #gmDrawingImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.35s ease;
    }

    /* Vertical rhythm in drawing card */
    #gmDrawing .gm-card-inner {
      gap: clamp(14px, 2vh, 22px);
    }

    /* ── COLUMN — feed side ── */
    .column {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      align-self: flex-start; /* don't stretch — keep its own intrinsic height */
      width: min(56vh, calc(100vw - clamp(48px, 8vw, 160px)));
      max-height: 100vh;
      padding: clamp(14px, 2.5vh, 40px) 0;
      flex-shrink: 1;
      min-width: 0;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stage.draw-open .column {
      transform: translateX(calc(-1 * clamp(16px, 2vw, 36px)));
    }

    /* ── LEADERBOARD SIDE PANEL (slides in from LEFT) ── */
    #lbPanel {
      order: -1;
      flex-shrink: 0;
      align-self: stretch; /* match the stage height — same as column's natural height */
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2.5vh, 40px) 0 clamp(14px, 2.5vh, 40px);
      /* Width and gap both animate from 0 → target so it takes no layout space when hidden */
      width: 0;
      margin-right: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition:
        width        0.5s cubic-bezier(0.22, 1, 0.36, 1),
        margin-right 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity      0.4s ease;
    }
    #lbPanel.show {
      width: clamp(160px, 22vh, 300px);
      margin-right: clamp(100px, 1.8vw, 28px);
      overflow: visible;
      opacity: 1;
      pointer-events: auto;
      height: auto;
      margin-bottom: 3.6vh;
    }

    /* Invisible header clone — aligns card top with feed top */
    #lbPanelSpacer {
      visibility: hidden;
      pointer-events: none;
      flex-shrink: 0;
      height: calc(clamp(30px, 4vh, 48px) + clamp(10px, 1.5vh, 20px));
    }

    /* Card stretches to fill the panel — same TOTAL height as the camera column */
    #lbPanelCard {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: clamp(10px, 1.2vh, 16px);
      width: 100%;
      flex: 1;
      min-height: 0;
      box-shadow: 0 12px 48px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: clamp(10px, 1.3vh, 18px) clamp(10px, 1.2vh, 16px);
      gap: clamp(6px, 0.8vh, 10px);
    }

    #lbPanelTitle {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.4vh, 16px);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
    }

    #lbPanelRows {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.55vh, 8px);
      flex: 1;
      overflow: hidden; /* don't overflow the card */
    }

    .lb-panel-row {
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.8vh, 10px);
      padding: clamp(6px, 0.8vh, 11px) clamp(8px, 1vh, 12px);
      border-radius: clamp(6px, 0.7vh, 10px);
      background: rgba(84,209,138,0.12);
      border: 1px solid rgba(84,209,138,0.25);
      flex-shrink: 0;
      animation: lbRowIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes lbRowIn {
      from { opacity:0; transform:translateX(-14px); }
      to   { opacity:1; transform:none; }
    }
    .lb-panel-medal {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(14px, 1.8vh, 22px);
      flex-shrink: 0;
      line-height: 1;
      min-width: 1.5em;
      text-align: center;
    }
    .lb-panel-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(12px, 1.6vh, 20px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    #lbPanelEmpty {
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(11px, 1.3vh, 15px);
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: clamp(8px, 1vh, 14px) 0;
      flex-shrink: 0;
    }

    /* ── DRAWING SIDE PANEL ── */
    #drawPanel {
      flex-shrink: 1;
      align-self: flex-start; /* keep its own intrinsic height */
      min-width: 0;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2.5vh, 40px) 0 clamp(14px, 2.5vh, 40px);
      /* Gap between camera column and drawing panel */
      margin-left: clamp(12px, 1.8vw, 28px);
      transform: translateX(calc(100% + clamp(12px, 1.8vw, 28px)));
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity   0.4s ease;
      width: 0;
      overflow: hidden;
    }
    #drawPanel.show {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      width: min(56vh, calc(100vw - clamp(48px, 8vw, 160px)));
      max-width: calc(100vw - min(56vh, calc(100vw - clamp(48px, 8vw, 160px))) - clamp(16px, 2vw, 36px) - clamp(28px, 4vw, 60px));
      overflow: visible;
    }

    /* ─── WORDLE PANEL ─── slides in from right, mirrors drawPanel structure */
    #wordlePanel {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-self: stretch;
      margin-left: clamp(12px, 1.8vw, 28px);
      transform: translateX(calc(100% + clamp(12px, 1.8vw, 28px)));
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity   0.4s ease,
        width     0.5s cubic-bezier(0.22, 1, 0.36, 1),
        margin-left 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      width: 0;
      overflow: hidden;
    }
    #wordlePanel.show {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      width: min(46vh, calc(100vw - clamp(48px, 8vw, 160px)));
      max-width: calc(100vw - min(46vh, calc(100vw - clamp(48px, 8vw, 160px))) - clamp(16px, 2vw, 36px) - clamp(28px, 4vw, 60px));
      overflow: visible;
    }
    /* While hiding, collapse the left margin so the panel slides AWAY rather than
       leaving a phantom gap next to the cam (matches drawPanel feel) */
    #wordlePanel:not(.show) { margin-left: 0; }
    #wordlePanelCard {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: clamp(10px, 1.2vh, 16px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: clamp(10px, 1.4vh, 20px);
      gap: clamp(10px, 1.4vh, 18px);
    }
    #wordlePanelEyebrow {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.3vh, 15px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 0.8vh, 10px);
      min-height: clamp(16px, 2vh, 22px); /* reserve space so layout doesn't shift on results */
      position: relative; /* anchor for absolute-positioned result text */
    }
    #wordlePanelLabel { letter-spacing: 0.18em; transition: opacity 0.3s ease; }
    /* During results phase the result message floats ABSOLUTELY over the eyebrow
       row so it can be visually large without pushing the grid container shorter.
       Layout dimensions stay fixed across phases — only the visual changes. */
    #wordlePanelEyebrow.results #wordlePanelLabel { display: none; }
    #wordlePanelEyebrow.results #wordlePanelGuesser {
      position: absolute;
      left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      text-align: center;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #wordlePanelGuesser {
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.85);
      text-transform: none;
      font-size: clamp(10px, 1.2vh, 14px);
      transition: opacity 0.3s ease;
    }
    /* Turn timer bar — pinned to the bottom of the eyebrow row so its
       show/hide doesn't reflow the grid container below. The eyebrow already
       has position:relative as the result-text anchor, so we can absolute-
       position the bar against it without adding extra wrapper markup. */
    #wordleTurnTimerBar {
      position: absolute;
      left: 0; right: 0; bottom: -6px; /* sits just below the eyebrow text */
      height: 3px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #wordleTurnTimerBar.show { opacity: 1; }
    #wordleTurnTimerFill {
      height: 100%;
      width: 100%;
      background: white;
      border-radius: 99px;
      transition: width 1s linear, background 0.4s ease;
    }
    /* Eyebrow result text — uses the existing #wordlePanelGuesser slot during
       results phase to announce winner / no-winner, replacing the banner. */
    #wordlePanelGuesser.win {
      color: #b9e6a3;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    #wordlePanelGuesser.lose {
      color: #ff9eaa;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #wordleGrid,
    #gmWordleGrid {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.6vh, 8px);
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      align-items: center;
      justify-content: center;
    }
    /* Game-mode grid: keeps the same flex column layout as cam mode. No
       min-height — let the natural cell-size × row-count math drive the grid's
       height, which in turn drives the container's height. Horizontal/vertical
       padding gives the grid breathing room from the eyebrow + keyboard. */
    #gmWordleGrid {
      padding: clamp(8px, 1.2vh, 14px) clamp(12px, 1.8vh, 22px);
      box-sizing: border-box;
      /* Content-driven height — overrides the flex:1 1 0 from cam mode so the
         grid's height = rows × cellSize + gaps + padding. The container then
         shrinkwraps around that. Without this, the grid would either stretch
         to fill or collapse to 0 in the auto-sized container. */
      flex: 0 0 auto;
    }
    /* Vertical rhythm between eyebrow → grid → keyboard inside gm-wordle */
    #gmWordle .gm-card-inner {
      gap: clamp(14px, 2vh, 22px);
    }
    .wordle-row {
      display: grid;
      gap: clamp(4px, 0.6vh, 8px);
      flex: 0 0 auto;
      /* Row height equals the cell size — JS computes this on render based on
         actual container dimensions so it adapts to any (rows × cols) config */
      height: var(--wordle-out-cell, 48px);
      transition: height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .wordle-cell {
      width:  var(--wordle-out-cell, 48px);
      height: var(--wordle-out-cell, 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      /* Letter font scales with cell size */
      font-size: calc(var(--wordle-out-cell, 48px) * 0.62);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      background: transparent;
      text-transform: uppercase;
      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease,
        width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.4s cubic-bezier(0.22, 1, 0.36, 1),
        font-size 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* Cell states — used in Phase 2 onward */
    .wordle-cell.filled  { border-color: rgba(255, 255, 255, 0.5); }
    .wordle-cell.correct { background: #538d4e; border-color: #538d4e; }
    .wordle-cell.present { background: #b59f3b; border-color: #b59f3b; }
    .wordle-cell.absent  { background: #3a3a3c; border-color: #3a3a3c; }
    /* Cell flip animation when a row is evaluated */
    @keyframes wordleFlip {
      0%   { transform: rotateX(0deg); }
      50%  { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }
    .wordle-cell.flipping { animation: wordleFlip 0.5s ease-in-out; }

    /* On-screen keyboard — visual only on output, reflects accumulated letter states */
    #wordleKeyboard,
    #gmWordleKeyboard {
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.5vh, 6px);
      width: 100%;
      align-items: center;
    }
    .wordle-kb-row {
      display: flex;
      gap: clamp(3px, 0.5vh, 6px);
      justify-content: center;
      width: 100%;
    }
    .wordle-key {
      flex: 1;
      max-width: clamp(20px, 3.5vh, 40px);
      aspect-ratio: 2 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.6vh, 18px);
      color: white;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      text-transform: uppercase;
      transition: background 0.5s ease, color 0.5s ease;
    }
    .wordle-key.correct { background: #538d4e; }
    .wordle-key.present { background: #b59f3b; }
    .wordle-key.absent  { background: #3a3a3c; }
    /* Game mode reuses the same keyboard sizing as cam mode — small enough
       that it doesn't dominate the focal grid above it. */

    /* Drawing panel card */
    #drawPanelCard {
      position: relative; /* anchor for #skribblGuessLayer */
      background: rgba(255,255,255,0.95);
      border-radius: clamp(10px, 1.2vh, 16px);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 4;
      box-shadow: 0 12px 48px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }
    /* Eyebrow row: label on left, countdown timer on right */
    #drawPanelEyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 0.8vh, 10px);
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.4vh, 16px);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--red);
      padding: clamp(8px, 1vh, 14px) clamp(10px, 1.2vh, 16px) clamp(4px, 0.5vh, 8px);
      flex-shrink: 0;
    }
    #drawPanelTimer {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(11px, 1.4vh, 16px);
      letter-spacing: 1px;
      color: var(--red);
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #drawPanelTimer.show { opacity: 1; }
    #drawPanelTimer.urgent { color: #cc0000; }
    #drawPanelImg {
      width: 100%;
      flex: 1;
      object-fit: contain;
      display: block;
      background: white;
      transition: opacity 0.35s ease;
    }

    /* ── SKRIBBL HINT UNDERSCORES (below drawing panel) ── */
    #skribblHintDisplay {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(6px, 0.8vh, 10px);
      padding: clamp(6px, 1vh, 12px) 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #skribblHintDisplay.show { opacity: 1; }

    .hint-word {
      display: flex;
      gap: clamp(3px, 0.4vh, 5px);
      align-items: flex-end;
    }
    .hint-letter {
      width: clamp(16px, 2.2vh, 28px);
      height: clamp(20px, 2.8vh, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2.5px solid white;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(14px, 1.9vh, 24px);
      color: white;
      text-transform: uppercase;
    }
    .hint-letter.revealed {
      color: white;
      border-bottom-color: white;
    }
    .hint-word-spacer {
      width: clamp(8px, 1.2vh, 16px);
    }

    /* ── HEADER ── */
    .header {
        font-family: 'Krona One', sans-serif;

      display: flex;
      align-items: center;
      gap: clamp(8px, 1vh, 14px);
      margin-bottom: clamp(10px, 1.5vh, 20px);
      flex-shrink: 0;
    }
    .header-accent {
      width: 3px;
      height: clamp(22px, 3vh, 36px);
      background: var(--red);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .header img {
      width: clamp(30px, 4vh, 48px);
      height: clamp(30px, 4vh, 48px);
      object-fit: contain;
      border-radius: 8px;
    }
    .header-title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: clamp(18px, 2.4vh, 32px);
      color: white;
    }

    /* ── HEADER TITLE fills available space ── */
    .header-title { flex: 1; }

    /* ── LIVE NAME SLOT (right side of header) ── */
    #liveNameSlot {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.8vh, 10px);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #liveNameSlot.show { opacity: 1; }

    .name-dot {
      display: inline-block;
      width: clamp(6px, 0.8vh, 9px);
      height: clamp(6px, 0.8vh, 9px);
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      margin-right: clamp(5px, 0.6vh, 8px);
      vertical-align: middle;
      animation: livePulse 1s ease-in-out infinite;
    }

    /* Clip window — one name visible at a time.
       Uses overflow:hidden for the slot machine clip.
       Labels stack vertically via translateY so the window
       only needs to be tall enough for one line. Width is
       driven by the label content naturally. */
    .name-window {
      height: clamp(18px, 2.4vh, 30px);
      overflow: hidden;
      position: relative;
      max-width: clamp(140px, 22vw, 340px);
      /* Flex column so labels stack — only visible one shows through clip */
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .name-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(14px, 1.9vh, 26px);
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
      line-height: 1;
      flex-shrink: 0;
      text-align: right;
    }

    .name-label.current {
      transform: translateY(0);
      opacity: 1;
      transition:
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity   0.4s ease;
    }
    .name-label.exit-up {
      transform: translateY(-120%);
      opacity: 0;
      transition:
        transform 0.45s cubic-bezier(0.55, 0, 0.45, 1),
        opacity   0.3s ease;
    }
    .name-label.enter-from-below {
      transform: translateY(120%);
      opacity: 0;
      transition: none;
    }

    /* ── FEED ── */
    #feedWrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: clamp(10px, 1.2vh, 16px);
      overflow: hidden;
      background: rgba(255,255,255,0.04);
      flex-shrink: 1;
      min-height: 0;
      /* isolation ensures absolute children fill correctly */
      isolation: isolate;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 12px 48px rgba(0,0,0,0.55);
    }

    #liveImage {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    #liveImage.visible {
      opacity: 1;
    }

    /* Drawing round timer — thin progress bar overlaid on the bottom edge of the feed.
       Visible only during a timed drawing round. Drains as time runs out. */
    #drawTimerOverlay {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #drawTimerOverlay.show { opacity: 1; }
    #drawTimerOverlayFill {
      height: 100%;
      background: white;
      width: 100%;
      transition: width 1s linear, background 0.4s ease;
    }

    /* LIVE pip */
    #livePip {
      position: absolute;
      top: 12px; right: 12px;
      display: flex;
      align-items: center; gap: 5px;
      background: var(--red);
      padding: clamp(3px,0.5vh,6px) clamp(7px,1vh,12px);
      border-radius: 5px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(10px, 1.4vh, 16px);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #livePip.show { opacity: 1; pointer-events: auto; }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%; background: white;
      animation: livePulse 1s ease-in-out infinite;
    }

    /* Empty state — starts visible, fades out when stream begins */
    #emptyState {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px;
      opacity: 0;                /* start invisible — revealed by JS after Firebase responds */
      transition: opacity 0.5s ease;
    }
    #emptyState.visible { opacity: 1; }
    #emptyState.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .empty-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(25px, 2vh, 50px);
      color: rgba(255,255,255,1);
      animation: breathe 2s ease-in-out infinite;
    }
    #qrImage {
      width: clamp(90px, 13vh, 170px);
      height: auto; margin: clamp(8px,1.2vh,18px) 0;
      animation: breathe 2s ease-in-out infinite;
    }
    /* Offline block — shown instead of QR when fan cam is off */
    #offlineBlock {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: clamp(6px, 0.8vh, 10px);
      text-shadow: 0px 2px 10px #000000;
    }
    #offlineBlock.show { display: flex; }
    #offlineBlock .off-icon {
      font-size: clamp(28px, 4vh, 48px);
      line-height: 1;
    }
    #offlineBlock .off-title {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(25px, 2vh, 30px);
      color: rgba(255,255,255,1);
    }
    #offlineBlock .off-msg {
      font-size: clamp(13px, 1.3vh, 15px);
      color: rgba(255, 255, 255, 1);
      line-height: 1.5;
    }

    /* Bad connection */
    #badOverlay {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(13px, 1.8vh, 22px);
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #badOverlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .bad-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      animation: breathe 0.9s ease-in-out infinite;
    }

    /* ── INFO PANEL ──
       Expands downward below the feed pushing it up.
       Uses max-height trick with a generous ceiling value. */
    #infoPanel {
      width: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 0.9vh, 12px);
      overflow: hidden;
      max-height: 0;
      margin-top: 0;
      /* Spring-style expand/collapse */
      transition:
        max-height   0.6s cubic-bezier(0.22, 1, 0.36, 1),
        margin-top   0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #infoPanel.has-content {
      max-height: 55vh;
      margin-top: clamp(8px, 1.2vh, 16px);
    }

    /* ── INFO CARDS ──
       Each card starts invisible + shifted down.
       Entrance: spring slide up + fade in.
       Exit:     ease-in slide down + fade out (applied via .hiding class). */
    .info-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: clamp(8px, 1vh, 14px);
      padding: clamp(12px, 1.6vh, 22px) clamp(14px, 1.8vh, 24px);
      display: none;
      /* Default hidden state */
      opacity: 0;
      transform: translateY(22px);
      /* Entrance timing — smooth spring */
      transition:
        opacity   0.5s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .info-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
    /* Exit state — applied briefly before display:none */
    .info-card.hiding {
      opacity: 0;
      transform: translateY(14px);
      transition:
        opacity   0.35s ease-in,
        transform 0.35s ease-in;
    }

    .card-eyebrow {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(9px, 1.1vh, 13px);
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: clamp(4px, 0.6vh, 8px);
    }
    .card-body {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(16px, 2.2vh, 30px);
      line-height: 1.15;
    }

    /* Poll bars */
    #pollBars {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 0.9vh, 12px);
      margin-top: clamp(6px, 0.9vh, 12px);
    }
    .bar-row { display: flex; flex-direction: column; gap: clamp(3px, 0.4vh, 5px); }
    .bar-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .bar-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(13px, 1.8vh, 22px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .bar-pct {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(13px, 1.8vh, 22px);
      color: var(--muted);
      flex-shrink: 0;
    }
    .bar-track {
      height: clamp(4px, 0.6vh, 8px);
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--red);
      border-radius: 99px;
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      width: 0%;
    }

    /* ── ANIMATIONS ── */
    @keyframes breathe   { 0%,100%{opacity:.4;} 50%{opacity:1;} }
    @keyframes livePulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(.4);opacity:.4;} }

    /* ── SKRIBBL — FLOATING GUESS REACTIONS ── */
    #skribblGuessLayer {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden;
      z-index: 10;
    }
    .floating-guess {
      position: absolute;
      /* JS sets --start-x, --end-x, --tilt, --drift-y, --rise */
      left: var(--start-x);
      bottom: -10%;
      transform: translate(-50%, 0) scale(0.4) rotate(0deg);
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      color: white;
      padding: clamp(8px, 1vh, 14px) clamp(14px, 1.5vh, 22px);
      border-radius: 99px;
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(14px, 1.7vh, 22px);
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-transform: uppercase;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      opacity: 0;
      animation:
        guessPopIn   0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
        guessDrift   5s    cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards,
        guessFadeOut 1.2s  ease-in 4.25s forwards;
    }
    .floating-guess .guess-name {
      display: inline-block;
      opacity: 0.55;
      font-weight: 700;
      margin-right: 0.4em;
    }
    .floating-guess .guess-text {
      display: inline-block;
      font-weight: 900;
      color: #fff;
    }
    /* Correct-guess styling kept in case it's ever re-enabled — but currently unused
       since correct guesses are filtered out of the float layer. */
    .floating-guess.correct {
      background: rgba(84, 209, 138, 0.92);
      color: #09180f;
      border-color: rgba(255, 255, 255, 0.4);
      font-size: clamp(16px, 2vh, 26px);
    }
    .floating-guess.correct .guess-name { opacity: 0.7; color: #09180f; }
    .floating-guess.correct .guess-text { color: #09180f; }

    /* Pop into existence with a slight overshoot — gives the bubble personality */
    @keyframes guessPopIn {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.4) rotate(0deg); }
      70%  { opacity: 1; transform: translate(-50%, -20px) scale(1.08) rotate(var(--tilt)); }
      100% { opacity: 1; transform: translate(-50%, -28px) scale(1) rotate(var(--tilt)); }
    }
    /* Drift diagonally upward toward the end-x position with a gentle vertical sway */
    @keyframes guessDrift {
      0%   { transform: translate(-50%, -28px) scale(1) rotate(var(--tilt)); }
      100% {
        left: var(--end-x);
        transform: translate(-50%, calc(-1 * var(--rise))) scale(1) rotate(calc(var(--tilt) * -0.5));
      }
    }
    /* Soft fade out near the end of the drift */
    @keyframes guessFadeOut {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Leaderboard card — lives in infoPanel like other cards */
    #skribblLbCard { display: none; }
    #skribblLbCard.show { display: block; }
    #skribblLbRows { display: flex; flex-direction: column; gap: clamp(5px,0.7vh,9px); margin-top: clamp(6px,0.9vh,12px); }
    .lb-row {
      display: flex; align-items: center; gap: clamp(8px,1vh,14px);
      padding: clamp(7px,1vh,13px) clamp(10px,1.2vh,16px);
      border-radius: clamp(6px,0.8vh,12px);
      background: rgba(84,209,138,0.12);
      border: 1px solid rgba(84,209,138,0.28);
      animation: lbSlide 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes lbSlide {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:none; }
    }
    .lb-medal {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(16px,2.2vh,28px);
      flex-shrink: 0;
      min-width: 1.5em;
      text-align: center;
    }
    .lb-name  {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(14px,1.9vh,26px);
      flex: 1;
    }

    /* Winner banner over feed — now just a brief flash, leaderboard is the main UI */
    #skribblWinnerOverlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      z-index: 8;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      flex-direction: column; gap: 8px; text-align: center; padding: 20px;
    }
    #skribblWinnerOverlay.show { opacity: 1; }
    #skribblWinnerOverlay .win-label {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 900;
      font-size: clamp(20px, 2.8vh, 36px);
      color: var(--good, #54d18a);
    }
    #skribblWinnerOverlay .win-name {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(14px, 1.8vh, 22px);
      color: rgba(255,255,255,0.8);
    }
  </style>
</head>
<body>
<!-- Skribbl audio cues — preloaded, played by phase/leaderboard/timer events -->
<audio id="sndStart"   src="assets/start.mp3"   preload="auto"></audio>
<audio id="sndTick"    src="assets/tick.mp3"    preload="auto"></audio>
<audio id="sndCorrect" src="assets/correct.mp3" preload="auto"></audio>
<audio id="sndEnd"     src="assets/end.mp3"     preload="auto"></audio>
<!-- Activity send cue — plays when teacher sends trivia / poll / drawing prompt -->
<audio id="sndSent"    src="assets/sent.mp3"    preload="auto"></audio>
<!-- Drawing round time-up cue -->
<audio id="sndTime"    src="assets/time.mp3"    preload="auto"></audio>
<div class="scene">
  <div class="stage" id="stage">
  <!-- ─── MANATEE GAMES STAGE ─── shown only when body.game-mode is set.
       Empty state: just the centered wordmark.
       Active state: wordmark slides up to make room for the activity container,
       which grows from a center horizontal line outward in both directions. -->
  <div id="gamesStage">
    <!-- The MANATEE GAMES wordmark — same visual treatment as the MANATEE CAM
         header, just bigger and centered. Slides up when an activity opens. -->
    <div id="gamesWordmark">
      <div class="header-accent"></div>
      <img src="assets/mestv.png" alt="MES TV">
      <div class="header-title">MANATEE GAMES</div>
    </div>
    <!-- Unified activity container. Sized to fit content. Grows from center
         (scaleY 0 → 1 with origin center) when an activity becomes active. -->
    <div id="gamesActivityContainer">
      <div id="gamesActivityInner">
        <!-- TRIVIA template — shown when trivia is active in game mode -->
        <div class="gm-card" id="gmTriviaQuestion">
          <div class="gm-card-inner">
            <div class="gm-eyebrow">QUESTION</div>
            <div class="gm-body" id="gmTriviaQuestionText"></div>
          </div>
        </div>
        <div class="gm-card" id="gmTriviaAnswer">
          <div class="gm-card-inner">
            <div class="gm-divider"></div>
            <div class="gm-eyebrow">ANSWER</div>
            <div class="gm-body" id="gmTriviaAnswerText"></div>
          </div>
        </div>
        <div class="gm-card" id="gmTriviaClass">
          <div class="gm-card-inner">
            <div class="gm-divider"></div>
            <div class="gm-eyebrow" id="gmTriviaClassEyebrow">ANSWER</div>
            <div class="gm-body" id="gmTriviaClassText"></div>
          </div>
        </div>
        <!-- POLLS template — same question pattern + horizontal vote bars -->
        <div class="gm-card" id="gmPollsQuestion">
          <div class="gm-card-inner">
            <div class="gm-eyebrow">POLL</div>
            <div class="gm-body" id="gmPollsQuestionText"></div>
          </div>
        </div>
        <div class="gm-card" id="gmPollsBars">
          <div class="gm-card-inner">
            <div class="gm-divider"></div>
            <div class="gm-eyebrow">LIVE RESULTS</div>
            <div id="gmPollsBarsContainer"></div>
          </div>
        </div>
        <!-- WORDLE template — eyebrow + grid + keyboard, all together as one card.
             Mirrors the cam-mode wordle panel content so the same listeners
             update both. The eyebrow doubles as turn-name / win-loss reveal,
             with a thin timer bar pinned to its bottom edge. -->
        <div class="gm-card" id="gmWordle">
          <div class="gm-card-inner">
            <div id="gmWordleEyebrow">
              <span id="gmWordleEyebrowLabel">WORDLE</span>
              <span id="gmWordleEyebrowGuesser"></span>
              <div id="gmWordleTurnTimerBar"><div id="gmWordleTurnTimerFill"></div></div>
            </div>
            <div id="gmWordleGrid"></div>
            <div id="gmWordleKeyboard"></div>
          </div>
        </div>
        <!-- SKRIBBL template — eyebrow + canvas + hint + leaderboard.
             The eyebrow holds the round timer and morphs through phases:
             playing → "ALICE IS DRAWING" + word hint
             win    → "🎉 ALICE GOT IT FIRST!"
             results→ "IT WAS [WORD]" with the full word revealed in the hint -->
        <div class="gm-card" id="gmSkribbl">
          <div class="gm-card-inner">
            <div id="gmSkribblEyebrow">
              <span id="gmSkribblEyebrowLabel">SKRIBBL</span>
              <span id="gmSkribblEyebrowText"></span>
              <div id="gmSkribblTimerBar"><div id="gmSkribblTimerFill"></div></div>
            </div>
            <div id="gmSkribblCanvasWrap">
              <img id="gmSkribblLiveImg" alt="live drawing" />
            </div>
            <div id="gmSkribblHint"></div>
            <div id="gmSkribblLb">
              <div id="gmSkribblLbRows"></div>
            </div>
          </div>
          <!-- Floating wrong-guesses bubble layer. Position:absolute over the
               whole gm-card so guesses rise across the canvas + leaderboard,
               same as cam mode rises across the drawing panel. -->
          <div id="gmSkribblGuessLayer"></div>
        </div>
        <!-- DRAWING template — eyebrow + prompt-or-image stack.
             Two content modes inside the same card:
             1. Active round: shows the prompt text + drawing timer bar
             2. Reveal phase: shows a single submission image with artist name
             The card transitions between modes via the .mode-prompt / .mode-reveal
             classes; only one inner content block is visible at a time. -->
        <div class="gm-card" id="gmDrawing">
          <div class="gm-card-inner">
            <div id="gmDrawingEyebrow">
              <span id="gmDrawingEyebrowLabel">DRAW</span>
              <span id="gmDrawingEyebrowText"></span>
              <div id="gmDrawingTimerBar"><div id="gmDrawingTimerFill"></div></div>
            </div>
            <!-- Active-round content: prompt text -->
            <div id="gmDrawingPromptText"></div>
            <!-- Reveal-phase content: white card with submission image -->
            <div id="gmDrawingImageWrap">
              <img id="gmDrawingImage" alt="student drawing" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaderboard panel — slides in from LEFT during skribbl -->
  <div id="lbPanel">
    <div id="lbPanelSpacer"></div>
    <div id="lbPanelCard">
      <div id="lbPanelTitle">🏆 LEADERBOARD</div>
      <div id="lbPanelRows">
        <div id="lbPanelEmpty">Waiting…</div>
      </div>
    </div>
  </div>

  <div class="column">

    <div class="header">
      <div class="header-accent"></div>
      <img src="assets/mestv.png" alt="MES TV">
      <div class="header-title">MANATEE CAM</div>
      <div id="liveNameSlot">
        <div class="name-window" id="nameWindow"></div>
      </div>
    </div>

    <div id="feedWrap">
      <img id="liveImage" alt="Live fan cam feed">
      <div id="emptyState">
        <!-- Online state -->
        <div id="onlineBlock">
          <div class="empty-label">SCAN TO JOIN</div>
          <img id="qrImage" src="assets/qr.png" alt="QR code">
          <div class="empty-label">MANATEE CAM</div>
        </div>
        <!-- Offline state -->
        <div id="offlineBlock">
          <div class="off-icon">😔</div>
          <div class="off-title">FAN CAM OFFLINE</div>
          <div class="off-msg">We'll be back later.</div>
        </div>
      </div>
      <div id="badOverlay">
        <div class="bad-dot"></div>
        <div>WEAK CONNECTION</div>
      </div>
      <div id="livePip">
        <span class="live-dot"></span>LIVE
      </div>
      <!-- Drawing round timer — thin bar at the bottom of the feed -->
      <div id="drawTimerOverlay">
        <div id="drawTimerOverlayFill"></div>
      </div>
      <!-- Winner overlay -->
      <div id="skribblWinnerOverlay">
        <div class="win-label">🎉 CORRECT!</div>
        <div class="win-name" id="skribblWinName"></div>
      </div>
    </div>

    <div id="infoPanel">
      <div class="info-card" id="questionCard">
        <div class="card-eyebrow" id="questionEyebrow">QUESTION</div>
        <div class="card-body"    id="questionText"></div>
      </div>
      <div class="info-card" id="pollCard">
        <div class="card-eyebrow">LIVE RESULTS</div>
        <div id="pollBars"></div>
      </div>
      <div class="info-card" id="answerCard">
        <div class="card-eyebrow">ANSWER</div>
        <div class="card-body" id="answerText"></div>
      </div>
      <div class="info-card" id="classCard">
        <div class="card-eyebrow" id="classEyebrow">ANSWER</div>
        <div class="card-body" id="classText"></div>
      </div>
      <!-- Skribbl leaderboard card (infoPanel version — kept for non-skribbl modes) -->
      <div class="info-card" id="skribblLbCard">
        <div class="card-eyebrow">🏆 LEADERBOARD</div>
        <div id="skribblLbRows"></div>
      </div>
    </div>

  </div>

  <!-- Drawing side panel — slides in from right (shared by draw reveal + skribbl live) -->
  <div id="drawPanel">
    <!-- Invisible header clone — keeps card top aligned with feed top at all viewport sizes -->
    <div class="header" aria-hidden="true" style="visibility:hidden;pointer-events:none;">
      <div class="header-accent"></div>
      <img src="assets/mestv.png" alt="">
      <div class="header-title">MANATEE CAM</div>
    </div>
    <div id="drawPanelCard">
      <div id="drawPanelEyebrow">
        <span id="drawPanelLabel">DRAWING</span>
        <span id="drawPanelTimer"></span>
      </div>
      <!-- Static reveal image (draw mode) -->
      <img id="drawPanelImg" alt="student drawing" style="display:none;">
      <!-- Live canvas stream (skribbl mode) -->
      <img id="skribblLiveImg" alt="live drawing" style="width:100%;flex:1;object-fit:contain;display:none;background:white;">
      <!-- Floating guesses layer — overlays the drawing so reactions show where eyes are -->
      <div id="skribblGuessLayer"></div>
    </div>
    <!-- Hint underscores — only visible during skribbl mode -->
    <div id="skribblHintDisplay"></div>
  </div>

  <!-- ─── WORDLE side panel ─── slides in from right when wordle mode is active.
       Phase 1: just an empty grid sized to word length × attempts. -->
  <div id="wordlePanel">
    <div class="header" aria-hidden="true" style="visibility:hidden;pointer-events:none;">
      <div class="header-accent"></div>
      <img src="assets/mestv.png" alt="">
      <div class="header-title">MANATEE CAM</div>
    </div>
    <div id="wordlePanelCard">
      <div id="wordlePanelEyebrow">
        <span id="wordlePanelLabel">WORDLE</span>
        <span id="wordlePanelGuesser"></span>
        <!-- Turn timer bar — pinned to the bottom edge of the eyebrow so its
             show/hide is opacity-only and doesn't reflow the grid below -->
        <div id="wordleTurnTimerBar"><div id="wordleTurnTimerFill"></div></div>
      </div>
      <div id="wordleGrid"></div>
      <div id="wordleKeyboard"></div>
    </div>
  </div>

  </div><!-- /stage -->
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, onValue, off } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const liveImage      = document.getElementById("liveImage");
const emptyState     = document.getElementById("emptyState");
const badOverlay     = document.getElementById("badOverlay");
const liveNameSlot   = document.getElementById("liveNameSlot");
const nameWindow     = document.getElementById("nameWindow");
const livePip        = document.getElementById("livePip");
const infoPanel      = document.getElementById("infoPanel");
const questionCard   = document.getElementById("questionCard");
const questionEyebrow= document.getElementById("questionEyebrow");
const questionText   = document.getElementById("questionText");
const pollCard       = document.getElementById("pollCard");
const pollBars       = document.getElementById("pollBars");
const answerCard     = document.getElementById("answerCard");
const answerText     = document.getElementById("answerText");
const classCard        = document.getElementById("classCard");
const classText        = document.getElementById("classText");
const classEyebrow     = document.getElementById("classEyebrow");
const gmTriviaClassEyebrow = document.getElementById("gmTriviaClassEyebrow");
const stage              = document.getElementById("stage");
const drawPanel          = document.getElementById("drawPanel");
const drawPanelEyebrow   = document.getElementById("drawPanelEyebrow");
const drawPanelLabel     = document.getElementById("drawPanelLabel");
const drawPanelTimer     = document.getElementById("drawPanelTimer");
const drawPanelImg       = document.getElementById("drawPanelImg");
const skribblLiveImg     = document.getElementById("skribblLiveImg");
const skribblGuessLayer  = document.getElementById("skribblGuessLayer");
const skribblWinnerOverlay = document.getElementById("skribblWinnerOverlay");
const skribblWinName     = document.getElementById("skribblWinName");
const skribblHintDisplay = document.getElementById("skribblHintDisplay");
const lbPanel            = document.getElementById("lbPanel");
const lbPanelRows        = document.getElementById("lbPanelRows");
const lbPanelEmpty       = document.getElementById("lbPanelEmpty");

/* ─── WORDLE elements ─── */
const wordlePanel         = document.getElementById("wordlePanel");
const wordleGrid          = document.getElementById("wordleGrid");
const wordleKeyboard      = document.getElementById("wordleKeyboard");
const wordlePanelEyebrow  = document.getElementById("wordlePanelEyebrow");
const wordlePanelGuesser  = document.getElementById("wordlePanelGuesser");
const wordleTurnTimerBar  = document.getElementById("wordleTurnTimerBar");
const wordleTurnTimerFill = document.getElementById("wordleTurnTimerFill");

const activeUserRef  = ref(db, "live/activeUser");
const frameRef       = ref(db, "live/frame");
const heartbeatRef   = ref(db, "live/heartbeat");
const fanCamOnRef    = ref(db, "meta/fanCamOn");
const gameModeRef    = ref(db, "meta/gameMode");

/* ─── MANATEE GAMES MODE — Phase 1 ───
 * When meta/gameMode is true, we hide all the cam UI (.header, #feedWrap,
 * .column, side panels) and show #gamesStage with a centered wordmark.
 * Activity panels still render in their original DOM locations — they may
 * appear off-center while game mode is on. Phase 2 will move them into the
 * centered container. For now this lets us verify the empty state + the
 * cam-UI hide work cleanly.
 */
let gameModeOn = false;
onValue(gameModeRef, snap => {
  gameModeOn = snap.val() === true;
  document.body.classList.toggle("game-mode", gameModeOn);
  // Re-evaluate activity-open in case any game's content was active when mode flipped
  refreshActivityOpen();
});

/* Track which gm-* cards are currently shown so we can toggle body.activity-open
   to drive the wordmark slide-up + container grow animations together. */
const gmActiveCards = new Set();
function gmShow(el, key) {
  if (!el) return;
  el.classList.add("show");
  gmActiveCards.add(key);
  refreshActivityOpen();
}
function gmHide(el, key) {
  if (!el) return;
  el.classList.remove("show");
  gmActiveCards.delete(key);
  refreshActivityOpen();
}
function refreshActivityOpen() {
  const open = gameModeOn && gmActiveCards.size > 0;
  document.body.classList.toggle("activity-open", open);
  // Tag the body with the active game family so CSS can scope per-game
  // styling (e.g. trivia uses a narrower container so long answers wrap
  // instead of stretching wide). Keys like "trivia-question" / "polls-bars"
  // share a prefix per game; we strip after the dash.
  const families = new Set();
  for (const key of gmActiveCards) {
    families.add(key.split("-")[0]);
  }
  for (const cls of Array.from(document.body.classList)) {
    if (cls.startsWith("activity-game-")) document.body.classList.remove(cls);
  }
  for (const fam of families) {
    document.body.classList.add(`activity-game-${fam}`);
  }
}

/* ── CARD ANIMATION ── */
function showCard(card, id) {
  visible.add(id);
  card.classList.remove("hiding");
  card.style.display = "block";
  card.offsetHeight; // reflow → ensures transform starts from translateY(22px)
  card.classList.add("show");
  infoPanel.classList.add("has-content");
}

function hideCard(card, id) {
  if (!visible.has(id)) return;
  visible.delete(id);
  // Trigger exit animation
  card.classList.add("hiding");
  card.classList.remove("show");
  setTimeout(() => {
    if (!card.classList.contains("show")) {
      card.classList.remove("hiding");
      card.style.display = "none";
    }
    if (visible.size === 0) infoPanel.classList.remove("has-content");
  }, 380);
}

/* ── STREAM ── */
// Strategy: one persistent frame listener for the whole session.
// On user switch we just update activeUser — the listener automatically
// shows new frames as they arrive. No stop/start = no flicker.

function ensureStream() {
  if (streamOn) return;
  streamOn = true;
  // Heartbeat listener — updated independently of pixel diff skipping
  onValue(heartbeatRef, snap => {
    if (snap.val()) lastHeartbeat = performance.now();
  });
  onValue(frameRef, snap => {
    // Only show frames when someone is actually live
    if (!activeUser) return;
    const val = snap.val();
    // Must be a non-empty string starting with data: to be a valid frame
    if (!val || typeof val !== "string" || !val.startsWith("data:")) return;
    liveImage.src = val;
    showFeed();
    hideEmpty();
    hideBad();
    lastFrame = performance.now();
  });
}

function stopStream() {
  if (!streamOn) return;
  streamOn = false;
  off(frameRef);
  hideFeed();
  hideBad();
  showEmpty();
  setTimeout(() => { if (!streamOn) liveImage.src = ""; }, 500);
}

  });

    const d = snap.val() || {};
    if (d.show && d.text) {
      answerText.textContent = d.text;
      showCard(answerCard, "answer");
      if (gmTriviaAnswerText) crossfadeGmBody(gmTriviaAnswerText, d.text, true);

    } else {
      hideCard(answerCard, "answer");
      gmHide(gmTriviaAnswer, "trivia-answer");

  });
/* Crossfade text content of any .gm-body element. If the new text is the same
 * as the old, no-op (so we don't flicker on idempotent updates). If the element
 * was empty, just set the text directly — the card's own grow animation handles
 * the entry. Otherwise: fade to 0 → swap text → fade back to 1. */
/* Crossfade text content of a .gm-body element.
 *
 * Default mode (opacity-only): fade to 0 → swap text → fade back. The container
 * height changes naturally with content (instant, no animation).
 *
 * Animated-height mode (animateHeight=true): also animates the body's height
 * smoothly between old and new content heights. Use this ONLY when the parent
 * container has a STABLE width (e.g. trivia's fixed-width container). For
 * auto-width containers, locking the body's height while the container is
 * also reacting to content can cause jitter — opacity-only is safer there.
 *
 * Strategy in animated-height mode:
 *   1. Measure current height + width
 *   2. Measure new text's height via off-screen clone at matched width
 *   3. Lock current height inline + fade opacity to 0
 *   4. Swap text while invisible
 *   5. Animate height to new value + fade opacity back in
 *   6. Clear inline styles after transition
 *
 * If new height equals old (same line count), only opacity changes. */
function crossfadeGmBody(target, newText, animateHeight = false) {
  if (!target) return;
  const incoming = String(newText ?? "");
  if (target.textContent === incoming) return; // no-op
  if (target.textContent === "") {
    // First paint — let the card's own enter animation handle it
    target.textContent = incoming;
    return;
  }

  if (!animateHeight) {
    // Simple opacity-only fade — height changes happen instantly
    target.style.opacity = "0";
    setTimeout(() => {
      target.textContent = incoming;
      requestAnimationFrame(() => {
        target.style.opacity = "";
      });
    }, 220);
    return;
  }

  // Animated-height mode
  const startHeight = target.offsetHeight;
  const liveWidth   = target.offsetWidth;

  // Off-screen clone at matched width to measure new text height
  const clone = target.cloneNode(false);
  clone.textContent = incoming;
  clone.style.position = "absolute";
  clone.style.visibility = "hidden";
  clone.style.pointerEvents = "none";
  clone.style.left = "-9999px";
  clone.style.top = "0";
  clone.style.width = liveWidth + "px";
  clone.style.height = "auto";
  clone.style.maxHeight = "none";
  clone.style.opacity = "0";
  clone.style.transition = "none";
  document.body.appendChild(clone);
  const endHeight = clone.offsetHeight;
  clone.remove();

  target.style.height = startHeight + "px";
  target.style.overflow = "hidden";
  target.style.transition = "opacity 0.22s ease, height 0.32s cubic-bezier(0.22, 1, 0.36, 1)";
  target.style.opacity = "0";

  setTimeout(() => {
    target.textContent = incoming;
    requestAnimationFrame(() => {
      target.style.height = endHeight + "px";
      target.style.opacity = "";
    });
    setTimeout(() => {
      target.style.height = "";
      target.style.overflow = "";
      target.style.transition = "";
    }, 360);
  }, 220);
}

  // Debounce reveal hides — when the operator switches between students in
  // game-mode + reveal-mode, control writes a clear-then-set sequence that
  // briefly leaves no key with show:true. Without a small delay before hiding,
  // the class-answer card flickers off → on between students. 600ms is enough
  // to bridge any reasonable round-trip while still hiding promptly when the
  // operator genuinely toggles a reveal off with no follow-up.
  // (timer var is module-scoped so stopTrivia can clear it on reset)
  onValue(revealRef, snap => {
    const r = snap.val() || {};
    const key = Object.keys(r).find(k => r[k]?.show === true);
    if (!key) {
      // Two cases for "no visible reveal":
      // (1) Explicit reset — control writes {__reset: timestamp} when the
      //     operator hits reset. This sentinel means hide NOW, not after a
      //     debounce delay. Detect by checking for the __reset key.
      // (2) Auto-flip intermediate state — control wrote {show:false} on the
      //     previous user but hasn't yet set the new user. Debounce 600ms;
      //     the next listener fire will cancel before the timer runs.
      const isExplicitClear = "__reset" in r ||
        Object.keys(r).every(k => k === "__reset");
      if (isExplicitClear) {
        if (triviaRevealHideTimer) { clearTimeout(triviaRevealHideTimer); triviaRevealHideTimer = null; }
        hideCard(classCard, "class");
        gmHide(gmTriviaClass, "trivia-class");
        return;
      }
      // Auto-flip — debounce briefly. If a key shows up, the next listener
      // fire will cancel this hide before it runs.
      if (triviaRevealHideTimer) clearTimeout(triviaRevealHideTimer);
      triviaRevealHideTimer = setTimeout(() => {
        triviaRevealHideTimer = null;
        hideCard(classCard, "class");
        gmHide(gmTriviaClass, "trivia-class");
      }, 600);
      return;
    }
    // A reveal arrived — cancel any pending hide
    if (triviaRevealHideTimer) { clearTimeout(triviaRevealHideTimer); triviaRevealHideTimer = null; }
    onValue(ref(db, `trivia/answers/${key}`), aSnap => {
      const d = aSnap.val() || {};
      if (d.answer) {
        // Resolve username from participants cache for the eyebrow text
        const userName = participantsCache[key]?.name;
        const eyebrowText = userName ? `${userName.toUpperCase()}'S ANSWER` : "ANSWER";
        // Detect whether this is a fresh open vs flipping while already shown.
        // If the gm card is hidden right now, the upcoming gmShow will play
        // the grow-from-zero animation — we need to swap text BEFORE the
        // grow starts, otherwise the previous student's text briefly shows
        // through during the card's entry animation. Only crossfade when
        // the card is already visible (true student-to-student flip).
        const gmCardWasShown = gmTriviaClass && gmTriviaClass.classList.contains("show");
        if (classEyebrow) classEyebrow.textContent = eyebrowText;
        classText.textContent = d.answer;
        showCard(classCard, "class");
        if (gmCardWasShown) {
          // Card already visible — crossfade between students
          if (gmTriviaClassEyebrow) crossfadeGmBody(gmTriviaClassEyebrow, eyebrowText);
          if (gmTriviaClassText)    crossfadeGmBody(gmTriviaClassText, d.answer, true);
        } else {
          // Card was hidden — set text directly so the grow-in animation
          // shows the correct content from the start
          if (gmTriviaClassEyebrow) gmTriviaClassEyebrow.textContent = eyebrowText;
          if (gmTriviaClassText)    gmTriviaClassText.textContent = d.answer;
        }
        gmShow(gmTriviaClass, "trivia-class");
      } else {
        hideCard(classCard, "class");
        gmHide(gmTriviaClass, "trivia-class");
      }
    }, { onlyOnce: true });
  });
}
let triviaRevealHideTimer = null;
function stopTrivia() {
  if (!triviaOn) return;
