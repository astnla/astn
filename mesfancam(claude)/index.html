<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>MANATEE CAM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --red:#DA1A32; --navy:#00031F; --white:#ffffff; --dim:rgba(0,0,0,0.18); }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{min-height:100vh;background:var(--red);font-family:"DM Sans",sans-serif;color:var(--white);overflow-x:hidden;}
    body{padding-bottom:80px;}
    .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,16px) 24px 0;}
    .wordmark{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;animation:fadeDown 0.4s ease both;}
    .wordmark img{width:48px;height:48px;object-fit:contain;border-radius:8px;margin-bottom:6px;}
    .wordmark-text{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:var(--navy);}
    .viewfinder{position:relative;width:min(82vw,320px);aspect-ratio:3/4;background:var(--dim);border-radius:12px;overflow:hidden;animation:fadeUp 0.4s 0.1s ease both;}
    #preview{width:100%;height:100%;object-fit:cover;display:none;}
    .viewfinder::before,.viewfinder::after{content:"";position:absolute;width:20px;height:20px;border-color:rgba(255,255,255,0.4);border-style:solid;z-index:3;pointer-events:none;}
    .viewfinder::before{top:10px;left:10px;border-width:2px 0 0 2px;border-radius:3px 0 0 0;}
    .viewfinder::after{bottom:10px;right:10px;border-width:0 2px 2px 0;border-radius:0 0 3px 0;}
    #liveBadge{display:none;position:absolute;top:10px;left:10px;background:rgba(255,255,255,0.92);color:var(--red);padding:5px 11px;border-radius:6px;font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:15px;letter-spacing:1px;align-items:center;gap:6px;z-index:10;}
    #liveBadge.show{display:flex;}
    .live-dot{width:8px;height:8px;background:var(--red);border-radius:50%;animation:livePulse 1s ease-in-out infinite;}
    @keyframes livePulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(0.4);opacity:0.4;}}
    #flipBtn{display:none;position:absolute;bottom:10px;right:10px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,0.18);backdrop-filter:blur(4px);cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:transform 0.15s;}
    #flipBtn.show{display:flex;}
    #flipBtn:active{transform:scale(0.9);}
    #flipBtn svg{width:18px;height:18px;stroke:white;fill:none;}
    .cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;}
    .cam-icon{width:44px;height:44px;border:2.5px solid rgba(255,255,255,0.7);border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .cam-icon svg{width:20px;height:20px;stroke:white;fill:none;}
    .cam-label{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:1.5px;color:rgba(255,255,255,0.85);text-align:center;animation:pulse 1.8s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:0.55;}50%{opacity:1;}}

    /* ── TRIVIA ── */
    #triviaBox{display:none;flex-direction:column;gap:10px;width:min(82vw,320px);margin-top:18px;animation:fadeUp 0.3s ease both;}
    #triviaBox.show{display:flex;}
    #triviaInput{padding:12px 14px;border-radius:8px;border:none;background:rgba(255,255,255,0.15);color:white;font-family:"DM Sans",sans-serif;font-size:15px;font-weight:500;outline:none;transition:background 0.2s;}
    #triviaInput::placeholder{color:rgba(255,255,255,0.45);}
    #triviaInput:focus{background:rgba(255,255,255,0.22);}
    #triviaSubmit{padding:12px;border-radius:8px;border:none;background:var(--navy);color:white;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;letter-spacing:1px;cursor:pointer;transition:opacity 0.15s;}
    #triviaSubmit:active{opacity:0.7;}
    #triviaSubmitted{display:none;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:1px;color:rgba(255,255,255,0.9);margin-top:16px;}
    #triviaSubmitted.show{display:block;}

    /* ── POLLS ── */
    #pollBox{display:none;flex-direction:column;gap:12px;width:min(82vw,320px);margin-top:18px;animation:fadeUp 0.3s ease both;}
    #pollBox.show{display:flex;}
    #pollQuestionText{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;letter-spacing:0.5px;color:white;text-align:center;line-height:1.3;}
    #pollOptionsList{display:flex;flex-direction:column;gap:8px;}
    .poll-btn{width:100%;padding:13px 16px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:white;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:0.5px;cursor:pointer;text-align:left;transition:background 0.15s,border-color 0.15s,transform 0.1s;}
    .poll-btn:active{transform:scale(0.98);}
    .poll-btn:hover{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.6);}
    .poll-btn.selected{background:var(--navy);border-color:var(--navy);}
    #pollSubmitted{display:none;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:1px;color:rgba(255,255,255,0.9);margin-top:16px;}
    #pollSubmitted.show{display:block;}

    .legal{margin-top:14px;font-size:10px;line-height:1.5;color:rgba(0,3,31,0.55);text-align:center;max-width:300px;}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  </style>
</head>
<body>
<div class="page">

  <div class="wordmark">
    <img src="assets/mestv.png" alt="MES TV">
    <div class="wordmark-text">MANATEE CAM</div>
  </div>

  <div class="viewfinder" id="viewfinder">
    <video id="preview" autoplay playsinline muted></video>
    <div id="liveBadge"><span class="live-dot"></span>LIVE</div>
    <button id="flipBtn" aria-label="Flip camera">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
    </button>
    <div class="cam-overlay" id="camOverlay">
      <div class="cam-icon">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
        </svg>
      </div>
      <span class="cam-label" id="camLabel">TAP TO ENABLE CAMERA</span>
    </div>
  </div>

  <!-- Trivia -->
  <div id="triviaBox">
    <input id="triviaInput" type="text" placeholder="Type your answer…" autocomplete="off">
    <button id="triviaSubmit">SUBMIT ANSWER</button>
  </div>
  <div id="triviaSubmitted">ANSWER SUBMITTED ✓</div>

  <!-- Polls -->
  <div id="pollBox">
    <div id="pollQuestionText"></div>
    <div id="pollOptionsList"></div>
  </div>
  <div id="pollSubmitted">VOTE SUBMITTED ✓</div>

  <p class="legal">By participating you consent to being filmed and broadcast live. For school use only.</p>
</div>

<script type="module">
import { db } from "./firebase-config.js";
import { ref, set, update, onValue, off } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

/* ── SESSION CHECK ── */
const name    = sessionStorage.getItem("fanCamName");
const userKey = sessionStorage.getItem("fanCamUserKey");
if (!name || !userKey) { window.location.href = "join.html"; }

/* ── ELEMENTS ── */
const preview         = document.getElementById("preview");
const camOverlay      = document.getElementById("camOverlay");
const camLabel        = document.getElementById("camLabel");
const liveBadge       = document.getElementById("liveBadge");
const flipBtn         = document.getElementById("flipBtn");
const triviaBox       = document.getElementById("triviaBox");
const triviaInput     = document.getElementById("triviaInput");
const triviaSubmit    = document.getElementById("triviaSubmit");
const triviaSubmitted = document.getElementById("triviaSubmitted");
const pollBox         = document.getElementById("pollBox");
const pollQuestionText= document.getElementById("pollQuestionText");
const pollOptionsList = document.getElementById("pollOptionsList");
const pollSubmitted   = document.getElementById("pollSubmitted");

/* ── CAMERA STATE ── */
let currentStream    = null;
let currentCamera    = "back";
let streamingEnabled = false;
let isLive           = false;

/* ── STREAMING STATE ── */
let sending       = false;
let lastFrameData = null;
let lastSendTime  = 0;
const MIN_INTERVAL_MS = 120;
const DIFF_THRESHOLD  = 0.015;

/* ── REFS ── */
const activeUserRef = ref(db, "live/activeUser");
const myRef         = ref(db, `participants/${userKey}`);
const triviaModeRef = ref(db, "trivia/mode");
const triviaQRef    = ref(db, "trivia/question");
const pollsModeRef  = ref(db, "polls/mode");
const pollsQRef     = ref(db, "polls/question");
const pollsOptsRef  = ref(db, "polls/options");

/* ── PIXEL DIFF ── */
const diffCanvas = document.createElement("canvas");
diffCanvas.width = 16; diffCanvas.height = 12;
const diffCtx = diffCanvas.getContext("2d");

function hasSignificantChange(sourceCanvas) {
  diffCtx.drawImage(sourceCanvas, 0, 0, 16, 12);
  const pixels = diffCtx.getImageData(0, 0, 16, 12).data;
  if (!lastFrameData) { lastFrameData = new Uint8ClampedArray(pixels); return true; }
  let diff = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    const dr = Math.abs(pixels[i]   - lastFrameData[i]);
    const dg = Math.abs(pixels[i+1] - lastFrameData[i+1]);
    const db2= Math.abs(pixels[i+2] - lastFrameData[i+2]);
    if ((dr + dg + db2) > 30) diff++;
  }
  lastFrameData = new Uint8ClampedArray(pixels);
  return (diff / 64) > DIFF_THRESHOLD;
}

/* ── CAMERA ── */
async function enableCamera() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  camLabel.textContent = "ENABLING…";
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === "videoinput");
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    let constraints;
    if (isIOS) {
      constraints = { video: { facingMode: currentCamera === "front" ? "user" : "environment", width:{ideal:480}, height:{ideal:360} } };
    } else {
      let target;
      if (currentCamera === "front") {
        target = cams.find(c => /front/i.test(c.label) && !/ultra/i.test(c.label)) || cams.find(c => /front/i.test(c.label)) || cams[0];
      } else {
        target = cams.find(c => /back|rear|environment/i.test(c.label)) || cams[cams.length - 1];
      }
      if (!target?.deviceId) target = currentCamera === "front" ? cams[0] : cams[cams.length-1];
      constraints = { video: { deviceId: { exact: target.deviceId }, width:{ideal:480}, height:{ideal:360} } };
    }
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    currentStream = stream;
    preview.srcObject = stream;
    preview.style.display = "block";
    preview.style.transform = currentCamera === "front" ? "scaleX(-1)" : "scaleX(1)";
    camOverlay.style.display = "none";
    flipBtn.classList.add("show");
    update(ref(db, `participants/${userKey}`), { cameraActive: true });
    streamingEnabled = true;
    startFrameLoop();
  } catch(err) {
    camLabel.textContent = "CAMERA ERROR — TAP TO RETRY";
    streamingEnabled = false;
  }
}

/* ── FRAME LOOP ── */
const frameCanvas = document.createElement("canvas");
const frameCtx = frameCanvas.getContext("2d");

function startFrameLoop() {
  function loop() {
    requestAnimationFrame(loop);
    if (!isLive || !streamingEnabled || sending) return;
    if (!preview || preview.readyState < 2) return;
    const now = performance.now();
    if (now - lastSendTime < MIN_INTERVAL_MS) return;
    const targetW = Math.min(preview.videoWidth, 480);
    frameCanvas.width = targetW;
    frameCanvas.height = Math.round(preview.videoHeight * (targetW / preview.videoWidth));
    frameCtx.save();
    if (currentCamera === "front") {
      frameCtx.scale(-1, 1);
      frameCtx.drawImage(preview, -frameCanvas.width, 0, frameCanvas.width, frameCanvas.height);
    } else {
      frameCtx.drawImage(preview, 0, 0, frameCanvas.width, frameCanvas.height);
    }
    frameCtx.restore();
    if (!hasSignificantChange(frameCanvas)) return;
    const jpeg = frameCanvas.toDataURL("image/jpeg", 0.30);
    // Guard: toDataURL returns "data:," if canvas is empty/invalid
    if (!jpeg || !jpeg.startsWith("data:image")) { return; }
    lastSendTime = now;
    sending = true;
    set(ref(db, "live/frame"), jpeg)
      .catch(e => console.warn("Frame write failed:", e))
      .finally(() => { sending = false; });
  }
  loop();
}

/* ── ACTIVE USER ── */
onValue(activeUserRef, snap => {
  isLive = snap.val() === userKey;
  liveBadge.classList.toggle("show", isLive);
  if (!isLive) lastFrameData = null;
});

/* ── CAMERA TAP / FLIP ── */
camOverlay.addEventListener("click", () => {
  if (camOverlay.style.display !== "none") enableCamera();
});
flipBtn.addEventListener("click", async () => {
  streamingEnabled = false;
  currentCamera = currentCamera === "front" ? "back" : "front";
  lastFrameData = null;
  await enableCamera();
  setTimeout(() => { streamingEnabled = true; }, 800);
});

/* ── KICK / SESSION END ── */
onValue(myRef, snap => { if (!snap.exists()) endSession(); });
function endSession() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  document.body.innerHTML = `
    <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#DA1A32;color:white;font-family:'Barlow Condensed',sans-serif;
    font-size:28px;font-weight:900;letter-spacing:2px;text-align:center;padding:24px;gap:12px;">
      <div>THANKS FOR JOINING!</div>
      <div style="font-size:14px;font-weight:400;font-family:'DM Sans',sans-serif;opacity:0.7;letter-spacing:0;">You can close this tab.</div>
    </div>`;
  setTimeout(() => { sessionStorage.clear(); window.location.href = "join.html"; }, 10000);
}

/* ── TRIVIA ── */
let triviaQListener = null;
onValue(triviaModeRef, snap => {
  const on = snap.val() === true;
  if (!on) {
    if (triviaQListener) { off(triviaQRef); triviaQListener = null; }
    triviaBox.classList.remove("show");
    triviaSubmitted.classList.remove("show");
    triviaInput.value = "";
    return;
  }
  if (!triviaQListener) {
    triviaQListener = onValue(triviaQRef, snap => {
      const d = snap.val() || {};
      if (d.show && d.text) {
        triviaBox.classList.add("show");
        triviaSubmitted.classList.remove("show");
        triviaInput.value = "";
      } else {
        triviaBox.classList.remove("show");
        triviaSubmitted.classList.remove("show");
        triviaInput.value = "";
      }
    });
  }
});
triviaSubmit.addEventListener("click", () => {
  const answer = triviaInput.value.trim();
  if (!answer) return;
  update(ref(db, `trivia/answers/${userKey}`), { answer, timestamp: Date.now() });
  triviaBox.classList.remove("show");
  triviaSubmitted.classList.add("show");
});

/* ── POLLS ── */
// Two-listener approach:
// 1. Persistent options listener keeps currentOptions always fresh.
// 2. Question listener calls buildPollButtons() which reads currentOptions.
// Control page writes options BEFORE flipping show:true, so by the time
// the question listener fires, currentOptions is already populated.
// On reset: pollsListening stays true but currentOptions is wiped to {}
// by the options listener when Firebase clears options — so a new poll
// send re-populates currentOptions before show:true flips again.

let currentOptions = {};
let hasVoted       = false;
let pollsListening = false;

function buildPollButtons() {
  pollOptionsList.innerHTML = "";
  const sorted = Object.entries(currentOptions)
    .sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0));
  for (const [key, opt] of sorted) {
    const btn = document.createElement("button");
    btn.className = "poll-btn";
    btn.textContent = opt.label;
    btn.onclick = () => {
      if (hasVoted) return;
      hasVoted = true;
      document.querySelectorAll(".poll-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      update(ref(db, `polls/votes/${userKey}`), {
        optionKey: key,
        label: opt.label,
        timestamp: Date.now()
      });
      setTimeout(() => {
        pollBox.classList.remove("show");
        pollSubmitted.classList.add("show");
      }, 400);
    };
    pollOptionsList.appendChild(btn);
  }
}

onValue(pollsModeRef, snap => {
  const on = snap.val() === true;

  if (!on) {
    // Polls turned off — detach everything and reset
    if (pollsListening) {
      off(pollsOptsRef);
      off(pollsQRef);
      pollsListening = false;
    }
    pollBox.classList.remove("show");
    pollSubmitted.classList.remove("show");
    pollOptionsList.innerHTML = "";
    currentOptions = {};
    hasVoted = false;
    return;
  }

  if (pollsListening) return; // already attached, persistent listeners handle updates
  pollsListening = true;

  // Persistent options listener — updates currentOptions any time options change.
  // This means on reset (options set to null) currentOptions goes to {},
  // and on new poll send (options written before show:true) it repopulates
  // before the question listener fires.
  onValue(pollsOptsRef, snap => {
    currentOptions = snap.val() || {};
  });

  // Question listener — reads from currentOptions which is always current
  onValue(pollsQRef, snap => {
    const d = snap.val() || {};
    if (d.show && d.text) {
      hasVoted = false;
      pollSubmitted.classList.remove("show");
      pollQuestionText.textContent = d.text;
      buildPollButtons();
      pollBox.classList.add("show");
    } else {
      // Question hidden (reset) — clear UI, stay listening for next poll
      pollBox.classList.remove("show");
      pollSubmitted.classList.remove("show");
      pollOptionsList.innerHTML = "";
      hasVoted = false;
    }
  });
});

/* ── VISIBILITY ── */
document.addEventListener("visibilitychange", () => {
  streamingEnabled = !document.hidden;
});
</script>
</body>
</html>
